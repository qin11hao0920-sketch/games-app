<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFEDCE">
<link rel="icon" href="logo/icon-.svg" type="image/svg+xml">
<title>水果叠叠乐</title>
<style>
/* ===== CSS 变量：主要颜色与尺寸 ===== */
:root{
  --bg1:#FFF8E9; --bg2:#FFEDCE;
  --board-bg:#FFE0AC; --board-bd:#F5C87F;
  --tile-bg1:#FFFFFF; --tile-bg2:#FFEDC9;
  --tile-bd:#FFC46B; --tile-bd-hi:#FF9F2E;
  --text:#7A4A21; --text-soft:#B98A55;
  --slot:#FFF9EF; --slot-bd:#EBD3A8;
  --tray-gap:7px;
  --slot-w:calc((100% - (var(--slot-n,7) - 1)*var(--tray-gap)) / var(--slot-n,7));   /* 槽宽随容量 --slot-n 自适应，默认 7 格 */
  --slot-h:clamp(48px, 13vw, 62px);                  /* 移动端放大卡槽，保证水果和触控区域足够大 */
  --logo-h:44px;                                    /* ★ Logo 大小：改这个数字即可调整顶部 logo 高度（宽度自动等比） */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation; overscroll-behavior:none;
}
#app{
  height:100vh; height:100dvh;
  max-width:560px; margin:0 auto;
  display:flex; flex-direction:column; gap:8px;
  padding:
    calc(10px + env(safe-area-inset-top))
    calc(12px + env(safe-area-inset-right))
    calc(10px + env(safe-area-inset-bottom))
    calc(12px + env(safe-area-inset-left));
}
.hidden{display:none !important;}
/* ===== 顶部标题 / 关卡 / 剩余数量 ===== */
header{display:flex;justify-content:space-between;align-items:center;gap:8px;}
header h1{font-size:20px;letter-spacing:1px;text-shadow:0 1px 0 #fff;white-space:nowrap;}
/* 顶部 logo 图片：高度由 --logo-h 控制，宽度自动等比缩放 */
#logo{height:var(--logo-h);width:auto;display:block;}
.pills{display:flex;gap:6px;align-items:center;}
.pill{
  background:rgba(255,255,255,.75);padding:4px 12px;border-radius:999px;
  font-size:13px;color:var(--text-soft);box-shadow:0 1px 3px rgba(122,74,33,.12);white-space:nowrap;
}
.pill b{color:var(--text);font-size:15px;}
.pill.tap{cursor:pointer;font-weight:700;}
.pill.tap:active{transform:scale(.94);}
/* ===== 棋盘 ===== */
#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
#board{
  position:relative;
  background:radial-gradient(circle at 50% 30%, #FFE9BE, var(--board-bg));
  border:2px solid var(--board-bd);border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 0 4px rgba(255,255,255,.35), 0 6px 14px rgba(122,74,33,.18);
}
.tile{position:absolute;transition:left .36s ease,top .36s ease,transform .18s ease;touch-action:none;}
.tile-inner{
  position:absolute;inset:3px;border-radius:24%;
  background:linear-gradient(180deg,var(--tile-bg1) 20%,var(--tile-bg2));
  border:2.5px solid var(--tile-bd);
  box-shadow:0 2px 0 rgba(122,74,33,.18);
  display:flex;align-items:center;justify-content:center;
  transition:filter .18s ease, transform .08s ease, box-shadow .18s ease;
  /* 发牌式入场动画，按 --d 错开 */
  animation:dealIn .32s ease backwards;
  animation-delay:calc(var(--d,0) * .028s);
}
/* 贴纸高光 */
.tile-inner::after,.slice::after{
  content:'';position:absolute;top:10%;left:18%;width:32%;height:14%;
  background:rgba(255,255,255,.95);border-radius:999px;transform:rotate(-18deg);
}
/* 卡片图案：内嵌 SVG 食物贴纸，随卡片缩放 */
.tile-inner svg,.slice svg{position:relative;z-index:2;width:76%;height:76%;pointer-events:none;}
/* 16 种食物专属糖果配色（f0=桃子 f1=草莓 f2=樱桃 f3=饼干 f4=苹果 f5=糖果 f6=面包 f7=煎鸡蛋 f8=水果千层 f9=薯条 f10=汉堡包 f11=墨西哥卷饼 f12=蘑菇 f13=玉米 f14=果冻 f15=龙虾） */
.tile-inner.f0,.slice.f0{background:linear-gradient(180deg,#FFE5D6,#FFD2B8);border-color:#F7A671;}
.tile-inner.f1,.slice.f1{background:linear-gradient(180deg,#FFDDE3,#FFC2CD);border-color:#F58A9C;}
.tile-inner.f2,.slice.f2{background:linear-gradient(180deg,#FFD9DE,#FFBEC9);border-color:#E66A7E;}
.tile-inner.f3,.slice.f3{background:linear-gradient(180deg,#F6E4CC,#EED3AD);border-color:#D2A76B;}
.tile-inner.f4,.slice.f4{background:linear-gradient(180deg,#FFE2E2,#FFC8C8);border-color:#F08B8B;}
.tile-inner.f5,.slice.f5{background:linear-gradient(180deg,#DFF6E9,#C6ECDA);border-color:#74C9A1;}
.tile-inner.f6,.slice.f6{background:linear-gradient(180deg,#FBECCB,#F6DCAB);border-color:#DEAD65;}
.tile-inner.f7,.slice.f7{background:linear-gradient(180deg,#FFF7C8,#FFECA0);border-color:#EBC64D;}
.tile-inner.f8,.slice.f8{background:linear-gradient(180deg,#FFE3E8,#FFCBD8);border-color:#F58FB0;}
.tile-inner.f9,.slice.f9{background:linear-gradient(180deg,#F9ECCF,#F1DFB4);border-color:#DDB873;}
.tile-inner.f10,.slice.f10{background:linear-gradient(180deg,#FFE8CC,#FFD8A8);border-color:#EFA45A;}
.tile-inner.f11,.slice.f11{background:linear-gradient(180deg,#FBF0D8,#F3E0B6);border-color:#DCB56A;}
.tile-inner.f12,.slice.f12{background:linear-gradient(180deg,#F3EAE0,#E7DAC8);border-color:#C6AD85;}
.tile-inner.f13,.slice.f13{background:linear-gradient(180deg,#FFF3B8,#FFE78C);border-color:#E3BE3F;}
.tile-inner.f14,.slice.f14{background:linear-gradient(180deg,#FFE4EC,#FFC9DB);border-color:#F08BB4;}
.tile-inner.f15,.slice.f15{background:linear-gradient(180deg,#FFE3DD,#FFC9C0);border-color:#EE8A7B;}
.tile-inner.f16,.slice.f16{background:linear-gradient(180deg,#EADFFF,#D7C8FF);border-color:#8D72D8;}
/* 可点击：高亮 */
.tile.uncovered .tile-inner{
  border-color:#FF8A2E;
  box-shadow:0 3px 8px rgba(255,142,36,.4), 0 3px 0 rgba(122,74,33,.16);
}
/* 被遮挡：降低亮度 */
.tile.blocked .tile-inner{filter:brightness(.9) saturate(.86);opacity:.82;}
.tile.blocked .tile-inner svg{opacity:.72;}
.tile.blocked .tile-inner::after{opacity:.7;}
/* 第6关起的特殊方块状态：保留水果线索，同时明确提示不可点击原因 */
.tile.locked .tile-inner::before,.tile.frozen .tile-inner::before{
  position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  font-size:clamp(20px,7vw,42px);font-weight:900;line-height:1;pointer-events:none;
  text-shadow:0 1px 2px rgba(50,30,10,.28);
}
.tile.locked .tile-inner::before{content:'⛓';color:#59616A;background:rgba(93,104,113,.16);}
.tile.frozen .tile-inner::before{content:'❄';color:#2F9FC2;background:rgba(166,231,247,.32);}
.tile.locked .tile-inner,.tile.frozen .tile-inner{filter:brightness(.92) saturate(.9);}
#board.dual-zone::after{content:'';position:absolute;top:3%;bottom:3%;left:50%;border-left:2px dashed rgba(122,74,33,.32);pointer-events:none;z-index:8000;}
@media (hover:hover){
  .tile.uncovered{cursor:pointer;}
  .tile.uncovered:hover .tile-inner{box-shadow:0 0 12px rgba(255,159,46,.6), 0 3px 0 rgba(122,74,33,.16);}
}
.tile.uncovered:active .tile-inner{transform:scale(.92);}
/* 轻微错开层级，让下层方块露出边缘；预览时临时把遮挡方块分开 */
.tile.peek-target{z-index:1990 !important;}
.tile.peek-target .tile-inner{border-color:#25A9B9;box-shadow:0 0 0 3px rgba(37,169,185,.28),0 3px 8px rgba(37,169,185,.35);filter:none;opacity:1;}
.tile.peek-target .tile-inner svg{opacity:1;}
.tile.peek-coverer{z-index:2000 !important;}
.tile.peek-coverer .tile-inner{border-color:#FF7A45;box-shadow:0 0 0 3px rgba(255,122,69,.28),0 3px 8px rgba(255,122,69,.35);}
/* ===== 暂存槽（7 格，固定高度保证水果显示） ===== */
#tray{
  position:relative;width:100%;max-width:380px;margin:0 auto;
  background:rgba(255,255,255,.4);padding:10px;border-radius:18px;
  box-shadow:inset 0 1px 4px rgba(122,74,33,.08);
}
#trayInner{position:relative;width:100%;display:flex;gap:var(--tray-gap);}
.slot{
  position:relative;width:var(--slot-w);height:var(--slot-h);
  border:2px dashed var(--slot-bd);border-radius:24%;
  background:var(--slot);opacity:.85;
}
.slice{
  position:absolute;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--tile-bg1) 20%,var(--tile-bg2));
  border:2px solid var(--tile-bd);border-radius:24%;
  box-shadow:0 2px 0 rgba(122,74,33,.15);
  pointer-events:none;
}
.slot .slice{inset:3px;}
/* 三消残影：在原槽位短暂淡出 */
.slice.cleared{
  top:3px;height:calc(var(--slot-h) - 6px);width:calc(var(--slot-w) - 6px);z-index:6;
  animation:clearOut .26s ease forwards;
}
.slice.pop{animation:pop .18s ease-out;}
/* ===== 按钮 ===== */
#controls{width:100%;max-width:380px;margin:0 auto;display:flex;gap:12px;}
.btn{
  flex:1;min-height:46px;border:none;border-radius:14px;
  color:#fff;font-size:15px;font-weight:700;letter-spacing:1px;
  cursor:pointer;box-shadow:0 3px 0 rgba(122,74,33,.22);
  touch-action:manipulation;user-select:none;
}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 rgba(122,74,33,.22);}
.btn.dim{filter:grayscale(.55);opacity:.7;}
.btn-teal{background:linear-gradient(180deg,#41B8C9,#2E93AE);}
.btn-purple{background:linear-gradient(180deg,#A78BE8,#7E5FD6);}
.btn-orange{background:linear-gradient(180deg,#FFB03A,#FF7A45);}
/* ===== 动画 ===== */
@keyframes dealIn{from{transform:scale(.4) translateY(-8px);opacity:.3;}to{transform:scale(1) translateY(0);opacity:1;}}
@keyframes shake{
  0%,100%{transform:translateX(0) rotate(var(--r,0deg));}20%{transform:translateX(-5px) rotate(var(--r,0deg));}
  40%{transform:translateX(5px) rotate(var(--r,0deg));}60%{transform:translateX(-4px) rotate(var(--r,0deg));}
  80%{transform:translateX(4px) rotate(var(--r,0deg));}
}
.tile.shake{animation:shake .3s ease;}
@keyframes shuff{
  0%,100%{transform:scale(1);}50%{transform:scaleX(.12) scaleY(1.06) rotate(6deg);}
}
.tile.shuffling .tile-inner{animation:shuff .4s ease;}
@keyframes fly{to{opacity:0;transform:translateY(24%) scale(.5);}}
.tile.fly{z-index:1000;pointer-events:none;opacity:0;}
.tile-flight{
  position:fixed;z-index:10002;pointer-events:none;margin:0;
  transform-origin:center center;
  transition:transform .28s cubic-bezier(.2,.78,.3,1),opacity .28s ease;
}
.tile-flight .tile-inner{inset:0;animation:none !important;}
@keyframes pop{0%{transform:scale(.2);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
@keyframes clearOut{to{opacity:0;transform:scale(.5) translateY(10px);}}
@keyframes modalPop{from{transform:scale(.8);opacity:.4;}to{transform:scale(1);opacity:1;}}
/* ===== Toast 提示 ===== */
#toast{
  position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(8px);
  background:rgba(58,38,18,.88);color:#fff;font-size:13px;
  padding:9px 18px;border-radius:999px;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s;z-index:10001;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* ===== 胜负弹窗 ===== */
#modal{
  position:fixed;inset:0;z-index:10000;background:rgba(50,30,10,.5);
  display:flex;align-items:center;justify-content:center;
  visibility:hidden;opacity:0;transition:opacity .2s;
  padding:0 24px;
}
#modal.show{visibility:visible;opacity:1;}
.card{
  width:min(84vw,320px);background:var(--bg1);border-radius:22px;
  padding:28px 22px 22px;text-align:center;
  box-shadow:0 12px 34px rgba(50,30,10,.3);
}
#modal.show .card{animation:modalPop .25s cubic-bezier(.5,1.6,.4,1);}
#m-emoji{font-size:54px;line-height:1;}
#m-title{font-size:20px;font-weight:800;margin-top:8px;}
#m-sub{font-size:13px;color:var(--text-soft);margin-top:6px;}
#m-btns{display:flex;gap:10px;margin-top:18px;}
/* ===== 选关弹窗 ===== */
#levelModal{
  position:fixed;inset:0;z-index:9500;background:rgba(50,30,10,.5);
  display:flex;align-items:center;justify-content:center;
  visibility:hidden;opacity:0;transition:opacity .2s;
  padding:0 20px;
}
#levelModal.show{visibility:visible;opacity:1;}
#levelModal.show .card{animation:modalPop .25s cubic-bezier(.5,1.6,.4,1);}
#lm-title{font-size:18px;font-weight:800;}
#lm-grid{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px;justify-content:center;max-width:360px;}
.lv{
  width:52px;height:62px;border:none;border-radius:14px;
  background:linear-gradient(180deg,#FFB03A,#FF7A45);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;box-shadow:0 2px 0 rgba(122,74,33,.2);
}
.lv b{font-size:18px;line-height:1;}
.lv i{font-style:normal;font-size:10px;font-weight:600;opacity:.95;}
.lv.disabled{background:#CFC5B8;box-shadow:none;opacity:.72;cursor:not-allowed;}
#lm-hint{font-size:12px;color:var(--text-soft);margin-bottom:12px;}
/* ===== 横屏紧凑布局 ===== */
@media (orientation:landscape) and (max-height:560px){
  #app{gap:4px;padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:calc(4px + env(safe-area-inset-bottom));}
  header h1{font-size:16px;}
  #logo{height:32px;}         /* 横屏下 logo 稍小 */
  .pill{font-size:12px;padding:3px 10px;}
  .btn{min-height:40px;font-size:14px;}
  #tray{max-width:340px;padding:7px;--slot-h:clamp(42px, 10vw, 50px);}
}
</style>

<script>
(function(){
'use strict';

/* ================= 常量与全局状态 ================= */
// 16 种食物贴纸（food-0~food-15，顺序：桃子/草莓/樱桃/饼干/苹果/糖果/面包/煎鸡蛋/水果千层/薯条/汉堡包/墨西哥卷饼/蘑菇/玉米/果冻/龙虾）

// 每局固定：暂存槽 7 格、洗牌 3 次、清空卡槽 3 次；难度只由关卡牌面和层级决定

// 难度配置：sets 为组数，counts 为 16 种食物各自的数量（均为 3 的倍数），layers 为每组方块的层级数
// 层级配方：每层由一个或多个小区块组成 [列数,行数,x偏移,y偏移]，按序自下而上，同一配方内格子总数均为 36
// 关卡越往后层数越多、叠得越深；牌面生成保留一条可通关路径。
var LAYER_RECIPES = {
  3: [[5,4,0,0],[4,3,0.5,0.5],[2,2,1,1]],
  // 每组都以 5×4 底盘铺满棋盘；额外层分散到四角、上下边缘与中部，避免牌面只在中央堆高。
  4: [
    [5,4,0,0], [2,2,0,0], [2,2,3,2],

  ],
  6: [
    [5,4,0,0], [2,1,0,0], [2,1,3,0], [2,1,0,3], [2,1,3,3],
    [[2,1,3,0],[2,1,0,3],[2,1,1.5,.75],[2,1,1.5,2.25]]
  ],
  // 20 块铺满底层；其余 16 块均匀覆盖边缘和中部，总数仍为 36 块/组。
  9: [
    [5,4,0,0], [2,1,0,0], [1,1,2,0], [1,1,4,0], [1,1,0,3],
    [1,1,2,3], [1,1,4,3], [1,1,0,1.5],
    [[2,1,3,0],[2,1,0,3],[2,1,1.5,.75],[2,1,1.5,2.25]]
  ]
};
var LEVELS = [
  { sets:2, counts:[6,6,6,6,6,6,6,6,6,6,6,6,0,0,0,0],             layers:3 },

/* ================= 通用工具 ================= */
function shuffleArray(a){
  for(var i=a.length-1;i>0;i--){
    var j=(Math.random()*(i+1))|0;
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function tileEl(id){ return document.getElementById('tile-'+id); }
function setKind(t,k){ t.kind=k; }
function foodSymbolId(kind){ return kind===9 ? 'food-9-fries' : (kind===WILD_KIND ? 'food-wild' : 'food-'+kind); }

/* ================= 关卡生成 ================= */
// 每关 sets 组，每组按 LAYER_RECIPES[level.layers] 的配方自下而上叠放（每组 36 块），组与组之间层层叠压
function generateLayout(level){
  var recipe = LAYER_RECIPES[level.layers] || LAYER_RECIPES[3];
  var tiles=[], ids=0;
  function push(x,y,layer,stack){ tiles.push({ id:ids++, kind:0, x:x, y:y, layer:layer, stack:stack, removed:false, moving:false }); }
  for(var s=0;s<level.sets;s++){
    var b=s*recipe.length;
    for(var li=0;li<recipe.length;li++){
      var layerSpecs=Array.isArray(recipe[li][0]) ? recipe[li] : [recipe[li]];
      layerSpecs.forEach(function(spec){
        var cols=spec[0], rows=spec[1], dx=spec[2], dy=spec[3];
        for(var r=0;r<rows;r++){ for(var c=0;c<cols;c++) push(c+dx, r+dy, b+li, s); }
      });
    }
  }
  // 后续由 spreadTilesEvenly 统一铺满棋盘，并据此重新计算遮挡关系。
  return tiles;
}
// 将当前牌面按轮次均分到全棋盘的 9×7 个锚点；不管剩多少牌，四边和中部都有牌。
function spreadTilesEvenly(tiles){
  var anchors=[];
  for(var row=0;row<7;row++){
    for(var col=0;col<9;col++) anchors.push({ x:col*.5, y:row*.5 });
  }
  var placed=0;
  while(placed<tiles.length){
    var round=anchors.slice();
    shuffleArray(round);
    for(var i=0;i<round.length && placed<tiles.length;i++,placed++){
      tiles[placed].x=round[i].x;
      tiles[placed].y=round[i].y;
    }
  }
}
// 第10～11关使用左右双区域布局；同一区域内仍按锚点轮次铺开，保证手机端边缘和中部都有牌。
function spreadTeleportTiles(){
  var byZone=[[],[]], anchors=[[],[]];
  for(var row=0;row<7;row++){
    for(var col=0;col<5;col++) anchors[0].push({x:col*.5,y:row*.5});
    for(col=4;col<9;col++) anchors[1].push({x:col*.5,y:row*.5});
  }
  state.tiles.forEach(function(t){ if(!t.removed) byZone[t.zone===1?1:0].push(t); });
  byZone.forEach(function(group,zone){
    var placed=0;
    while(placed<group.length){
      var round=anchors[zone].slice(); shuffleArray(round);
      for(var i=0;i<round.length&&placed<group.length;i++,placed++){
        group[placed].x=round[i].x; group[placed].y=round[i].y;
      }
    }
  });
}
function spreadCurrentBoard(){
  if(state.special && state.special.type==='teleport') spreadTeleportTiles();
  else spreadTilesEvenly(state.tiles.filter(function(t){ return !t.removed; }));
}
// 有效移除顺序：层级从高到低（高层全部移除后，低层必然全部可见）
function removeOrder(tiles){
  return tiles.slice().sort(function(a,b){ return b.layer-a.layer || (a.x+a.y)-(b.x+b.y); });
}
// 关卡牌堆：按难度配置展开成食物序号列表（每种数量均为 3 的倍数）
function levelMultiset(level){
  var a=[];
  for(var i=0;i<FOOD_N;i++) for(var k=0;k<level.counts[i];k++) a.push(i);
  for(var w=0;w<(level.wild||0);w++) a.push(WILD_KIND);
  return a;
}
// 分配食物种类：每次生成都会先验证存在通关路径，避免出现无解关卡。
function assignFruits(tiles, trayFruits, multiset, trayCap, level){
  if(!multiset) multiset = tiles.map(function(t){ return t.kind; });
  var allTripleSafe = true;
  for(var q=0;q<FOOD_N;q++){
    if(multiset.filter(function(v){ return v===q; }).length % 3 !== 0) allTripleSafe = false;
  }
  for(var attempt=0; attempt<40; attempt++){
    shuffleArray(multiset);
    tiles.forEach(function(t,i){ setKind(t, multiset[i]); });
    if(simWinnable(tiles, trayFruits, trayCap)) return;
  }
  if(allTripleSafe){ assignTriples(tiles, multiset); }
  else{ shuffleArray(multiset); tiles.forEach(function(t,i){ setKind(t, multiset[i]); }); }
}
function availableShuffleTiles(tiles){
  return tiles.filter(function(t){ return !t.removed && !specialBlocked(t) && !isOccluded(t); });
}
function hasShuffleOpportunity(tiles, trayFruits){
  var candidates=availableShuffleTiles(tiles), trayCounts={}, candidateCounts={};
  var trayWild=0, candidateWild=0, trayHasCard=(trayFruits||[]).length>0;
  (trayFruits||[]).forEach(function(kind){
    if(kind===WILD_KIND) trayWild++; else trayCounts[kind]=(trayCounts[kind]||0)+1;
  });
  candidates.forEach(function(t){
    if(t.kind===WILD_KIND) candidateWild++; else candidateCounts[t.kind]=(candidateCounts[t.kind]||0)+1;
  });
  function canUseTray(normalNeeded,wildNeeded,kind){
    var totalNormal=(trayCounts[kind]||0)+(candidateCounts[kind]||0);
    var totalWild=trayWild+candidateWild;
    if(totalNormal<normalNeeded || totalWild<wildNeeded) return false;
    if(!trayHasCard) return candidateCounts[kind]>=normalNeeded && candidateWild>=wildNeeded;
    var trayUsed=Math.min(trayCounts[kind]||0,normalNeeded)+Math.min(trayWild,wildNeeded);
    return trayUsed>0 && (candidateCounts[kind]>0 || candidateWild>0);
  }
  for(var kind=0;kind<FOOD_N;kind++){
    if(canUseTray(3,0,kind) || canUseTray(2,1,kind) || canUseTray(1,2,kind)) return true;
  }
  var allWild=trayWild+candidateWild;
  if(allWild>=3){
    return trayHasCard ? trayWild>0 && candidateWild>0 : candidateWild>=3;
  }
  return false;
}
function forceShuffleOpportunity(tiles, trayFruits){
  var candidates=availableShuffleTiles(tiles), boardCounts={}, trayCounts={}, trayWild=0;
  if(!candidates.length) return false;
  tiles.forEach(function(t){ boardCounts[t.kind]=(boardCounts[t.kind]||0)+1; });
  (trayFruits||[]).forEach(function(kind){
    if(kind===WILD_KIND) trayWild++; else trayCounts[kind]=(trayCounts[kind]||0)+1;
  });
  var plans=[];
  for(var kind=0;kind<FOOD_N;kind++){
    [[3,0],[2,1],[1,2]].forEach(function(combo){
      var needKind=Math.max(0,combo[0]-(trayCounts[kind]||0));
      var needWild=Math.max(0,combo[1]-trayWild);
      var usesTray=(trayCounts[kind]||0)+trayWild>0;
      if((trayFruits||[]).length && !usesTray) return;
      if(needKind+needWild<=candidates.length && (boardCounts[kind]||0)>=needKind && (boardCounts[WILD_KIND]||0)>=needWild){
        plans.push({kind:kind, normal:needKind, wild:needWild});
      }
    });
  }
  if(!(trayFruits||[]).length && (boardCounts[WILD_KIND]||0)>=3 && candidates.length>=3) plans.push({kind:WILD_KIND,normal:0,wild:3});
  if(!plans.length) return false;
  plans.sort(function(a,b){ return (a.normal+a.wild)-(b.normal+b.wild); });
  var plan=plans[0], wanted=[];
  for(var n=0;n<plan.normal;n++) wanted.push(plan.kind);
  for(n=0;n<plan.wild;n++) wanted.push(WILD_KIND);
  var protectedTiles=[];
  wanted.forEach(function(kind){
    var target=null;
    for(var i=0;i<candidates.length;i++){
      if(protectedTiles.indexOf(candidates[i])<0 && candidates[i].kind===kind){ target=candidates[i]; break; }
    }
    if(!target) for(i=0;i<candidates.length;i++) if(protectedTiles.indexOf(candidates[i])<0){ target=candidates[i]; break; }
    if(!target) return;
    if(target.kind!==kind){
      var donor=null;
      for(i=0;i<tiles.length;i++) if(tiles[i].kind===kind && protectedTiles.indexOf(tiles[i])<0 && tiles[i]!==target){ donor=tiles[i]; break; }
      if(!donor) return;
      var old=target.kind; target.kind=kind; donor.kind=old;
    }
    protectedTiles.push(target);
  });
  // 若匹配组合本身未改变牌面，额外交换两张非保留牌，确保本次洗牌真的有变化。
  var first=null, second=null;
  for(var a=0;a<tiles.length&&!second;a++){
    if(protectedTiles.indexOf(tiles[a])>=0) continue;
    for(var b=a+1;b<tiles.length;b++){
      if(protectedTiles.indexOf(tiles[b])<0 && tiles[a].kind!==tiles[b].kind){ first=tiles[a]; second=tiles[b]; break; }
    }
  }
  if(first&&second){ var temp=first.kind; first.kind=second.kind; second.kind=temp; }
  return hasShuffleOpportunity(tiles,trayFruits);
}
// 道具洗牌：只重排当前棋盘上剩余牌的水果种类；卡槽非空时必须立即能接上卡槽三消，空槽时必须有可点击三消。
function reshuffleRemainingFruits(tiles, trayFruits, trayCap){
  if(!tiles.length) return false;
  var original=tiles.map(function(t){ return t.kind; }), pool=original.slice();
  function sameKinds(a,b){ for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }
  for(var attempt=0;attempt<60;attempt++){
    pool=original.slice(); shuffleArray(pool);
    if(sameKinds(pool,original) && pool.length>1){
      var first=pool.shift(); pool.push(first);
    }
    tiles.forEach(function(t,i){ setKind(t,pool[i]); });
    if(hasShuffleOpportunity(tiles,trayFruits) && simWinnable(tiles,trayFruits,trayCap)) return true;
  }
  // 随机方案未命中时，在当前可点击区域定向补出与卡槽相接的一组牌；仍只交换现有牌种。
  if(forceShuffleOpportunity(tiles,trayFruits) && hasShuffleOpportunity(tiles,trayFruits)) return !sameKinds(tiles.map(function(t){ return t.kind; }),original);
  // 无法接上卡槽时不消耗洗牌，也不留下无效牌面。
  tiles.forEach(function(t,i){ setKind(t,original[i]); });
  return false;
}
// 随机生成一条合法的取牌顺序：每次只从当前未被遮挡的方块中取，保证牌面存在解法
function playableOrder(tiles){
  var removed=new Array(tiles.length).fill(false), coverers=tiles.map(function(_,i){ return getCoverers(tiles,i); }), order=[];
  while(order.length<tiles.length){
    var candidates=[];
    tiles.forEach(function(t,i){
      if(!removed[i] && coverers[i].every(function(j){ return removed[j]; })) candidates.push(i);
    });
    var pick=candidates[(Math.random()*candidates.length)|0];
    removed[pick]=true;
    order.push(tiles[pick]);
  }
  return order;
}
// 生成高压的安全取牌序列：尽量先堆出 6 个不同/未完成的方块，再被迫寻找三消
function makeHardSequence(multiset, trayCap){
  var remaining=[], pending=new Array(FOOD_N).fill(0), result=[];
  for(var i=0;i<FOOD_N;i++) remaining[i]=0;
  multiset.forEach(function(k){ remaining[k]++; });
  var len=0;
  while(result.length<multiset.length){
    var available=[];
    for(var k=0;k<FOOD_N;k++){
      if(remaining[k]<=0) continue;
      available.push(k);
    }
    var candidates=available.filter(function(k){ return pending[k]<2; });
    if(len===trayCap-2){
      var extend=candidates.filter(function(k){ return pending[k]===1; });
      if(extend.length) candidates=extend;
      else candidates=available.filter(function(k){ return pending[k]===2; });
    }else if(len>=trayCap-1){
      candidates=available.filter(function(k){ return pending[k]===2; });
    }
    // 某种牌只剩最后一张时，允许直接完成已有二张组合；避免生成器卡死。
    if(!candidates.length) candidates=available.filter(function(k){ return pending[k]===2; });
    if(!candidates.length) candidates=available;
    var pick=candidates[(Math.random()*candidates.length)|0];
    result.push(pick); remaining[pick]--; pending[pick]++; len++;
    if(pending[pick]>=3){ pending[pick]-=3; len-=3; }
  }
  return result;
}
// 成组三连分配：沿一条真实可点击的取牌顺序放入，作为始终存在的保底通关路径。
function assignTriples(tiles, multiset){
  var m = multiset.slice(), groups = [];
  while(m.length){
    var f = m[0]; groups.push(f);
    for(var k=0;k<3;k++) m.splice(m.indexOf(f),1);
  }
  shuffleArray(groups);
  var order = playableOrder(tiles);
  order.forEach(function(t,i){ setKind(t, groups[(i/3)|0]); });
}
function assignSpecialGroups(order){
  var m=state.tiles.map(function(t){ return t.kind; }), groups=[];
  while(m.length){
    var f=m[0], group=[];
    for(var i=0;i<3;i++){
      var idx=m.indexOf(f);
      if(idx<0) break;
      group.push(f); m.splice(idx,1);
    }
    if(group.length===3) groups.push(group[0]);
    else break;
  }
  shuffleArray(groups);
  order.forEach(function(t,i){ setKind(t, groups[(i/3)|0]); });
}
function tileNeighbors(t){
  return state.tiles.filter(function(other){
    return other!==t && !other.reserve && Math.abs(other.x-t.x)<=1.05 && Math.abs(other.y-t.y)<=1.05;
  });
}
function selectDistributedRouteTiles(order, count, need){
  var picks=[], first=12, last=Math.max(first,order.length-14), span=Math.max(1,last-first);
  for(var slot=0;slot<count;slot++){
    var target=first+Math.round(span*(count===1?0:slot/(count-1))), found=null;
    for(var radius=0;radius<order.length&&!found;radius++){
      var indexes=[target+radius,target-radius];
      for(var q=0;q<indexes.length;q++){
        var i=indexes[q], t=order[i];
        if(!t || picks.indexOf(t)>=0) continue;
        if(need && tileNeighbors(t).filter(function(other){ return order.indexOf(other)<i; }).length<need) continue;
        found=t; break;
      }
    }
    if(found) picks.push(found);
  }
  return picks;
}
function configureNeighborBlocks(order, prop, count, need){
  var picks=selectDistributedRouteTiles(order,count,need);
  if(picks.length<count){
    for(var i=6;i<order.length && picks.length<count;i++){
      var fallback=order[i];
      if(picks.indexOf(fallback)>=0 || fallback.kind===WILD_KIND) continue;
      picks.push(fallback);
    }
  }
  picks.slice(0,count).forEach(function(t){
    t[prop]=true; t.specialNeed=need; t.specialType=prop; t.specialUnlocked=false;
  });
}
function setupSpecialLevel(level){
  state.special=null;
  if(state.level<6 || !level.special) return;
  state.special={type:level.special, clearCount:0, moves:0, refillPending:false,
    teleportsLeft:level.teleports||0, teleportUses:0, reserveTiles:[]};
  state.tiles.forEach(function(t){
    t.locked=false; t.frozen=false; t.specialNeed=0; t.specialType='';
    t.specialUnlocked=false; t.reserve=false; t.zone=(t.x>=2.5?1:0);
  });
  var active=state.tiles.slice();
  if(level.special==='teleport'){
    var reserveCount=Math.min(level.reserve||0,active.length-3);
    state.special.reserveTiles=active.splice(active.length-reserveCount,reserveCount);
    state.special.reserveTiles.forEach(function(t,i){ t.removed=true; t.reserve=true; t.zone=i%2; });
    active.forEach(function(t,i){ t.removed=false; t.reserve=false; t.zone=i%2; });
    spreadTeleportTiles();
  }else{
    spreadTilesEvenly(active);
  }
  state.coverers=buildCoverers(state.tiles);
  // 先固定一条完整的可取牌路线和对应三消分组，再只在路线后段叠加特殊状态。
  var order=playableOrder(active);
  state.special.safeOrder=order.slice();
  state.special.safePrefix=order.slice(0,12);
  assignSpecialGroups(order.concat(state.special.reserveTiles));
  if(level.special==='chain-clear'){
    state.special.unlockQueue=selectDistributedRouteTiles(order,level.chainCount||12,0);
    state.special.unlockCursor=0;
    state.special.unlockQueue.forEach(function(t){ t.locked=true; t.specialNeed=1; t.specialType='locked'; });
  }else if(level.special==='chain-neighbor'){
    configureNeighborBlocks(order,'locked',level.chainCount||16,1);
  }else if(level.special==='ice-neighbor'){
    configureNeighborBlocks(order,'frozen',level.iceCount||16,level.iceNeed||1);
  }
}
function validateSpecialSetup(level){
  if(state.level<6 || !state.special) return true;
  var counts={};
  state.tiles.forEach(function(t){ counts[t.kind]=(counts[t.kind]||0)+1; });
  for(var k=0;k<=WILD_KIND;k++) if((counts[k]||0)%3!==0) return false;
  var order=state.special.safeOrder||[], position={};
  order.forEach(function(t,i){ position[t.id]=i; });
  for(var i=0;i<order.length;i++){
    var t=order[i], coverers=state.coverers[t.id]||[];
    for(var c=0;c<coverers.length;c++){
      var coveredId=coverers[c];
      if(!state.tiles[coveredId].removed && position[coveredId]!==undefined && position[coveredId]>=i) return false;
    }
    if(t.locked || t.frozen){
      if(t.specialType==='locked' && state.special.type==='chain-clear'){
        var queueIndex=state.special.unlockQueue.indexOf(t);
        if(queueIndex<0 || Math.floor(i/3)*2<queueIndex+1) return false;
      }else{
        var earlier=tileNeighbors(t).filter(function(other){ return position[other.id]!==undefined && position[other.id]<i; }).length;
        if(earlier<t.specialNeed) return false;
      }
    }
  }
  if(state.special.type==='teleport'){
    if(state.special.reserveTiles.length%3!==0) return false;
    if(state.special.reserveTiles.length/3>level.teleports) return false;
  }
  return order.length===state.tiles.filter(function(t){ return !t.removed; }).length;
}
function specialBlocked(t){ return !!(t.locked || t.frozen); }
function recheckSpecialTripleOpportunity(){
  if(!state.special || state.over) return false;
  // 特殊状态变化后只重新计算遮挡和可点击状态；不自动交换水果。
  state.coverers=buildCoverers(state.tiles);
  refreshStates();
  return hasTripleMove();
}
function handleSpecialProgress(picked, cleared){
  var sp=state.special;
  if(!sp) return;
  sp.moves++;
  var stateChanged=false;
  if(sp.type==='chain-clear'){
    sp.clearCount+=(cleared||[]).length;
    // 每完成一次三消只解开一张，锁链会延续到中后局而不是开局迅速耗尽。
    var unlockLimit=Math.min(sp.clearCount,sp.unlockQueue?sp.unlockQueue.length:0);
    while(sp.unlockQueue && sp.unlockCursor<unlockLimit){
      var next=sp.unlockQueue[sp.unlockCursor++]; next.locked=false; next.specialUnlocked=true;
      stateChanged=true;
      toast('三消成功，部分锁链已解开');
    }
  }else if(sp.type==='chain-neighbor' || sp.type==='ice-neighbor'){
    var unlocked=0;
    state.tiles.forEach(function(t){
      if((t.locked||t.frozen) && tileNeighbors(t).filter(function(n){ return n.removed; }).length>=t.specialNeed){
        t.locked=false; t.frozen=false; t.specialUnlocked=true; unlocked++;
      }
    });
    if(unlocked){ stateChanged=true; toast((sp.type==='ice-neighbor'?'相邻牌已消除，冰层解冻 ':'相邻牌已消除，锁链解开 ')+unlocked+' 个'); }
  }
  if(sp.type==='teleport' && (cleared||[]).length && sp.teleportsLeft>0 && !sp.refillPending){
    sp.refillPending=true;
    sp.refillZone=picked && picked.zone===1 ? 0 : 1;
    setTimeout(applyTeleportRefill, DUR.fly+30);
  }
  // 每次三消、解锁或解冻后都确认当前可点击区域仍有一条三消机会。
  if((cleared||[]).length || stateChanged) recheckSpecialTripleOpportunity();
}
function applyTeleportRefill(){
  var sp=state.special;
  if(!sp || !sp.refillPending || !sp.reserveTiles.length) return;
  var batch=sp.reserveTiles.splice(0,3), zone=sp.refillZone;
  // 传送补牌不能自动送出三张同类牌；三消必须由玩家主动取牌完成。
  if(batch.length===3 && batch[0].kind===batch[1].kind && batch[1].kind===batch[2].kind && sp.reserveTiles.length){
    var donorIndex=-1;
    for(var di=0;di<sp.reserveTiles.length;di++){
      if(sp.reserveTiles[di].kind!==batch[0].kind){ donorIndex=di; break; }
    }
    if(donorIndex>=0){
      var donor=sp.reserveTiles[donorIndex];
      var oldKind=batch[0].kind;
      batch[0].kind=donor.kind;
      donor.kind=oldKind;
    }
  }
  var maxLayer=0; state.tiles.forEach(function(t){ if(!t.removed) maxLayer=Math.max(maxLayer,t.layer); });
  var refillAnchors=zone===0 ? [[0,.25],[1.5,1.5],[.5,2.75]] : [[3,.25],[2.5,1.5],[3.5,2.75]];
  batch.forEach(function(t,i){
    var point=refillAnchors[(sp.teleportUses*3+i)%refillAnchors.length];
    t.removed=false; t.reserve=false; t.zone=zone; t.layer=maxLayer+1+i;
    t.x=point[0]; t.y=point[1];
  });
  sp.teleportsLeft--; sp.teleportUses++; sp.refillPending=false;
  // 仅把新补入的三张叠在目标区域，不重排另一侧或场上的旧方块。
  state.coverers=buildCoverers(state.tiles);
  renderTeleportBatch(batch); refreshStates(); updateRemaining();
  recheckSpecialTripleOpportunity();
  toast('另一侧已补入 '+batch.length+' 个方块（剩余 '+sp.teleportsLeft+' 次）');
}
function simClearOne(counts){
  for(var k=0;k<FOOD_N;k++){
    if((counts[k]||0)>=3){ counts[k]-=3; return true; }
    if((counts[k]||0)>=2 && (counts[WILD_KIND]||0)>=1){ counts[k]-=2; counts[WILD_KIND]--; return true; }
    if((counts[k]||0)>=1 && (counts[WILD_KIND]||0)>=2){ counts[k]--; counts[WILD_KIND]-=2; return true; }
  }
  if((counts[WILD_KIND]||0)>=3){ counts[WILD_KIND]-=3; return true; }
  return false;
}
function simWouldClear(counts, kind){
  var probe={}; Object.keys(counts).forEach(function(key){ probe[key]=counts[key]; });
  probe[kind]=(probe[kind]||0)+1;
  var result=simClearOne(probe);
  return result;
}
// 贪心模拟：判断当前食物分布能否通关（考虑初始槽内状态、万能牌与槽位容量）
function simWinnable(tiles, trayFruits, trayCap){
  trayCap = trayCap || 7;
  var n=tiles.length;
  var removed=new Array(n).fill(false);
  var coverers=tiles.map(function(_,i){ return getCoverers(tiles,i); });
  var counts={};
  (trayFruits||[]).forEach(function(f){ counts[f]=(counts[f]||0)+1; });
  var len=(trayFruits||[]).length;
  for(;;){
    var cands=[], boardLeft=0;
    for(var i=0;i<n;i++){
      if(removed[i]) continue;
      boardLeft++;
      if(coverers[i].every(function(j){ return removed[j]; })) cands.push(i);
    }
    if(boardLeft===0) return true;      // 全部清空 → 可通关
    if(cands.length===0) return false;
    // 优先拿能直接凑成三消的方块
    var pick=-1;
    for(var k=0;k<cands.length;k++){
      if(simWouldClear(counts,tiles[cands[k]].kind)){ pick=cands[k]; break; }
    }
    // 否则：槽内数量少者优先，其次场上剩余多者优先（风险较低）
    if(pick<0){
      var bRem={};
      for(k=0;k<n;k++) if(!removed[k]) bRem[tiles[k].kind]=(bRem[tiles[k].kind]||0)+1;
      cands.sort(function(a,b){
        var ca=counts[tiles[a].kind]||0, cb=counts[tiles[b].kind]||0;
        if(ca!==cb) return ca-cb;
        return (bRem[tiles[b].kind]||0)-(bRem[tiles[a].kind]||0);

      pick=cands[0];
    }
    var f=tiles[pick].kind;
    counts[f]=(counts[f]||0)+1; len++;
    if(simClearOne(counts)) len-=3;   // 三消（支持万能牌组合）
    removed[pick]=true;
    if(len>=trayCap) return false;              // 槽满且无法消除 → 不可通关
  }
}

/* ================= 遮挡检测 ================= */
// 两个方块矩形的实际相交面积（方块边长均为 1 个单位）
function overlapArea(a,b){
  var ix=Math.min(a.x+1,b.x+1)-Math.max(a.x,b.x);
  var iy=Math.min(a.y+1,b.y+1)-Math.max(a.y,b.y);
  return ix>0&&iy>0 ? ix*iy : 0;
}
// 只把最高且覆盖面积最大的两个方块作为直接遮挡物，所有判定统一使用这套关系
function getCoverers(tiles,index){
  var target=tiles[index], blockers=[];
  tiles.forEach(function(other,j){
    // 同层重叠时以后渲染的方块为上方方块，避免底牌被判定可点但实际点不到。
    var sameLayerAbove=other.layer===target.layer && j>index;
    if(other.removed || (other.layer<target.layer) || (other.layer===target.layer && !sameLayerAbove)) return;
    var area=overlapArea(target,other);
    if(area>=OCCLUDE_RATIO) blockers.push({ id:j, layer:other.layer, area:area });
  });
  blockers.sort(function(a,b){ return a.layer-b.layer || b.area-a.area; });
  return blockers.slice(0,MAX_COVERERS).map(function(item){ return item.id; });
}
function buildCoverers(tiles){
  return tiles.map(function(_,i){ return getCoverers(tiles,i); });
}
function isOccluded(t){ return (state.coverers[t.id]||[]).some(function(j){ return !state.tiles[j].removed; }); }

// 上层方块被取走后立即重算全部方块的可点击状态
function refreshStates(){
  state.tiles.forEach(function(t){
    if(t.removed || !tileEl(t.id)) return;
    var blocked = isOccluded(t) || specialBlocked(t);
    tileEl(t.id).classList.toggle('blocked', blocked);
    tileEl(t.id).classList.toggle('uncovered', !blocked);
    tileEl(t.id).classList.toggle('locked', !!t.locked);
    tileEl(t.id).classList.toggle('frozen', !!t.frozen);
  });
}

// 手动洗牌后若仍没有三消机会，再重排尚未取走的牌面作为保底。
function hasTripleMove(){
  var counts={}, candidates=[], candidateCounts={}, wildCount=0, candidateWild=0;
  state.tray.forEach(function(k){ if(k===WILD_KIND) wildCount++; else counts[k]=(counts[k]||0)+1; });
  state.tiles.forEach(function(t){
    if(!t.removed && !specialBlocked(t) && !isOccluded(t)) candidates.push(t);
  });
  for(var i=0;i<candidates.length;i++){
    if(candidates[i].kind===WILD_KIND){ wildCount++; candidateWild++; }
    else candidateCounts[candidates[i].kind]=(candidateCounts[candidates[i].kind]||0)+1;
  }
  if(wildCount>=3) return true;
  for(var kind=0;kind<FOOD_N;kind++){
    var total=(counts[kind]||0)+(candidateCounts[kind]||0);
    if(total+wildCount>=3 && ((candidateCounts[kind]||0)>0 || candidateWild>0)) return true;
  }

}
function ensureTripleMove(){
  if(!state.started || state.over || hasTripleMove()) return false;
  var remain=state.tiles.filter(function(t){ return !t.removed; });
  var candidates=remain.filter(function(t){ return !specialBlocked(t) && !isOccluded(t); });
  if(!remain.length || !candidates.length) return false;
  var counts={}, trayCounts={};
  var changed=false;
  state.tray.forEach(function(k){ trayCounts[k]=(trayCounts[k]||0)+1; });
  remain.forEach(function(t){ counts[t.kind]=(counts[t.kind]||0)+1; });
  // 优先把一个已有两张的水果补到可点击区域，保留当前卡槽布局。
  var targetKind=-1, need=0;
  for(var k=0;k<FOOD_N;k++){
    var required=3-(trayCounts[k]||0);
    if(required>0 && required<=counts[k] && candidates.filter(function(t){ return t.kind===k; }).length<required){
      targetKind=k; need=required; break;
    }
  }
  if(targetKind<0){
    for(k=0;k<FOOD_N;k++){
      if(counts[k]>=3 && candidates.length>=3){ targetKind=k; need=3; break; }
    }
  }
  if(targetKind>=0){
    var targets=candidates.slice(0,need), donors=remain.filter(function(t){ return t.kind===targetKind && targets.indexOf(t)<0; });
    targets.forEach(function(target){
      if(target.kind===targetKind) return;
      var donor=donors.shift();
      if(!donor) return;
      var old=target.kind; target.kind=targetKind; donor.kind=old; changed=true;
    });
  }
  // 极少数牌面不足时，随机交换剩余方块，直到出现可消除机会。
  if(!hasTripleMove()){
    for(var attempt=0;attempt<80 && !hasTripleMove();attempt++){
      var a=(Math.random()*remain.length)|0, b=(Math.random()*remain.length)|0;
      var temp=remain[a].kind; remain[a].kind=remain[b].kind; remain[b].kind=temp;
      changed=true;
    }
  }
  return changed && hasTripleMove();
}

var peekTimer=null, lastTileInput=0;

function peekSpecialTile(t){

function onTileDown(e,id){

  if(specialBlocked(t)){ peekSpecialTile(t); return; }

  clearPeek();
  t.moving=true;
  var elm=tileEl(id);
  state.pendingPick=t;
  t.removed=true;
  addFruitToTray(t.kind, t.id);                 // 移入暂存槽（同时记录来源牌，清空时可放回棋盘）
  animateTileToTray(elm, t.kind);             // 从棋盘飞向卡槽，避免直接跳转
  elm.classList.add('fly');

/* ================= 槽位整理 & 三消检测 ================= */
// 按玩家选择顺序插入槽位，保留真实的排列风险
function addFruitToTray(kind, tileId){
  // 按选择顺序入槽，避免自动归类让三消过于容易。
  var idx=state.tray.length;
  state.tray.splice(idx,0,kind);
  state.trayTiles.splice(idx,0,tileId);
  var cleared=clearTriples();
  renderTray(cleared, idx);
  handleSpecialProgress(state.pendingPick, cleared);
  // 暂存槽占满且没有可消除组合 → 失败
  if(state.tray.length>=state.trayCap){ endGame(false); return; }
  // 场上全部清除 → 胜利
  var remain=false;
  state.tiles.forEach(function(t){ if(!t.removed) remain=true; });
  var waitingTeleport=state.special && state.special.type==='teleport' && (state.special.refillPending || state.special.reserveTiles.length);
  if(!remain && !waitingTeleport){
    var g=state.gen;
    setTimeout(function(){ if(g===state.gen && !state.over) endGame(true); }, DUR.fly+60);
  }
}
// 出现 3 个相同食物时自动消除，返回被消除位置（用于淡出动画）
function clearTriples(){
  if(state.level<6){
    var legacyCounts={}, legacyCleared=[];
    state.tray.forEach(function(v){ legacyCounts[v]=(legacyCounts[v]||0)+1; });
    Object.keys(legacyCounts).forEach(function(key){
      var legacyKind=parseInt(key,10);
      if(legacyCounts[key]>=3){
        var legacyIdx=[];
        state.tray.forEach(function(v,i){ if(v===legacyKind && legacyIdx.length<3) legacyIdx.push(i); });
        var legacyKinds=legacyIdx.map(function(i){ return state.tray[i]; });
        for(var li=legacyIdx.length-1;li>=0;li--){ state.tray.splice(legacyIdx[li],1); state.trayTiles.splice(legacyIdx[li],1); }
        legacyCleared.push({kind:legacyKind,indices:legacyIdx,kinds:legacyKinds});
      }
    });
    return legacyCleared;
  }
  var cleared=[];
  for(;;){
    var counts={}, wild=[];
    state.tray.forEach(function(v,i){
      if(v===WILD_KIND) wild.push(i); else counts[v]=(counts[v]||[]).concat(i);
    });
    var idxs=null, matchKind=null;
    for(var k=0;k<FOOD_N;k++){
      var same=counts[k]||[];
      if(same.length>=3){ idxs=same.slice(0,3); matchKind=k; break; }
      if(same.length>=2 && wild.length>=1){ idxs=same.slice(0,2).concat(wild[0]); matchKind=k; break; }
      if(same.length>=1 && wild.length>=2){ idxs=same.slice(0,1).concat(wild.slice(0,2)); matchKind=k; break; }
    }
    if(!idxs && wild.length>=3){ idxs=wild.slice(0,3); matchKind=WILD_KIND; }
    if(!idxs) break;
    idxs.sort(function(a,b){ return a-b; });
    var kinds=idxs.map(function(i){ return state.tray[i]; });
    for(var i=idxs.length-1;i>=0;i--){ state.tray.splice(idxs[i],1); state.trayTiles.splice(idxs[i],1); }
    cleared.push({ kind:matchKind, indices:idxs, kinds:kinds });
  }
  return cleared;
}

/* ================= 胜负判断 ================= */
function endGame(win){
  if(state.over) return;
  state.over=true;   // 确定胜负后立即锁定输入
  function show(){
    $('nextBtn').classList.add('hidden');
    $('selectBtn').classList.add('hidden');
    // 不限条件：未到最后一关随时可去下一关
    if(nextAvailableLevel(state.level)) $('nextBtn').classList.remove('hidden');
    else $('selectBtn').classList.remove('hidden');
    if(win){
      $('m-emoji').textContent='🎉';
      $('m-title').textContent = state.level===LEVELS.length ? '全部通关！' : '第 '+state.level+' 关通关！';
      $('m-sub').textContent = state.level===LEVELS.length ? '你是水果叠叠大师！' : '方块更多、层级更深，下一关更难哦';
    }else{
      $('m-emoji').textContent='😢';
      $('m-title').textContent='暂存槽满啦';
      $('m-sub').textContent='第 '+state.level+' 关 · 换个思路再试一次吧';
    }
    $('modal').classList.add('show');
  }
  if(win) show(); else setTimeout(show, DUR.modal);
}

/* ================= 清空卡槽 ================= */
// 每局最多 3 次：清空底部暂存槽，并把尚未三消的方块返回原位置，避免破坏三张组合。
function useClearTray(){
  if(state.over) return;
  if(state.clears<=0){ toast('清空次数用完啦'); return; }
  if(state.tray.length===0){ toast('卡槽已经是空的'); return; }
  state.clears--;
  // 清空只整理卡槽，不销毁未完成的牌；否则会破坏每种牌的三张组合。
  state.trayTiles.forEach(function(id){
    var tile=state.tiles[id];
    if(tile){ tile.removed=false; tile.moving=false; }
  });
  state.tray=[];
  state.trayTiles=[];
  state.pendingPick=null;
  state.gen++;
  // 清空不是洗牌：保留所有牌的原坐标、牌面和特殊状态，避免清空后改变通关路线。
  state.coverers=buildCoverers(state.tiles);
  renderBoard();
  renderTray([], -1);
  refreshStates();
  updateRemaining();
  updateBtnLabels();
  toast('卡槽已清空，牌已返回棋盘');
}

/* ================= 重新洗牌 ================= */
function useShuffle(){
  if(state.over) return;
  var remain=state.tiles.filter(function(t){ return !t.removed; });
  if(remain.length===0){ toast('场上没有方块啦'); return; }
  if(state.shuffles<=0){ toast('洗牌次数用完啦'); return; }
  // 洗牌仅交换剩余水果种类，不移动全局牌面；必须能立刻接上卡槽或形成可点击三消。
  var fruitChanged=reshuffleRemainingFruits(remain, state.tray, state.trayCap);
  if(!fruitChanged){
    toast(state.tray.length ? '当前剩余牌无法匹配卡槽，洗牌未消耗' : '当前牌面无法形成可三消组合，洗牌未消耗');
    return;
  }
  state.shuffles--; updateBtnLabels();
  state.coverers=buildCoverers(state.tiles);
  syncTileKinds();
  remain.forEach(function(t){
    var elm=tileEl(t.id);
    if(!elm) return;
    var inner=elm.querySelector('.tile-inner');
    inner.className='tile-inner f'+t.kind;
    inner.innerHTML='<svg viewBox="0 0 1024 1024"><use href="#'+foodSymbolId(t.kind)+'"/></svg>';
    elm.classList.remove('shuffling'); void elm.offsetWidth;
    elm.classList.add('shuffling');
  });
  refreshStates();
  setTimeout(function(){
    remain.forEach(function(t){ var elm=tileEl(t.id); if(elm) elm.classList.remove('shuffling'); });
  }, DUR.shuffle);
  toast(state.tray.length ? '已重排水果并匹配卡槽' : '已重排水果，当前可形成三消');
}

/* ================= 提示条 / 开始与重开 ================= */
var toastTimer=null;
function toast(msg){
  var t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 1400);
}
// 开始（或重新开始）第 n 关
function startGame(n){
  if(isLevelTemporarilyDisabled(n)){ toast('第 '+n+' 关暂时不可用'); return; }
  var level=LEVELS[n-1];
  lastTileInput=Date.now(); // 忽略选关/下一关按钮抬起时落到新棋盘上的误触点击
  state.level=n; state.started=true;
  state.over=false; state.gen++;
  state.trayCap=TRAY_CAP;                                // 每关槽位固定 7 格
  state.tray=[];
  state.trayTiles=[];
  state.shuffles=SHUFFLE_MAX; state.clears=CLEAR_MAX;    // 每局洗牌 3 次、清空卡槽 3 次
  var generated=false;
  for(var attempt=0;attempt<20 && !generated;attempt++){
    state.tiles=generateLayout(level);
    state.tray=[]; state.trayTiles=[]; state.special=null;
    spreadTilesEvenly(state.tiles);                     // 原有第1～5关保持原布局流程
    state.coverers=buildCoverers(state.tiles);
    assignFruits(state.tiles, [], levelMultiset(level), state.trayCap, level);
    setupSpecialLevel(level);
    generated=validateSpecialSetup(level);
  }
  $('modal').classList.remove('show');
  trayInner.querySelectorAll('.slice.cleared').forEach(function(n0){ n0.remove(); });
  renderBoard();
  renderTray([], -1);
  refreshStates();
  updateBtnLabels();
  updateRemaining();
  updateLevelPill();
  resizeBoard();
}

/* ================= 选关弹窗 ================= */
function renderLevelButtons(){
  // 第3、4关临时禁用，但保留原编号和配置以便后续恢复。
  Array.prototype.forEach.call(document.querySelectorAll('#lm-grid .lv'), function(b){
    var n=parseInt(b.dataset.lv,10);
    var disabled=isLevelTemporarilyDisabled(n);
    b.classList.toggle('disabled',disabled);
    b.disabled=disabled;
    b.innerHTML='<b>'+n+'</b><i>'+(disabled?'暂不可用':LEVELS[n-1].sets*36+' 块')+'</i>';
  });
}
function showLevelModal(){
  renderLevelButtons();
  $('lmBackBtn').classList.toggle('hidden', !state.started);
  $('levelModal').classList.add('show');
}
function hideLevelModal(){ $('levelModal').classList.remove('show'); }

/* ================= 初始化 ================= */
$('clearBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); useClearTray(); });
$('shuffleBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); useShuffle(); });
$('nextLvBtn').addEventListener('pointerdown', function(e){
  e.preventDefault();
  var next=nextAvailableLevel(state.level);
  if(!next){ toast('已经是最后一关啦'); return; }
  startGame(next);
});
$('restartBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); startGame(state.level); });
$('nextBtn').addEventListener('pointerdown', function(e){
  e.preventDefault();
  var next=nextAvailableLevel(state.level);
  if(next) startGame(next);
});
$('selectBtn').addEventListener('pointerdown', function(e){
  e.preventDefault();
  $('modal').classList.remove('show');
  showLevelModal();
});
$('levelPill').addEventListener('pointerdown', function(e){ e.preventDefault(); showLevelModal(); });
$('lmBackBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); hideLevelModal(); });
Array.prototype.forEach.call(document.querySelectorAll('#lm-grid .lv'), function(b){
  b.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var n=parseInt(b.dataset.lv,10);
    if(isLevelTemporarilyDisabled(n)){ toast('第 '+n+' 关暂时不可用'); return; }
    hideLevelModal();
    startGame(n);   // 任意关卡都可直接进入
  });
});
window.addEventListener('resize', resizeBoard);
// 防止双击缩放 / 长按菜单 / 拖选文字等干扰操作
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

resizeBoard();
showLevelModal();   // 启动时先选关
})();
</script>
