<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101426">
<!-- iPhone 添加到主屏幕：图标与全屏体验 -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="游戏合集">
<title>游戏合集</title>
<style>
  :root { --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #141b33 0%, #0d1020 55%, #1a1030 100%);
    color: #eef1f8;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation; overscroll-behavior: none;
  }

  /* ===== 主页 ===== */
  #home {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(18px + var(--safe-t)) 18px calc(18px + var(--safe-b));
    max-width: 560px; margin: 0 auto;
  }
  .hero { text-align: center; padding: 18px 0 8px; }
  .hero .logo { font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 12px rgba(255,255,255,.18)); }
  .hero h1 { margin-top: 10px; font-size: 26px; letter-spacing: 4px; font-weight: 800;
    background: linear-gradient(90deg, #ffd97a, #ff8f6b, #e86ad0);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { margin-top: 8px; color: #8b93ad; font-size: 13px; letter-spacing: 2px; }

  .games { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 12px 0; }

  .card {
    position: relative; overflow: hidden;
    border-radius: 22px; padding: 22px 20px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 10px 26px rgba(0,0,0,.35);
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:active { transform: scale(.97); }
  .card .icon {
    width: 64px; height: 64px; flex-shrink: 0;
    border-radius: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  .card .info { flex: 1; min-width: 0; }
  .card .info h2 { font-size: 19px; font-weight: 800; letter-spacing: 1px; }
  .card .info p { margin-top: 5px; font-size: 12.5px; opacity: .75; line-height: 1.5; }
  .card .go {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; opacity: .9;
  }

  /* 华容道卡片：深蓝夜色风（贴合游戏本身配色） */
  .card.klotski { background: linear-gradient(135deg, #1b2a5e 0%, #0f3460 60%, #16213e 100%); border: 1px solid rgba(233,69,96,.35); }
  .card.klotski .icon { background: rgba(233,69,96,.15); box-shadow: inset 0 0 0 1.5px rgba(233,69,96,.45); }
  .card.klotski h2 { color: #ff7a95; }
  .card.klotski .go { background: rgba(233,69,96,.22); color: #e94560; }

  /* 消消乐卡片：暖橙奶油风（贴合游戏本身配色） */
  .card.match { background: linear-gradient(135deg, #ffd9a0 0%, #ffb968 60%, #ff9f2e 100%); border: 1px solid rgba(255,255,255,.5); }
  .card.match .icon { background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1.5px rgba(122,74,33,.25); }
  .card.match h2 { color: #6b3d14; }
  .card.match p { color: #7a4a21; }
  .card.match .go { background: rgba(122,74,33,.15); color: #7a4a21; }

  .footer { text-align: center; color: #565e78; font-size: 11px; letter-spacing: 2px; padding-top: 8px; }

  /* ===== 游戏运行视图 ===== */
  #player { position: fixed; inset: 0; z-index: 50; background: #101426; display: none; }
  #player.on { display: block; }
  #player iframe { width: 100%; height: 100%; border: 0; display: block; background: #101426; }

  #backBtn {
    position: fixed; top: calc(10px + var(--safe-t)); left: 12px; z-index: 60;
    display: none; align-items: center; gap: 6px;
    padding: 8px 16px 8px 12px; border-radius: 999px;
    background: rgba(10, 13, 28, .78); color: #fff; font-size: 13px; font-weight: 600;
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  #backBtn.on { display: flex; }
  #backBtn:active { transform: scale(.93); }
  #backBtn svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

  <!-- 主页：游戏选择 -->
  <div id="home">
    <div class="hero">
      <div class="logo">🎮</div>
      <h1>游戏合集</h1>
      <p>选 一 个，开 始 玩</p>
    </div>

    <div class="games">
      <div class="card klotski" data-src="huarongdao.html" data-title="6×6 华容道">
        <div class="icon">🚗</div>
        <div class="info">
          <h2>6×6 华容道</h2>
          <p>滑动方块，把红色小车挪出出口。关卡自动生成，越玩越烧脑。</p>
        </div>
        <div class="go">›</div>
      </div>

      <div class="card match" data-src="xiaoxiaole.html" data-title="水果叠叠乐">
        <div class="icon">🍉</div>
        <div class="info">
          <h2>水果叠叠乐</h2>
          <p>点击相同水果消除进槽，槽满即输，清空棋盘过关，轻松解压。</p>
        </div>
        <div class="go">›</div>
      </div>
    </div>

    <div class="footer">共 2 款 · 离线可玩</div>
  </div>

  <!-- 游戏运行视图 -->
  <div id="player">
    <iframe id="gameFrame" title="game"></iframe>
  </div>
  <button id="backBtn" aria-label="返回主页">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    主页
  </button>

<script>
(function () {
  var player  = document.getElementById('player');
  var frame   = document.getElementById('gameFrame');
  var backBtn = document.getElementById('backBtn');
  var inGame  = false;

  // 打开游戏：进入运行视图，并压入一条历史记录，
  // 这样安卓返回手势/返回键会先回到主页而不是直接退出 App
  function openGame(src) {
    inGame = true;
    player.classList.add('on');
    backBtn.classList.add('on');
    frame.src = src;
    history.pushState({ game: src }, '');
  }

  // 关闭游戏（fromPop=true 表示由系统返回触发，无需再回退历史）
  function closeGame(fromPop) {
    if (!inGame) return;
    inGame = false;
    player.classList.remove('on');
    backBtn.classList.remove('on');
    frame.src = 'about:blank';
    if (!fromPop && history.state && history.state.game) history.back();
  }

  document.querySelectorAll('.card').forEach(function (card) {
    card.addEventListener('click', function () {
      openGame(card.getAttribute('data-src'));
    });
  });

  backBtn.addEventListener('click', function () { closeGame(false); });

  window.addEventListener('popstate', function () { closeGame(true); });

  // 阻止双击缩放（部分安卓 webview 双击缩放会干扰游戏操作）
  var lastTouch = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouch < 320) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
})();
</script>
</body>
</html>
