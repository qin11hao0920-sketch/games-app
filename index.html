<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0D11">
<!-- iPhone 添加到主屏幕：图标与全屏体验 -->
<!-- 原来直接引用 1024x1024 的 icon.png（1.33 MB），每次打开首页都要拉；
     现在拆成 32（标签页图标，2.7 KB）+ 180（添加到主屏幕，iOS 才会取） -->
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<!-- 主推封面是首屏最显眼的图，预加载让它在解析 HTML 阶段就开始下，
     不必等下面那段脚本跑完才发现要下载它 -->
<link rel="preload" as="image" href="封面/水果叠叠乐.jpg" fetchpriority="high">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="梦瑞集">
<title>梦瑞集 · 离线小游戏合集</title>
<style>
  :root{
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    /* 深色中性底：衬托各种封面的颜色，不用花哨底色抢戏 */
    --bg:     #0B0D11;
    --card:   #14181F;
    --card-2: #0E1116;
    --line:   rgba(255,255,255,.075);
    --line-hi:rgba(242,169,59,.44);
    --t1:     #F3F5F8;   /* 标题 */
    --t2:     #8B94A3;   /* 简介 */
    --t3:     #5C6673;   /* 页脚 / 次要信息 */
    /* 主强调色取暖金（呼应主推游戏的果园暖调），次强调取草绿 */
    --gold:   #F2A93B;
    --gold-d: #C8842A;
    --green:  #86B96A;
    --r:      20px;
    --gap:    14px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; overflow:hidden; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:var(--bg);
    color:var(--t1);
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  /* 背景：三团很淡的暖光 + 一层点阵纹理，避免大面积纯黑显得死板 */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(44% 30% at 14% 2%,   rgba(242,169,59,.11), transparent 70%),
      radial-gradient(40% 26% at 88% 12%,  rgba(134,185,106,.075), transparent 70%),
      radial-gradient(52% 34% at 50% 104%, rgba(200,132,42,.07), transparent 72%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.03;
    background-image:radial-gradient(rgba(255,255,255,.85) 1px, transparent 1px);
    background-size:3px 3px;
  }

  /* ===================== 主页 ===================== */
  #home{
    position:relative; z-index:1;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    padding:calc(14px + var(--safe-t)) 16px calc(12px + var(--safe-b));
    max-width:600px; margin:0 auto;
  }

  /* ---- 品牌区 ---- */
  .hero{ display:flex; align-items:center; gap:12px; padding:8px 2px 4px; }
  .hero .mark{
    flex-shrink:0; width:44px; height:44px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    background:linear-gradient(150deg, rgba(242,169,59,.20), rgba(134,185,106,.14));
    border:1px solid rgba(242,169,59,.30);
    box-shadow:0 3px 14px -4px rgba(242,169,59,.45), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .hero .txt{ min-width:0; }
  .hero h1{ font-size:20px; font-weight:800; letter-spacing:5px; line-height:1.15; }
  .hero p{ margin-top:3px; font-size:11px; letter-spacing:1.6px; color:var(--t3); }
  .hero .stat{
    margin-left:auto; flex-shrink:0; text-align:right;
  }
  .hero .stat b{
    display:block; font-size:17px; font-weight:800; color:var(--gold);
    font-variant-numeric:tabular-nums; line-height:1.1;
  }
  .hero .stat span{ font-size:9.5px; letter-spacing:1.4px; color:var(--t3); }

  /* ---- 滚动区 ---- */
  #list{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 0 6px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  #list::-webkit-scrollbar{ width:0; height:0; display:none; }
  /* 桌面端换成贴合深色主题的细滚动条 */
  @media (hover:hover) and (pointer:fine){
    #list{ scrollbar-width:thin; scrollbar-color:rgba(242,169,59,.30) transparent; }
    #list::-webkit-scrollbar{ display:block; width:10px; height:10px; }
    #list::-webkit-scrollbar-track{ background:transparent; }
    #list::-webkit-scrollbar-thumb{
      background:rgba(242,169,59,.14); background-clip:content-box;
      border:3px solid transparent; border-radius:999px;
    }
    #list:hover::-webkit-scrollbar-thumb{ background:rgba(242,169,59,.40); background-clip:content-box; }
    #list::-webkit-scrollbar-thumb:hover{ background:rgba(242,169,59,.62); background-clip:content-box; }
  }

  .section-title{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:600; letter-spacing:3px; color:#767F8E;
    margin:16px 2px 10px;
  }
  .section-title::before{
    content:""; width:14px; height:2px; border-radius:2px;
    background:linear-gradient(90deg, var(--gold), rgba(242,169,59,.15));
  }

  /* ===================== 卡片 ===================== */
  .card{
    position:relative; display:block; overflow:hidden;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:0 1px 2px rgba(0,0,0,.34);
    cursor:pointer; text-align:left;
    transition:transform .2s cubic-bezier(.2,.7,.3,1), border-color .2s ease, box-shadow .2s ease;
  }
  .thumb{ position:relative; width:100%; height:0; padding-bottom:62.5%; background:var(--card-2); overflow:hidden; }
  .ph{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:28px; opacity:.3;
  }
  .thumb img{
    position:absolute; inset:0; display:block; width:100%; height:100%;
    object-fit:cover;
    transition:transform .45s cubic-bezier(.2,.7,.3,1), filter .2s ease;
  }
  /* 底部渐隐：让封面融进卡片，同时压掉图上的水印 */
  .thumb::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:52%; pointer-events:none;
    background:linear-gradient(to top,
      rgba(20,24,31,.98) 0%, rgba(20,24,31,.90) 14%,
      rgba(20,24,31,.48) 44%, rgba(20,24,31,0) 100%);
  }
  .body{ padding:11px 13px 13px; }
  .body h2{ font-size:14.5px; font-weight:700; letter-spacing:.3px; color:var(--t1); }
  .body p{ margin-top:5px; font-size:11px; line-height:1.5; color:var(--t2); }

  /* ---- 主推大卡（聚果拾趣）---- */
  .card.hero-card{
    border-color:rgba(242,169,59,.34);
    box-shadow:0 2px 10px -2px rgba(0,0,0,.5), 0 0 30px -14px rgba(242,169,59,.55);
  }
  .card.hero-card .thumb{ padding-bottom:58%; }
  .card.hero-card .thumb::after{
    height:68%;
    background:linear-gradient(to top,
      rgba(20,24,31,1) 0%, rgba(20,24,31,.94) 22%,
      rgba(20,24,31,.52) 52%, rgba(20,24,31,0) 100%);
  }
  .card.hero-card .body{ padding:13px 15px 15px; }
  .card.hero-card h2{ font-size:19px; letter-spacing:1px; }
  .card.hero-card p{ margin-top:6px; font-size:11.5px; line-height:1.55; }
  /* 右上角 NEW 角标 */
  .flag{
    position:absolute; top:11px; right:11px; z-index:3;
    font-size:10px; font-weight:800; letter-spacing:1.2px;
    padding:4px 9px; border-radius:999px; color:#20160a;
    background:linear-gradient(140deg,#FFC868,#F2A93B);
    box-shadow:0 3px 12px -3px rgba(242,169,59,.85);
  }
  /* 大卡底部的「开始玩」胶囊 */
  .go{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:11px; padding:7px 15px; border-radius:999px;
    font-size:11.5px; font-weight:700; letter-spacing:.6px; color:#20160a;
    background:linear-gradient(140deg,#FFC868,#F2A93B);
    box-shadow:0 4px 14px -5px rgba(242,169,59,.9);
  }
  .go svg{ width:12px; height:12px; fill:none; stroke:#20160a; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  /* 玩法标签 */
  .tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .tags i{
    font-style:normal; font-size:9.5px; letter-spacing:.6px;
    padding:2.5px 7px; border-radius:999px;
    color:#A9B3C1; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.07);
  }

  /* ---- 两列网格 ---- */
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:var(--gap); }
  .card.mini .ph{ font-size:24px; }
  .card.mini .body h2{ font-size:13.5px; }
  .card.mini .body p{ font-size:10.5px; }
  .card.mini .body{ padding:10px 11px 12px; }
  /* 「我的」标记：左下角一枚很淡的金色小圆点 + 文案 */
  .card.mine .body h2::after{
    content:"我的"; margin-left:6px; vertical-align:1px;
    font-size:9px; font-weight:600; letter-spacing:.5px; color:var(--gold);
    padding:1.5px 5px; border-radius:999px;
    background:rgba(242,169,59,.12); border:1px solid rgba(242,169,59,.24);
  }

  .footer{ text-align:center; color:var(--t3); font-size:10.5px; letter-spacing:2px; padding:18px 0 6px; }

  /* ---- 交互反馈 ---- */
  @media (hover:hover) and (pointer:fine){
    .card:hover{
      transform:translateY(-3px);
      border-color:var(--line-hi);
      box-shadow:0 10px 26px rgba(0,0,0,.46), 0 0 26px -9px rgba(242,169,59,.5);
    }
    .card:hover .thumb img{ transform:scale(1.05); }
    .card:hover .body h2{ color:#fff; }
  }
  .card:active{ transform:scale(.977); border-color:var(--line-hi); }
  .card:active .thumb img{ filter:brightness(.86); }
  .card:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  @media (prefers-reduced-motion:reduce){
    .card, .thumb img{ transition:none; }
  }

  /* ===================== 游戏运行视图 ===================== */
  #player{ position:fixed; inset:0; z-index:50; background:var(--bg); display:none; }
  #player.on{ display:block; }
  #player iframe{ width:100%; height:100%; border:0; display:block; background:var(--bg); }

  /* 加载指示：切游戏时不再是白屏等 */
  #loading{
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--bg); color:var(--t2); font-size:12.5px; letter-spacing:1.5px;
    opacity:0; pointer-events:none; transition:opacity .28s ease;
  }
  #loading.on{ opacity:1; }
  #loading i{
    width:15px; height:15px; border-radius:50%;
    border:2px solid rgba(255,255,255,.13); border-top-color:var(--gold);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #backBtn{
    position:fixed; top:calc(10px + var(--safe-t)); left:12px; z-index:60;
    display:none; align-items:center; gap:6px;
    padding:8px 16px 8px 12px; border-radius:999px;
    background:rgba(14,17,22,.80); color:#fff; font-size:13px; font-weight:600;
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    cursor:pointer; box-shadow:0 3px 14px rgba(0,0,0,.42);
  }
  #backBtn.on{ display:flex; }
  #backBtn:active{ transform:scale(.93); }
  #backBtn svg{ width:14px; height:14px; fill:none; stroke:#fff; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>

  <!-- 主页：游戏选择 -->
  <div id="home">
    <div class="hero">
      <div class="mark">🍇</div>
      <div class="txt">
        <h1>梦瑞集</h1>
        <p>离 线 小 游 戏 合 集</p>
      </div>
      <div class="stat">
        <b id="hudCount">0</b>
        <span>款可玩</span>
      </div>
    </div>

    <div id="list">
      <!-- 主推：聚果拾趣（最新上线，置于首位） -->
      <div id="hero"></div>

      <div class="section-title">我 的 游 戏</div>
      <div class="grid" id="mine"></div>

      <div class="section-title">精 选 游 戏</div>
      <div class="grid" id="grid"></div>

      <div class="footer" id="footer"></div>
    </div>
  </div>

  <!-- 游戏运行视图 -->
  <div id="player">
    <div id="loading"><i></i>加载中…</div>
    <iframe id="gameFrame" title="game"></iframe>
  </div>
  <button id="backBtn" aria-label="返回主页">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    主页
  </button>

<script>
(function () {
  var player  = document.getElementById('player');
  var frame   = document.getElementById('gameFrame');
  var backBtn = document.getElementById('backBtn');
  var loading = document.getElementById('loading');
  var inGame  = false;

  // ===== 主推（最新上线，排在最前）=====
  var HERO = {
    f:'聚果拾趣.html', c:'封面/水果叠叠乐.jpg', i:'🍇', n:'聚果拾趣',
    d:'七种果趣循环：同果锁 · 双果链 · 遮帘 · 炸弹 · 彩虹 · 冰冻 · 封蜡。棋盘大小固定，先取后凑三，凑满七格就输。',
    tags:['消除','益智','七种玩法']
  };

  // ===== 我的游戏 =====
  // 网格卡一律用 封面/缩略图/ 下的 560px 版本（原图 1200x800 每张 70~130KB，网格卡最多只显示 277px，纯属浪费）
  var MINE = [
    { f:'华容道.html',     c:'封面/缩略图/华容道.jpg',       i:'🚗', n:'6×6 华容道',
      d:'滑动方块，把红色小车挪出出口。关卡自动生成，越玩越烧脑。' },
    { f:'水果叠叠乐.html', c:'封面/缩略图/水果叠叠乐.jpg',   i:'🍉', n:'水果叠叠乐',
      d:'经典版水果消除，规则更简单，随手玩两局。' }
  ];

  // ===== 精选游戏（文件名 / 封面 / 兜底表情 / 名称 / 简介） =====
  var GAMES = [
    { f:'2048.html',       c:'封面/缩略图/2048.jpg',       i:'🔢', n:'2048',       d:'滑动合并数字，冲向 2048' },
    { f:'数字华容道.html',  c:'封面/缩略图/数字华容道.jpg',  i:'🧩', n:'数字华容道',  d:'滑动数字块，恢复顺序' },
    { f:'记忆翻牌.html',    c:'封面/缩略图/记忆翻牌.jpg',    i:'🃏', n:'记忆翻牌',    d:'翻出相同的两张牌' },
    { f:'西蒙记忆.html',    c:'封面/缩略图/西蒙记忆.jpg',    i:'🎵', n:'西蒙记忆',    d:'跟随灯光记住序列' },
    { f:'打砖块.html',      c:'封面/缩略图/打砖块.jpg',      i:'🟧', n:'打砖块',      d:'弹球撞碎所有砖块' },
    { f:'像素小鸟.html',    c:'封面/缩略图/像素小鸟.jpg',    i:'🐦', n:'像素小鸟',    d:'点击飞行，穿过缝隙' },
    { f:'打地鼠.html',      c:'封面/缩略图/打地鼠.jpg',      i:'🔨', n:'打地鼠',      d:'地鼠冒头就砸，拼手速' },
    { f:'切水果.html',      c:'封面/缩略图/切水果.jpg',      i:'🍊', n:'切水果',      d:'划刀切水果，躲开炸弹' },
    { f:'车道狂飙.html',    c:'封面/缩略图/车道狂飙.jpg',    i:'🏎️', n:'车道狂飙',    d:'躲避车流，狂飙冲刺' },
    { f:'泡泡龙.html',      c:'封面/缩略图/泡泡龙.jpg',      i:'🫧', n:'泡泡龙',      d:'瞄准发射，三色消除' },
    { f:'塔防.html',        c:'封面/缩略图/塔防.jpg',        i:'🏰', n:'塔防',        d:'布置炮塔，拦截敌军' },
    { f:'井字棋.html',      c:'封面/缩略图/井字棋.jpg',      i:'⭕', n:'井字棋',      d:'与电脑对战，三连线胜' },
    { f:'知识问答.html',    c:'封面/缩略图/知识问答.jpg',    i:'🎓', n:'知识问答',    d:'40 道中文知识题挑战' }
  ];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 缩略图：封面加载失败时自动露出兜底表情
  // lazy=true 的（网格卡）走原生懒加载，滚到跟前才下；主推卡用 fetchpriority=high 抢带宽。
  // 极老的 WebView 不认 loading 属性，先探测再决定，免得封面永远不出来。
  var CAN_LAZY = ('loading' in HTMLImageElement.prototype);
  function thumbHtml(g, lazy) {
    return '<div class="thumb">'
      + '<span class="ph">' + esc(g.i) + '</span>'
      + '<img src="' + esc(g.c) + '" alt="" decoding="async"'
      + (lazy ? (CAN_LAZY ? ' loading="lazy"' : '') : ' fetchpriority="high"')
      + '>'
      + '</div>';
  }

  // ---- 主推大卡 ----
  document.getElementById('hero').innerHTML =
    '<div class="card hero-card" role="button" tabindex="0" data-src="' + esc(HERO.f) + '"'
    + ' aria-label="打开 ' + esc(HERO.n) + '">'
    +   '<span class="flag">NEW</span>'
    +   thumbHtml(HERO)
    +   '<div class="body">'
    +     '<h2>' + esc(HERO.n) + '</h2>'
    +     '<p>' + esc(HERO.d) + '</p>'
    +     '<div class="tags">' + HERO.tags.map(function (t) { return '<i>' + esc(t) + '</i>'; }).join('') + '</div>'
    +     '<span class="go">开始玩 <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>'
    +   '</div>'
    + '</div>';

  // ---- 两列网格 ----
  function gridHtml(list, mine) {
    var out = '';
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      out += '<div class="card mini' + (mine ? ' mine' : '') + '" role="button" tabindex="0"'
        + ' data-src="' + esc(g.f) + '" aria-label="打开 ' + esc(g.n) + '">'
        + thumbHtml(g, true)
        + '<div class="body"><h2>' + esc(g.n) + '</h2><p>' + esc(g.d) + '</p></div>'
        + '</div>';
    }
    return out;
  }
  document.getElementById('mine').innerHTML = gridHtml(MINE, true);
  document.getElementById('grid').innerHTML = gridHtml(GAMES, false);

  var total = 1 + MINE.length + GAMES.length;
  document.getElementById('hudCount').textContent = total;
  document.getElementById('footer').textContent = '共 ' + total + ' 款 · 全部离线可玩 · 数据存在本机';

  // 封面临时缺失时退回表情占位，不影响点击
  Array.prototype.forEach.call(document.querySelectorAll('.thumb img'), function (im) {
    im.addEventListener('error', function () {
      im.style.display = 'none';
      var ph = im.parentNode.querySelector('.ph');
      if (ph) ph.style.opacity = '.75';
    });
  });

  // ===== 打开 / 关闭游戏 =====
  // 打开时压入一条历史记录，这样安卓返回手势/返回键会先回主页而不是直接退出 App
  function openGame(src) {
    if (!src) return;
    inGame = true;
    loading.classList.add('on');
    player.classList.add('on');
    backBtn.classList.add('on');
    frame.src = src;
    history.pushState({ game: src }, '');
  }

  function closeGame(fromPop) {
    if (!inGame) return;
    inGame = false;
    player.classList.remove('on');
    backBtn.classList.remove('on');
    loading.classList.remove('on');
    frame.src = 'about:blank';
    if (!fromPop && history.state && history.state.game) history.back();
  }

  // 游戏加载完成后收起加载指示（about:blank 那次的 load 要忽略）
  frame.addEventListener('load', function () {
    if (inGame && frame.src && frame.src.indexOf('about:blank') < 0) loading.classList.remove('on');
  });

  Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
    card.addEventListener('click', function () {
      openGame(card.getAttribute('data-src'));
    });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) {
        e.preventDefault();
        openGame(card.getAttribute('data-src'));
      }
    });
  });

  backBtn.addEventListener('click', function () { closeGame(false); });

  window.addEventListener('popstate', function () { closeGame(true); });

  // 阻止双击缩放（部分安卓 webview 双击缩放会干扰游戏操作）
  var lastTouch = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouch < 320) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  // 供验收脚本使用（不影响正常使用）
  window.__home = {
    count: total,
    cards: Array.prototype.map.call(document.querySelectorAll('.card'), function (c) {
      var h2 = c.querySelector('h2');
      return { src: c.getAttribute('data-src'), name: h2 ? h2.textContent : '', hero: c.classList.contains('hero-card') };
    }),
    open: openGame, close: closeGame,
    inGame: function () { return inGame; },
    playerSrc: function () { return frame.getAttribute('src') || ''; }
  };
})();
</script>
</body>
</html>
