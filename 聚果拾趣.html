/* 响应式棋盘与卡片（第 4.2 节 / 第 1.2 节第 12～13 条 / v0.10 第 2 项）
   计算顺序固定为：读取视口尺寸 → 扣除顶部信息区／货栏／道具栏／安全区与固定 8px 间距
   → 得到棋盘可用矩形 → 在「固定画布 FRAME_X × FRAME_Y 逻辑格」内算格子边长与卡片尺寸
   → 卡片坐标 = 画布居中偏移 + 逻辑坐标 × cell。
   画布尺寸与 cell 都只由可用区决定，不含任何关卡自己的尺寸，所以每一关的
   「棋盘大小」和「卡片大小」都完全一致。不允许先按固定 430px 或桌面尺寸生成再整体缩放。 */
var LAY={ rect:{w:0,h:0}, usableW:0, usableH:0, cell:0, card:0, sections:null, frame:null };
function measureLayout(){
  var app=$('#app');
  var vw=window.innerWidth||360, vh=window.innerHeight||640;
  var cs=app?getComputedStyle(app):null;
  var padT=cs?(parseFloat(cs.paddingTop)||0):0;
  var padB=cs?(parseFloat(cs.paddingBottom)||0):0;
  var padL=cs?(parseFloat(cs.paddingLeft)||0):0;
  var padR=cs?(parseFloat(cs.paddingRight)||0):0;
  var appW=app?(app.clientWidth||vw):vw;
  var hd=document.querySelector('header');
  var tb=$('#trayBar'), tl=$('#tools');
  /* 这三段高度都参与可用区计算，而可用区决定 cell —— 同一视口下所有关卡必须拿到同一个值。
     CSS 侧已经保证顶栏胶囊不换行，这里再把实测高度向上取整到 2px 档，
     吸收字体渲染/子像素带来的微小抖动，把「每关卡片一样大」钉死。 */
  var hhRaw=hd?hd.getBoundingClientRect().height:0;
  var thRaw=tb?tb.getBoundingClientRect().height:0;
  var lhRaw=tl?tl.getBoundingClientRect().height:0;
  var hh=hhRaw>0?Math.ceil(hhRaw/2)*2:0;
  var th=thRaw>0?Math.ceil(thRaw/2)*2:0;
  var lh=lhRaw>0?Math.ceil(lhRaw/2)*2:0;
  /* 三条 flex 间隙：信息区↔棋盘↔货栏↔道具栏，全部固定 8px */
  var usableW=Math.max(60, appW - padL - padR);
  var usableH=Math.max(60, vh - padT - padB - hh - th - lh - GAP*3);
  return { usableW:usableW, usableH:usableH, vw:vw, vh:vh,
           header:hh, tray:th, tools:lh, padT:padT, padB:padB };
}
function layout(){
  if(!G) return false;
  var m=measureLayout();
  var availW=Math.max(40, m.usableW);
  var availH=Math.max(40, m.usableH);
  /* 固定画布：所有关卡共用同一块 FRAME_X × FRAME_Y 的画布。
     fx/fy 是纯常数，绝不跟随本关的 unitsX/unitsY —— 这是「卡片大小固定」的前提。
     FRAME_X/FRAME_Y 已按 unitsX/unitsY 的数学上界取值（9.62 / 12.62），
     实测 1～999 关最大值与之吻合，所以内容永远装得下、不会裁切。 */
  var fx=FRAME_X, fy=FRAME_Y;
  /* 同一关所有卡片尺寸一致：cell 只有一个值（第 1.2 节第 13 条） */
  cell=Math.min(availW/fx, availH/fy);
  if(!(cell>0)) cell=1;
  var bw=Math.round(fx*cell), bh=Math.round(fy*cell);
  /* 关卡内容在画布内居中 */
  offX=Math.round((fx-unitsX)/2*cell);
  offY=Math.round((fy-unitsY)/2*cell);
  LAY.usableW=Math.round(availW); LAY.usableH=Math.round(availH);
  LAY.cell=cell; LAY.card=Math.max(2,Math.round(CARD*cell));
  LAY.rect={ w:bw, h:bh };
  LAY.frame={ w:fx, h:fy, offX:offX, offY:offY,
              levelW:+unitsX.toFixed(2), levelH:+unitsY.toFixed(2),
              oversize:((unitsX>FRAME_X+1e-6)||(unitsY>FRAME_Y+1e-6)),
              /* 中文别名：验收脚本按这几个键读「画布 / 本关内容 / 是否超界」 */
              画布X:fx, 画布Y:fy, 本关X:+unitsX.toFixed(2), 本关Y:+unitsY.toFixed(2),
              超出画布:((unitsX>FRAME_X+1e-6)||(unitsY>FRAME_Y+1e-6)) };
  LAY.sections={ header:Math.round(m.header), tray:Math.round(m.tray), tools:Math.round(m.tools),
                 padT:Math.round(m.padT), padB:Math.round(m.padB), vw:m.vw, vh:m.vh, gap:GAP };
  board.style.width=bw+'px'; board.style.height=bh+'px';
  var t=$('#table');
  if(t){ t.style.width=(bw+24)+'px'; t.style.height=(bh+24)+'px'; }
  var size=Math.max(2, Math.round(CARD*cell));
  G.cards.forEach(function(c){
    if(!c.el) return;
    c.el.style.width=size+'px';
    c.el.style.height=size+'px';
    c.el.style.transform='translate3d('+Math.round(offX + c.x*cell)+'px,'+Math.round(offY + c.y*cell)+'px,0)';
    c.el.style.zIndex=10+c.layer*10;
  });
  placeCurtains();
  renderLinks();
  return true;
}
/* 实测体检：棋盘可用矩形与上下 8px 间距、卡片边长、是否溢出（第 4.2 / 20.7 节） */
function layoutInfo(){
  var r={};
  try{
    var bw=boardWrap.getBoundingClientRect();
    var hd=document.querySelector('header').getBoundingClientRect();
    var tb=$('#trayBar').getBoundingClientRect();
    var bd=board.getBoundingClientRect();
    r.gapTop=Math.round(bd.top - hd.bottom);
    r.gapBottom=Math.round(tb.top - bd.bottom);
    r.rectGapTop=Math.round(bw.top - hd.bottom);
    r.rectGapBottom=Math.round(tb.top - bw.bottom);
    r.usableW=Math.round(bw.width); r.usableH=Math.round(bw.height);
    r.boardW=Math.round(bd.width); r.boardH=Math.round(bd.height);
    r.card=LAY.card; r.cell=+LAY.cell.toFixed(3);
    r.overflowX=(document.documentElement.scrollWidth > (window.innerWidth||0)+1);
    r.tableRightOver=Math.round(bd.right - bw.right);
    r.trayRightOver=Math.round(tb.right - bw.right);
    r.sections=LAY.sections;
  }catch(e){ r.err=String(e&&e.message||e); }
  return r;
}
var layoutTimers=[];
function scheduleLayout(){
  layoutTimers.forEach(function(t){ clearTimeout(t); });
  layoutTimers=[];
  var again=function(ms){ layoutTimers.push(setTimeout(function(){ layout(); }, ms)); };
  if(window.requestAnimationFrame) requestAnimationFrame(function(){ if(!layout()) requestAnimationFrame(layout); });
  again(60); again(200); again(600);
}
function toolTotal(k){ return tools[k].free + tools[k].stock; }
function updateHUD(){
  $('#hudLv').textContent=level;
  var sp=$('#hudSp');
  if(sp) sp.textContent = SPECIAL_NAME[(cfg&&cfg.special)||'none'];
  $('#hudStreak').textContent=streak;
  $('#hudCoin').textContent=coins;
  var playable=running;
  ['shuffle','undo','scissor'].forEach(function(k){
    var Cap=k.charAt(0).toUpperCase()+k.slice(1);
    var el=$('#c'+Cap), btn=$('#btn'+Cap);
    var tot=toolTotal(k), price=TOOL_PRICE[k], canBuy=coins>=price;
    if(el){
      /* v0.11 第 2 项：还有免费/库存就显示剩余次数；用完了改显示水果币价格 */
      el.textContent = tot>0 ? tot : price;
      el.classList.toggle('stock', tot>0 && tools[k].free<=0);
      el.classList.toggle('buy',   tot<=0 && canBuy);
      el.classList.toggle('nobuy', tot<=0 && !canBuy);
      el.title = tot>0
        ? ('本局免费 '+tools[k].free+' + 奖励库存 '+tools[k].stock)
        : (TOOL_NAME[k]+'的免费次数已用完：点一下花 '+price+' 水果币买 1 次（现有 '+coins+'）');
    }
    if(btn) btn.classList.toggle('canbuy', tot<=0 && canBuy);
  });
  /* v0.11 第 2 项：免费次数用完不再直接置灰 —— 点一下会明确告诉玩家「花多少水果币」，
     金币够就弹购买确认。只有整局不可操作（或返回道具没东西可退）时才禁用。 */
  $('#btnShuffle').disabled = !playable;
  $('#btnUndo').disabled    = !playable || G.tray.length===0;
  $('#btnScissor').disabled = !playable;
}
/* 文案提示（v0.10 第 3 项）：出现后停留 10 秒才消失，期间再来一条就换文案并重新计时。 */
function toast(msg){
  var t=$('#toast'); if(!t) return;
  t.textContent=msg; t.classList.add('on');
  if(toast._t) clearTimeout(toast._t);
  toast._ms=TOAST_MS;
  toast._shownAt=Date.now();
  toast._t=setTimeout(function(){ t.classList.remove('on'); toast._t=0; }, TOAST_MS);
}
/* 验收用：当前 toast 还要显示多久（毫秒） */
function toastLeftMs(){ return toast._t ? Math.max(0, TOAST_MS-(Date.now()-(toast._shownAt||0))) : 0; }
function floatText(x,y,txt){
  var d=document.createElement('div');
  d.className='float'; d.textContent=txt;
  d.style.left=x+'px'; d.style.top=y+'px';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 900);
}
function floatAtTray(txt){

}
function flyTo(fromRect, toRect, c, done, cls){
  inFlight[c.id]=1;                              /* 先标记：飞完之前不落格，避免同屏两次 */
  if(G) renderTray(-1);
  var el=document.createElement('div');
  el.className='fly'+(c.kind==='bomb'?' sp-bomb':'')+(c.kind==='rainbow'?' sp-rainbow':'');
  el.style.left=fromRect.left+'px'; el.style.top=fromRect.top+'px';
  el.style.width=fromRect.width+'px'; el.style.height=fromRect.height+'px';
  el.innerHTML='<div class="face">'+cardHTML(c)+'</div>';
  if(cls) el.classList.add(cls);
  document.body.appendChild(el);
  flyEls.push(el);
  var dx=toRect.left-fromRect.left, dy=toRect.top-fromRect.top;
  var sc=toRect.width/fromRect.width;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      el.style.transform='translate3d('+dx+'px,'+dy+'px,0) scale('+sc+')';
    });
  });

    el.remove();
    var k=flyEls.indexOf(el); if(k>=0) flyEls.splice(k,1);

/* 兜底：切后台 / 动画被节流 / 卡局看门狗触发时，把可能滞留在棋盘位置的副本清掉 */
function clearFlies(){
  flyEls.forEach(function(f){ try{ f.remove(); }catch(e){} });
  flyEls=[]; inFlight={};
}
function buildSlots(){
  trayEl.innerHTML=''; slotEls=[];
  for(var i=0;i<TRAY_N;i++){
    (function(idx){
      var d=document.createElement('div');
      d.className='slot';
      d.addEventListener('click', function(){
        var c=G && G.tray[idx];
        if(c && c.sealed) toast('蜡封着不参与凑三，先做成一次三消把它解开');
      });
      trayEl.appendChild(d);
      slotEls.push(d);
    })(i);
  }
}

/* ============================================================
   9. 操作锁与统一结算（第 11.1 节）
   ============================================================ */
function opStart(){
  if(busy || finalLock || paused || !running) return false;
  if(armedBomb) return false;              /* 炸弹待确认期间不接受其它操作，保证预览快照有效 */
  busy=true; busyAt=Date.now(); opSerial++;
  return true;
}
function opEnd(){ busy=false; }
/* v0.11 第 2 项：扣一次道具。免费 → 连胜奖励库存 → 都不够就花水果币买这一次。
   返回值告诉调用方这次用的是哪一种，好让提示里说明「这一下花了多少水果币」。
   注意：所有失败路径（洗牌会让局面失去通关路径、剪刀没有可剪组合、返回没有可退对象）
   都在调用它之前就 return 了，所以「没真的用出去」绝不扣币。 */
function spendTool(k){
  if(tools[k].free>0){ tools[k].free--; updateHUD(); return 'free'; }
  if(tools[k].stock>0){ tools[k].stock--; updateHUD(); return 'stock'; }
  coins=Math.max(0, coins-TOOL_PRICE[k]);
  updateHUD(); save();
  return 'coin';
}
/* 只有真的花了水果币才追加的后缀 */
function payNote(k, src){
  return src==='coin' ? ('（花 '+TOOL_PRICE[k]+' 水果币买的这一次）') : '';
}
/* 现在能不能用一个道具：还有免费/库存，或者水果币买得起 */
function toolPayable(k){ return toolTotal(k)>0 || coins>=TOOL_PRICE[k]; }
function markCurtainsAfterRemoval(list){
  if(!cfg || cfg.special!=='curtain' || !G.curtains.length) return;
  var R=boardCards(G).length;          /* 棋盘上仍未取走的水果 */
  list.forEach(function(c){
    G.curtains.forEach(function(k){
      if(k.state==='gone' || k.cardId!==c.id) return;
      if(R<=CURTAIN_T){ k.state='gone'; k.cardId=-1; k.pending=''; }   /* 末局永久退场优先 */
      else k.pending='rebind';
    });
  });
}
function pickCurtainTarget(){
  var used={};
  G.curtains.forEach(function(k){ if(k.cardId>=0) used[k.cardId]=1; });
  computeLocked(G);
  var cand=G.cards.filter(function(c){
    return c.state==='board' && c.kind==='fruit' && c.sp==='' && !c.locked && !used[c.id];
  });
  if(!cand.length) return -1;
  return cand[Math.floor(rndNext()*cand.length)].id;
}
function curtainBookkeeping(events){
  if(!cfg || cfg.special!=='curtain' || !G.curtains.length) return;
  var alive=G.curtains.filter(function(k){ return k.state!=='gone'; });
  for(var i=0;i<events;i++){                 /* 每次消除让所有尚存组各自取反 */
    for(var g=0; g<curtainDown.length; g++) curtainDown[g]=!curtainDown[g];
  }
  alive.forEach(function(k){
    if(k.pending!=='rebind') return;
    k.pending='';
    var t=pickCurtainTarget();
    if(t>=0){ k.cardId=t; k.state='bound'; } else { k.cardId=-1; k.state='waiting'; }
  });
  alive.forEach(function(k){
    if(k.state!=='waiting') return;
    var t=pickCurtainTarget();
    if(t>=0){ k.cardId=t; k.state='bound'; }
  });
}
function resolveMatchesLive(){
  var events=0, guard=0;
  while(guard++<60){
    var m=findMatch(G);
    if(!m) break;
    var trio=matchCards(G,m);
    var snap=G.freeSnap;
    trio.forEach(function(c){ c.state='gone'; });
    G.tray=G.tray.filter(function(c){ return trio.indexOf(c)<0; });
    coins += AWARD_UNIT;
    floatAtTray('打包售出 +'+AWARD_UNIT);
    applyEliminateEvent(G, trio, snap);
    events++;
  }
  return events;
}
/* 第 8.2 节：没有有效目标的炸弹「不消耗、直接退场」。
   必须在结算时立刻执行：炸弹压着正下方的牌，不退场就会把那颗水果永久锁死。 */
function retireDeadBombsLive(){
  var before=[];
  G.cards.forEach(function(c){ if(c.state==='board' && c.kind==='bomb') before.push(c); });
  var n=retireTargetlessBombs(G);
  if(n){
    before.forEach(function(c){ if(c.state==='gone' && c.el) c.el.classList.add('gone'); });
    floatAtTray('💣 范围内已无可炸水果，炸弹自动退场');
  }
  return n;
}
/* 一次操作（取牌／成对取牌／敲冰／引爆／道具）后的统一结算 */
function settle(){
  if(G && G.__meltLog) G.__meltLog.length=0;         /* 清空上一次的解封记录 */
  var events=resolveMatchesLive();
  retireDeadBombsLive();
  computeLocked(G); repaintBoard();
  renderTray(-1); updateHUD(); save();
  flushWaxMelt();                                    /* 补播融化动效（含「解封后立刻三消」这条路径） */
  if(judgeEnd()){ opEnd(); return; }
  curtainBookkeeping(events);
  renderCurtains(); renderLinks();
  if(checkFinalAuto()) return;
  opEnd();
  checkStuckRecovery();
  saveState();
}
function judgeEnd(){
  if(endGuard) return true;
  retireDeadBombsLive();                       /* 兜底：任何路径进入判定前，先把无目标炸弹退场 */
  var live=boardCards(G);
  var fruitLeft=live.filter(function(c){ return c.kind==='fruit'; });
  /* 通关 = 盘上没有待取的普通水果、货栏也空了。
     炸弹是工具不是水果：第 8.2 节规定「无目标不消耗」，玩家完全可能先把靶区的三张水果
     当成普通三消取走，这时炸弹就再没有目标。如果还要求把炸弹也消掉，这一关就永远结束不了。
     所以这里只数普通水果，剩下的炸弹在通关瞬间自然退场。 */
  if(!fruitLeft.length && !G.tray.length){
    endGuard=true;
    live.forEach(function(c){
      if(c.kind==='bomb'){ c.state='gone'; if(c.el) c.el.classList.add('gone'); }
    });
    doWin();
    return true;
  }
  if(G.tray.length>=TRAY_N){ endGuard=true; doLose('full'); return true; }
  if(!hasLegalMove()){ endGuard=true; doStuck(); return true; }
  return false;
}
/* v0.11：判定收敛到规则层的唯一实现，页面不再自己维护一份（两份必然漂移） */
function hasLegalMove(){ return simLegalMoveCount(G)>0; }
/* 卡局时检查当前真实可用的解困能力（P02）：不能只凭按钮有次数就宣称能解困。
   v0.11 第 2 项：免费次数与奖励库存都用完、但水果币买得起时，同样算「现在能解困」。 */
function toolCanHelp(){
  var out=[];
  var live=boardCards(G);
  var okUndo   = toolTotal('undo')>0    || coins>=TOOL_PRICE.undo;
  var okShuffle= toolTotal('shuffle')>0 || coins>=TOOL_PRICE.shuffle;
  var okScissor= toolTotal('scissor')>0 || coins>=TOOL_PRICE.scissor;
  if(okUndo && G.tray.length>0) out.push('返回');
  if(okShuffle){
    var byLayer={};
    live.forEach(function(c){ if(c.kind==='fruit') (byLayer[c.layer]=byLayer[c.layer]||[]).push(c); });
    for(var L in byLayer){ if(byLayer[L].length>=2){ out.push('风车'); break; } }
  }
  if(okScissor){
    if(scissorCombos().length) out.push('剪刀');
  }
  return out;
}
function checkStuckRecovery(){
  if(!stuck) return;
  if(hasLegalMove()){ stuck=false; closeModal(); toast('局面活了，继续！'); return; }
  var help=toolCanHelp();
  if(!help.length){ stuck=false; endGuard=false; doStuck(true); return; }
  if(!maskEl.classList.contains('on')) showStuckModal();
}


/* ============================================================
   10. 交互：取牌 / 成对取牌 / 敲冰 / 引爆
   ============================================================ */
function boardRectOf(c){
  var br=board.getBoundingClientRect();
  var size=Math.max(2, Math.round(CARD*cell));
  return { left: br.left + offX + c.x*cell, top: br.top + offY + c.y*cell, width:size, height:size };
}
function toastTakeReason(why){
  if(why==='covered')      toast('这张被压住了，先清掉上面的');
  else if(why==='chain')   toast('双果链锁着：两端都露出来、并腾出两个空位才能整对取走');
  else if(why==='frozen')  toast('冻住了：先按本关方式解冻');
  else if(why==='rainbow') toast('被彩虹盖住了：先用别的水果做成一次三消，彩虹层才会揭开');
  else if(why==='needSame')toast('货栏里先放一张同类水果，才能取走这张');
  else if(why==='full')    toast('货栏满了');
  else                     toast('这张现在取不了');
}
function onCardClick(c){
  if(busy || finalLock || paused || !running || !G) return;
  if(armedBomb){ toast('先点「引爆」或「取消」把炸弹处理掉'); return; }
  if(stuck){ toast('当前没有合法操作，可用道具或重试本局'); return; }
  if(Date.now()<teachUntil) return;
  if(c.state!=='board') return;
  if(c.kind==='bomb') return;                 /* 炸弹走「点击 → 预览 → 确认引爆」 */
  if(c.locked){ toast('这张被压住了，先清掉上面的'); return; }
  if(c.rainbow){                              /* 彩虹覆盖层不能直接取（第 9.2 节） */
    toast('彩虹盖着这张水果：先用其他水果做成一次三消，彩虹层才会揭开');
    if(c.el){
      c.el.classList.remove('rainshake'); void c.el.offsetWidth; c.el.classList.add('rainshake');
      later(function(){ if(c.el) c.el.classList.remove('rainshake'); }, 520);
    }
    return;
  }
  if(c.sp==='ice' && c.iceLeft>0){            /* 冰冻只有邻消解冻，点了给准确提示＋明确的「点不动」反馈 */
    toast('冰层敲不动：让旁边同层的水果做成一次三消，冰层才会化');
    if(c.el){
      c.el.classList.remove('iceshake'); void c.el.offsetWidth; c.el.classList.add('iceshake');
      later(function(){ if(c.el) c.el.classList.remove('iceshake'); }, 520);
    }
    return;
  }
  if(!opStart()) return;
  G.freeSnap=freeSnapOf(G);
  if(isPairLinked(c)){
    /* 双果链必须整对取走：两端都无遮挡 + 货栏至少空两格（Q06 / 第 7.2 节 / A03 / A04）。
       这里以前漏了校验，直接 takePair → 「只剩一个空位」也能把两张塞进货栏（货栏超过 7 格、
       slotEls 越界报错），「另一端被压住」也照样成对取走。 */
    var rp=canTakePair(G,c);
    if(!rp.ok){
      opEnd();
      if(rp.why==='need2')        toast('双果链要一次收走两张：货栏得先腾出两个空位（现在只剩一个）');
      else if(rp.why==='covered') toast('双果链的另一端还被压着：两端都露出来才能整对取走');
      else                        toast('这条双果链现在取不动');
      return;
    }
    takePair(c); return;
  }
  var r=canTakeSingle(G,c);
  if(!r.ok){ opEnd(); toastTakeReason(r.why); return; }
  takeSingle(c);
}
function takeSingle(c){
  var fromRect=c.el.getBoundingClientRect();
  c.state='tray'; c.trayAt=(++G.seq);
  if(c.sp==='wax') c.sealed=true;               /* 每次入栏都重新封蜡（21.4.1） */
  c.el.classList.add('gone');
  G.tray.push(c);
  markCurtainsAfterRemoval([c]);
  computeLocked(G); repaintBoard();
  var idx=G.tray.length-1;
  var toRect=slotEls[idx].getBoundingClientRect();
  renderTray(-1); renderCurtains(); renderLinks(); updateHUD();
  flyTo(fromRect, toRect, c, function(){ renderTray(idx); settle(); });
}
function takePair(c){
  var p=pairOf(G,c);
  /* 防御：任何调用路径都不得越过「两端无遮挡 + 货栏空两格」的硬约束，
     否则货栏会超过 7 格，且 slotEls[iA+1] 越界报错（第 7.2 节 / Q06）。 */
  if(!p || p.broken || !canTakePair(G,c).ok) return false;
  var A=G.byId[p.a], B=G.byId[p.b];
  var rA=A.el.getBoundingClientRect(), rB=B.el.getBoundingClientRect();
  var iA=G.tray.length;
  A.state='tray'; A.trayAt=(++G.seq); A.el.classList.add('gone'); G.tray.push(A);
  B.state='tray'; B.trayAt=(++G.seq); B.el.classList.add('gone'); G.tray.push(B);
  p.broken=true;                                 /* 断链：永久消失，不进链（第 7.1 节） */
  markCurtainsAfterRemoval([A,B]);
  computeLocked(G); repaintBoard();
  renderTray(-1); renderCurtains(); renderLinks(); updateHUD();
  flyTo(rA, slotEls[iA].getBoundingClientRect(), A, null);
  flyTo(rB, slotEls[iA+1].getBoundingClientRect(), B, function(){
    renderTray(iA+1);
    settle();                                    /* 两张都入栏后统一结算（Q06） */
  });
}
/* 敲冰已删除（v0.9 第 10.2 节）：冰冻只保留邻消解冻。
   保留一个空实现，避免旧存档／旧调用在别处引用到不存在的函数。 */
function chipIce(c){ toast('冰层敲不动：让旁边同层的水果做成一次三消，冰层才会化'); }

/* 炸弹（第 8.2 / 8.5 节）：点击无遮挡炸弹 → 先显示爆炸范围与实际会清除的目标 →
   再次确认才引爆；取消不消耗炸弹。预览与实际清除共用同一份开始快照。 */
var armedBomb=null, armedPlan=null;
function clearBoomPreview(){
  if(!G) return;
  G.cards.forEach(function(x){ if(x.el){ x.el.classList.remove('boom-range','boom-target'); } });
}
function boomBar(on, msg){
  var bar=$('#boomBar'), m=$('#boomMsg');
  if(!bar) return;
  if(m && msg!==undefined) m.textContent=msg;
  bar.classList.toggle('on', !!on);
}
function boomSummaryText(plan){
  return plan.summary.map(function(q){ return FRUITS[q.fruit].n+'×'+q.remove; }).join(' ');
}
function armBomb(c){
  var r=canBoom(G,c);
  if(!r.ok){
    if(r.why==='covered')       toast('这张被压住了，炸不了');
    else if(r.why==='notarget') toast('这个炸弹已经没有可炸的水果了（靶区先被当普通三消收走）→ 它会自动退场，不用管它');
    else                        toast('这个炸弹现在不能引爆');
    return false;
  }
  clearBoomPreview();
  var plan=bombPlan(G,c);                       /* 预览用这一份快照 */
  plan.range.forEach(function(x){ if(x.el && x!==c) x.el.classList.add('boom-range'); });
  plan.remove.forEach(function(x){ if(x.el) x.el.classList.add('boom-target'); });
  armedBomb=c; armedPlan=plan;
  var byf=boomSummaryText(plan);
  toast('已选好爆破范围：会清掉 '+plan.remove.length+' 张'+(byf?('（'+byf+'）'):'')+'，确认后才引爆');
  boomBar(true, (byf||'范围内没有可清的水果')+'　共 '+plan.remove.length+' 张');
  return true;
}
function disarmBomb(silent){
  if(!armedBomb) return;
  armedBomb=null; armedPlan=null;
  clearBoomPreview();
  boomBar(false);
  if(!silent) toast('已取消爆破，炸弹没有消耗');
}
function bindBomb(el,c){
  el.addEventListener('click', function(e){
    e.stopPropagation();
    if(busy||finalLock||paused||!running||stuck||!G) return;
    if(Date.now()<teachUntil) return;
    if(c.state!=='board') return;
    if(armedBomb===c){ detonateBomb(c); return; }      /* 再点同一个炸弹 = 确认引爆 */
    if(armedBomb) disarmBomb(true);
    armBomb(c);
  });
}
function detonateBomb(c){
  /* UI 路径已经备好快照；脚本路径（__juguo.boom / 自动走一步）在这里现场备一份 */
  var plan = (armedBomb===c && armedPlan) ? armedPlan : null;
  if(armedBomb) disarmBomb(true);
  if(!opStart()) return;
  var r=canBoom(G,c);
  if(!r.ok){ opEnd(); toast('炸弹现在不能引爆'); return; }
  if(!plan) plan=bombPlan(G,c);                  /* 同一份快照：预览与清除用同一个 plan */
  G.freeSnap=freeSnapOf(G);
  plan.bombs.forEach(function(b){ b.state='gone'; if(b.el) b.el.classList.add('gone'); });
  plan.remove.forEach(function(o){ o.state='gone'; if(o.el) o.el.classList.add('gone'); });
  markCurtainsAfterRemoval(plan.remove);
  floatAtTray(plan.remove.length
    ? '💥 '+boomSummaryText(plan)
    : '💥 空爆，只清掉炸弹本身');
  renderTray(-1);
  computeLocked(G); repaintBoard(); renderCurtains(); renderLinks(); updateHUD();
  later(function(){ settle(); }, 190);
}

/* ============================================================
   11. 最后一组三张自动入栏 + 最终三消动效（v0.9 第 3.3 节 / v0.10 第 6 项重写）
   触发对象是「棋盘剩余最后 3 张同种水果」。
   旧写法靠「白名单」排除：只要牌上带 sp（同果锁／封蜡／冰冻）或还挂着 pairId（双果链端点）
   就一律不触发，结果第 1 关（同果锁）、第 2 关（双果链）这类关卡的自动收尾**永远不会发生**——
   玩家反馈的「最后三张不自动收尾」就是这么来的。而且它只检查「货栏还剩几格」，
   不检查这三张取进去以后到底会不会真的消掉，个别情况还会把局面自动走成卡局。
   现在改成**按真实规则试一遍**：在盘面副本上用同一套取牌规则把这三张依次取进货栏并结算，
   只有「三张都真的取进去了 + 结算完 = 本关真的通关」才算成立（第 3.3 节第 4 条原话：
   「不能只比较图标后跳过封蜡、遮帘或冰冻的实际状态」）。封蜡入栏即封、不参与凑三，
   会被自然判掉；同果锁只要顺序对（先放一张同类、再取锁牌）就能成立。
   ============================================================ */
var autoCount=0;                                  /* 自动收尾触发次数（验收用） */
function finalThreeInfo(){
  if(!G) return null;
  var i, c, f=-1;
  var live=boardCards(G).filter(function(x){ return x.kind==='fruit'; });   /* 炸弹不算普通水果 */
  if(live.length!==3) return null;
  live.sort(function(a,b){ return a.id-b.id; });         /* 棋盘自然顺序优先 */
  for(i=0;i<3;i++){
    c=live[i];
    if(f<0) f=c.fruit;
    else if(c.fruit!==f) return null;                    /* 三张必须同一种水果 */
  }
  for(i=0;i<G.curtains.length;i++){
    if(G.curtains[i].state==='waiting') return null;     /* 等待转移的遮帘也算待处理 */
  }
  /* 真·可行性：取牌顺序、货栏空位、封蜡查封、冰冻、彩虹、双果链、遮挡全部由规则判 */
  var sim=simFinalThree(G, [live[0].id, live[1].id, live[2].id]);
  if(!sim.ok) return null;
  return { cards:sim.order.map(function(k){ return live[k]; }), fruit:f,
           order:sim.order.slice(), sim:sim };
}
/* 只读诊断：给出「为什么现在不触发最后三张收尾」（验收／排障用） */
function finalThreeWhy(){
  if(!G) return 'no-game';
  var live=boardCards(G).filter(function(c){ return c.kind==='fruit'; });
  if(live.length!==3) return 'board-fruit='+live.length;
  var f=live[0].fruit, i;
  for(i=1;i<3;i++){ if(live[i].fruit!==f) return 'not-same-fruit'; }
  for(i=0;i<G.curtains.length;i++){ if(G.curtains[i].state==='waiting') return 'curtain-waiting'; }
  for(i=0;i<live.length;i++){ if(live[i].locked) return 'locked:'+live[i].id; }
  var sim=simFinalThree(G, [live[0].id, live[1].id, live[2].id]);
  return sim.ok ? 'ok' : ('sim:'+sim.why);
}
function checkFinalAuto(){
  if(!running || finalLock || cfg.autoFinish===false) return false;
  if(document.body.dataset.phase!=='play') return false;
  var info=finalThreeInfo();
  if(!info) return false;
  runFinalAuto(info);
  return true;
}
/* 依次自动取走这三张（不跳过遮挡／链／状态校验），第三张落栏后做收尾动效。
   顺序取 finalThreeInfo 里模拟验证过的那个可行顺序 —— 棋盘自然顺序取不动时（例如同果锁），
   换一个能取动的顺序，而不是直接放弃自动收尾。 */
function runFinalAuto(info){
  finalLock=true;
  busy=true;
  autoCount++;
  toast('只剩最后三张，自动收进货车');
  var list=info.cards, i=0;
  (function takeNext(){
    if(i>=list.length){ later(spinFinalGroup, 130); return; }
    var c=list[i++];
    var fromRect=c.el.getBoundingClientRect();
    c.state='tray'; c.trayAt=(++G.seq);
    if(c.sp==='wax') c.sealed=true;               /* 入栏即封（模拟已判掉，语义仍保持一致） */
    G.tray.push(c);
    c.el.classList.add('gone');
    markCurtainsAfterRemoval([c]);
    computeLocked(G); repaintBoard();
    var idx=G.tray.length-1;
    renderTray(-1); renderCurtains(); renderLinks(); updateHUD();
    flyTo(fromRect, slotEls[idx].getBoundingClientRect(), c, function(){
      renderTray(idx);
      takeNext();
    });
  })();
}
/* 本组三张中最早入栏的第一张：上浮跳出 → 平滑 360° → 自然落回，落回后才三消 */
function spinFinalGroup(){
  var m=findMatch(G);
  if(!m){ finalLock=false; busy=false; settle(); return; }
  var trio=matchCards(G,m);
  var first=trio[0];                              /* 货栏从左到右的第一张 = 本组最早入栏 */
  var slotIdx=G.tray.indexOf(first);
  var el=slotEls[slotIdx] ? slotEls[slotIdx].firstChild : null;
  var bar=$('#trayBar');
  if(bar) bar.classList.add('celebrating');
  var finished=false;
  var done=function(){
    if(finished) return;
    finished=true;
    if(el && el.classList) el.classList.remove('finalspin');
    if(bar) bar.classList.remove('celebrating');
    commitFinalMatch(m);
  };
  finalDone=done;                                 /* 供看门狗兜底恢复 */
  if(el && el.classList){
    void el.offsetWidth;                          /* 保证动画能重新开始 */
    el.classList.add('finalspin');
    later(done, FINAL_MS+60);
  } else done();
}
var finalDone=null;
function commitFinalMatch(m){
  if(finalCommitted) return;
  finalCommitted=true;
  finalDone=null;
  var trio=matchCards(G,m);
  var snap=G.freeSnap;
  trio.forEach(function(c){ c.state='gone'; });
  G.tray=G.tray.filter(function(c){ return trio.indexOf(c)<0; });
  coins += AWARD_UNIT;
  floatAtTray('打包售出 +'+AWARD_UNIT);
  applyEliminateEvent(G, trio, snap);
  renderTray(-1);
  flushWaxMelt();                                 /* 收尾这一手若解了封，同样要播融化动效 */
  computeLocked(G); repaintBoard();
  curtainBookkeeping(1);
  renderCurtains(); renderLinks(); updateHUD();
  finalLock=false; busy=false;
  judgeEnd();
  saveState();
}

/* v0.11 第 1 项：死局自愈 —— 出现「一步都走不动」时，松开最少的同果锁牌让局面重新能动。
   为什么这样合理：走到这一步，同果锁「货栏里要先有 1 张同类」的条件已经不可能满足了
   （盘面和货栏都没有可取的同类），锁只剩下挡路，松开它不算放水。
   只在真死局才可能触发（先看合法操作数）；救不活就一张都不改，保持原有卡局 / 失败流程。 */
function autoUnlockRescue(){
  if(!G) return false;
  var plan=simUnlockPlan(G);
  if(!plan.ok || !plan.ids.length) return false;
  var names=[];
  plan.ids.forEach(function(id){
    var c=G.byId[id];
    if(!c || c.sp!=='lock') return;
    names.push((FRUITS[c.fruit] && FRUITS[c.fruit].n) || ('第 '+(c.fruit+1)+' 号水果'));
    c.sp='';                                   /* 松开：这张退回普通水果 */
    autoUnlockCount++;
  });
  if(!names.length) return false;
  autoUnlockLog.push({ lv:level, ids:plan.ids.slice(), names:names.slice(),
                       before:plan.before, after:plan.after });
  computeLocked(G); repaintBoard(); renderTray(-1); updateHUD();
  /* 动效要等重绘之后再补：paintCard 会重写 className，先加会被抹掉 */
  plan.ids.forEach(function(id){
    var c=G.byId[id];
    if(c && c.el){ c.el.classList.remove('unlockfx'); void c.el.offsetWidth; c.el.classList.add('unlockfx'); }
  });
  toast('🔓 一步都走不动了，同果锁自动松开：'+names.join('、'));
  saveState();
  return true;
}
function doStuck(){

  if(autoUnlockRescue()){ stuck=false; endGuard=false; return; }

/* 200 水果币续关（第 21.5 节） */
function continuePossible(){
  if(!G || !G.tray.length) return false;
  var sim=simClone(G);
  restoreTrayForContinue(sim);
  computeLocked(sim);
  return simHasMove(sim);
}
function simHasMove(ctx){
  var live=boardCards(ctx);
  computeLocked(ctx);
  for(var i=0;i<live.length;i++){
    var c=live[i];
    if(c.locked) continue;
    if(c.kind==='bomb'){ if(bombHasTarget(ctx,c)) return true; continue; }
    var p=pairOf(ctx,c);
    if(p && !p.broken){ if(canTakePair(ctx,c).ok) return true; continue; }
    if(c.sp==='ice' && c.iceLeft>0) continue;      /* 冰冻不能点，只能等相邻三消（v0.9） */
    if(c.rainbow) continue;                         /* 彩虹盖着的底牌不能取（第 9 节） */
    if(canTakeSingle(ctx,c).ok) return true;
  }
  return false;
}
function restoreTrayForContinue(ctx){
  var done={};
  ctx.tray.slice().forEach(function(c){
    if(done[c.id]) return;
    /* 封蜡：退回保留蜡封类型（sp 一直是 wax），下次入栏重新封蜡 */
    if(c.pairId>=0){
      var p=ctx.pairs[c.pairId];
      var other=ctx.byId[c.id===p.a ? p.b : p.a];
      if(other && other.state==='tray'){
        c.state='board'; c.trayAt=0; c.sealed=false;
        other.state='board'; other.trayAt=0; other.sealed=false;
        p.broken=false;                            /* 整对退回并恢复链 */
        done[c.id]=done[other.id]=1;
        return;
      }
      /* 仅剩一端：作为普通水果退回，不恢复链、不复活另一端 */
      p.broken=true; c.pairId=-1; c.pairEnd=0;
    }
    c.state='board'; c.trayAt=0; c.sealed=false;
    done[c.id]=1;
  });
  ctx.tray=[];
}
function continueBtn(){
  var cost=200;
  if(!G || !G.tray.length) return { t:'货栏里没有可退回的牌，无法续关', c:'ghost', fn:null };
  if(!continuePossible()) return { t:'退回后仍然没有合法操作，续关不可用', c:'ghost', fn:null };
  if(coins<cost) return { t:'水果币不足（需 200，现有 '+coins+'）', c:'ghost', fn:null };
  return { t:'花 200 水果币：货栏退回棋盘，继续本局', c:'coin', fn:doContinue };
}
function doContinue(){
  if(busy||finalLock||!G) return;
  busy=true;
  var cost=200;
  if(coins<cost){ busy=false; toast('水果币不足'); return; }
  if(!G.tray.length){ busy=false; toast('货栏里没有可退回的牌'); return; }
  if(!continuePossible()){ busy=false; toast('退回后仍然没有合法操作，未扣币'); return; }
  var list=G.tray.slice();
  coins-=cost;                                   /* 一次性扣币 + 提交恢复结果 */
  restoreTrayForContinue(G);
  setPhase('play'); stuck=false; endGuard=false; winGuard=false;
  computeLocked(G); repaintBoard(); layout();
  renderTray(-1); renderCurtains(); renderLinks(); updateHUD();
  closeModal();
  toast('货栏已退回棋盘，继续！');

  save(); saveState();

   13. 道具（风车 / 返回 / 剪刀）
   ============================================================ */
function byLayerIndex(cards){
  var m={};
  cards.forEach(function(c){ (m[c.layer]=m[c.layer]||[]).push(c); });
  return m;
}
/* ---- v0.11 第 2 项：道具门禁 ----
   免费次数（每局 2~4 次）和连胜奖励库存都用完时，允许花水果币买 1 次。
   返回 true  = 可以直接执行，调用方继续；
   返回 false = 已经弹了购买确认框、或给了「差多少水果币」的提示，调用方到此为止。
   扣币一律发生在道具真的用出去的那一刻（spendTool），所以中途校验失败一分不花。 */
function toolGate(k, run){
  if(toolTotal(k)>0) return true;                    /* 还有免费次数 / 奖励库存：老规矩 */
  var price=TOOL_PRICE[k], nm=TOOL_NAME[k];
  if(coins<price){
    toast(nm+'的免费次数用完了：'+price+' 水果币可购买，你现在只有 '+coins);
    return false;
  }
  openModal('购买'+nm,
    '<div class="mnote">本局 '+nm+' 的免费次数和奖励库存都用完了。<br>'
    + '花 <b>'+price+'</b> 水果币买 1 次？（现有 '+coins+' 水果币）<br>'
    + '<span style="color:#8B7C5E">买来的这一次如果没用出去（目标已变化、洗牌后局面会失去通关路径等），不会扣币。</span></div>',
    [{ t:'花 '+price+' 水果币使用', c:'main', fn:function(){ closeModal(); run(); } },
     { t:'再想想', c:'ghost', fn:closeModal }]);
  return false;
}
/* 风车：只打乱水果图案，不动坐标 / 层级 / 货栏；洗后必须仍然可通关（11.3.3） */
function useShuffle(){ if(toolGate('shuffle', useShuffleDo)) useShuffleDo(); }
function useShuffleDo(){
  if(!opStart()) return;
  if(!toolPayable('shuffle')){ opEnd(); toast('风车用完了：'+TOOL_PRICE.shuffle+' 水果币可购买，现有 '+coins); return; }
  G.freeSnap=freeSnapOf(G);
  var backupF=G.cards.map(function(c){ return c.fruit; });
  var backupB=G.pairs.map(function(p){ return p.broken; });
  var byL=byLayerIndex(G.cards.filter(function(c){
    return c.state==='board' && c.kind==='fruit';
  }));
  Object.keys(byL).forEach(function(L){
    var arr=byL[L], i, j, t;
    var pool=arr.map(function(c){ return c.fruit; });
    for(i=pool.length-1;i>0;i--){ j=Math.floor(rndNext()*(i+1)); t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    arr.forEach(function(c,idx){ c.fruit=pool[idx]; });
  });
  /* 双果链两端必须仍是不同种类（11.3.3） */
  G.pairs.forEach(function(p){
    if(p.broken) return;
    var a=G.byId[p.a], b=G.byId[p.b];
    if(!a||!b||a.state!=='board'||b.state!=='board') return;
    if(a.fruit===b.fruit){
      var pool=G.cards.filter(function(c){
        return c.state==='board' && c.kind==='fruit' && c!==a && c!==b && c.fruit!==b.fruit;
      });
      if(pool.length){ a.fruit=pool[Math.floor(rndNext()*pool.length)].fruit; }
    }
  });
  var res=simulate(G, 90000);
  if(!res.ok){
    G.cards.forEach(function(c,i){ c.fruit=backupF[i]; });
    G.pairs.forEach(function(p,i){ p.broken=backupB[i]; });
    opEnd();
    toast('这次洗牌会让局面失去通关路径，已还原（未扣次数）');
    return;
  }
  G.cards.forEach(function(c){ if(c.el && c.state==='board') paintCard(c); });
  renderLinks();
  var srcS=spendTool('shuffle');
  toast('风车转起来了，牌面已重排'+payNote('shuffle',srcS));
  later(function(){ opEnd(); if(stuck) checkStuckRecovery(); saveState(); }, 160);
}
/* 返回（K01 / 第 21.1 节）：从货栏最右侧向左找第一个可返回对象 */
function useUndo(){ if(toolGate('undo', useUndoDo)) useUndoDo(); }
function useUndoDo(){
  if(!opStart()) return;
  if(!toolPayable('undo')){ opEnd(); toast('返回用完了：'+TOOL_PRICE.undo+' 水果币可购买，现有 '+coins); return; }
  var target=null, i;
  for(i=G.tray.length-1;i>=0;i--){
    var c=G.tray[i];
    if(c.kind==='bomb') continue;
    if(c.pairId>=0){
      var p=G.pairs[c.pairId];
      var other=G.byId[c.id===p.a ? p.b : p.a];
      if(other && other.state==='tray'){ target={ type:'pair', c:c, other:other, p:p }; break; }
      continue;                                   /* 单端残留不可返回，继续向左 */
    }
    target={ type:'one', c:c }; break;
  }
  if(!target){ opEnd(); toast('暂无可返回的卡片'); return; }
  var rects=[];
  if(target.type==='pair'){
    var A=target.c, B=target.other;
    var rA=slotEls[G.tray.indexOf(A)].getBoundingClientRect();
    var rB=slotEls[G.tray.indexOf(B)].getBoundingClientRect();
    G.tray=G.tray.filter(function(x){ return x!==A && x!==B; });
    unsealForReturn(A); unsealForReturn(B);
    target.p.broken=false;                        /* 整对退回并恢复链 */
    var srcU1=spendTool('undo');
    renderTray(-1);
    computeLocked(G); repaintBoard(); layout();
    renderLinks(); renderCurtains(); updateHUD();
    flyBack(A, rA); flyBack(B, rB);
    toast('双果链整对退回棋盘'+payNote('undo',srcU1));
  } else {
    var C=target.c;
    var rC=slotEls[G.tray.indexOf(C)].getBoundingClientRect();
    G.tray=G.tray.filter(function(x){ return x!==C; });
    unsealForReturn(C);
    var srcU2=spendTool('undo');
    renderTray(-1);
    computeLocked(G); repaintBoard(); layout();
    renderLinks(); renderCurtains(); updateHUD();
    flyBack(C, rC);
    toast('已退回棋盘'+payNote('undo',srcU2));
  }
  endGuard=false;
  later(function(){ opEnd(); checkStuckRecovery(); saveState(); }, 280);
}
function unsealForReturn(c){
  c.state='board'; c.trayAt=0; c.sealed=false;    /* 封蜡牌下次入栏重新封蜡 */
  if(c.el){ c.el.classList.remove('gone'); paintCard(c); }
}
function flyBack(c, fromRect){
  var toRect=boardRectOf(c);
  var el=document.createElement('div');
  el.className='fly';
  el.style.left=fromRect.left+'px'; el.style.top=fromRect.top+'px';
  el.style.width=fromRect.width+'px'; el.style.height=fromRect.height+'px';
  el.innerHTML='<div class="face">'+cardHTML(c)+'</div>';
  document.body.appendChild(el);
  flyEls.push(el);
  c.el.classList.add('gone');
  var dx=toRect.left-fromRect.left, dy=toRect.top-fromRect.top;
  var sc=toRect.width/fromRect.width;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    el.style.transform='translate3d('+dx+'px,'+dy+'px,0) scale('+sc+')';
  });});
  later(function(){
    el.remove();
    var k=flyEls.indexOf(el); if(k>=0) flyEls.splice(k,1);
    if(c.el) c.el.classList.remove('gone');
  }, FLY_MS);
}
/* 剪刀（K02 / 第 21.2 节）：自动选一个合法三张组合，一次清除 */
function mkCombo(cards, rain, fruit, total, trayN){
  return { cards:cards, rain:rain, fruit:fruit, total:total, trayN:trayN,
           minId:Math.min.apply(null, cards.map(function(c){ return c.id; })) };
}
function nTrayOf(cards){ return cards.filter(function(c){ return c.state==='tray'; }).length; }
function scissorCombos(){
  var trayByF={}, boardByF={}, i, f;
  for(i=0;i<G.tray.length;i++){
    var c=G.tray[i];
    if(c.kind!=='fruit') continue;
    (trayByF[c.fruit]=trayByF[c.fruit]||[]).push(c);
  }
  Object.keys(trayByF).forEach(function(k){ trayByF[k].reverse(); });
  for(i=0;i<G.cards.length;i++){
    var b=G.cards[i];
    if(b.state!=='board'||b.kind!=='fruit') continue;
    if(b.rainbow) continue;                                  /* 被彩虹盖着的底牌不能剪（第 9.2 节） */
    var p=pairOf(G,b);
    if(p && !p.broken) continue;                             /* 完整双果链端点不作候选 */
    (boardByF[b.fruit]=boardByF[b.fruit]||[]).push(b);
  }
  computeLocked(G);
  Object.keys(boardByF).forEach(function(k){
    boardByF[k].sort(function(a,b){ return (a.locked?1:0)-(b.locked?1:0) || (a.id-b.id); });
  });
  function takeN(fr,n){
    var t=trayByF[fr]||[], b=boardByF[fr]||[];
    var out=t.slice(0,n);
    if(out.length<n) out=out.concat(b.slice(0,n-out.length));
    return out.length===n ? out : null;
  }
  function totalOf(fr){ return (trayByF[fr]||[]).length + (boardByF[fr]||[]).length; }
  var combos=[];
  for(f=0;f<FRUIT_N;f++){
    if(totalOf(f)<3) continue;
    var c3=takeN(f,3);
    if(c3) combos.push(mkCombo(c3, 0, f, totalOf(f), nTrayOf(c3)));
  }
  combos.sort(function(x,y){
    if(y.trayN!==x.trayN) return y.trayN-x.trayN;     /* ① 含货栏牌最多 */
    if(y.total!==x.total) return y.total-x.total;     /* ② 该种类可选总数较多者 */
    if(x.fruit!==y.fruit) return x.fruit-y.fruit;     /* ③ 水果种类固定顺序 */
    return x.minId-y.minId;                           /* ④ 卡片编号 */
  });
  return combos;
}
function useScissor(){ if(toolGate('scissor', useScissorDo)) useScissorDo(); }
function useScissorDo(){
  if(!opStart()) return;
  if(!toolPayable('scissor')){ opEnd(); toast('剪刀用完了：'+TOOL_PRICE.scissor+' 水果币可购买，现有 '+coins); return; }
  G.freeSnap=freeSnapOf(G);
  var combos=scissorCombos();
  if(!combos.length){ opEnd(); toast('没有可剪除的三张组合'); return; }
  var combo=combos[0];
  /* 提交前再校验一次，避免动画期间的过期点击改到别的牌 */
  var ok=combo.cards.every(function(c){ return c.state==='tray'||c.state==='board'; });
  if(ok){
    ok = combo.cards.every(function(c){
      if(c.state!=='board') return true;
      var p=pairOf(G,c);
      return !(p && !p.broken);
    });
  }
  if(!ok){ opEnd(); toast('目标已变化，请再试一次'); return; }
  var snap=G.freeSnap;
  combo.cards.forEach(function(c){
    c.state='gone';
    if(c.el) c.el.classList.add('gone');
  });
  G.tray=G.tray.filter(function(c){ return c.state!=='gone'; });
  markCurtainsAfterRemoval(combo.cards);            /* 全批移除后的同一剩余数用于阈值 */
  var srcC=spendTool('scissor');
  applyEliminateEvent(G, combo.cards, snap);        /* 一次有效三张消除事件 */
  floatAtTray('咔嚓！剪掉 3 张');
  if(srcC==='coin') toast('剪刀'+payNote('scissor',srcC));
  renderTray(-1);
  flushWaxMelt();                                   /* 剪刀这一手若解了封，同样要播融化动效 */
  computeLocked(G); repaintBoard(); renderCurtains(); renderLinks(); updateHUD();
  if(judgeEnd()){ opEnd(); return; }
  curtainBookkeeping(1);
  renderCurtains(); renderLinks();
  if(checkFinalAuto()) return;
  opEnd();
  checkStuckRecovery();
  saveState();
}

function save(){
  try{
    localStorage.setItem('juguo_v3', JSON.stringify({
      v:3, coins:coins, level:level, best:best, unlocked:unlocked,
      streak:streak, lastAwardedStreak:lastAwardedStreak,
      tools:{
        shuffle:{ free:tools.shuffle.free, stock:tools.shuffle.stock },
        undo:{ free:tools.undo.free, stock:tools.undo.stock },
        scissor:{ free:tools.scissor.free, stock:tools.scissor.stock }
      }
    }));
  }catch(e){}
}
function load(){
  try{
    var o=JSON.parse(localStorage.getItem('juguo_v3')||'null');
    if(!o){
      /* 旧版存档迁移：只保留能确认的货币与关卡记录，不追补无法证明的奖励（K03） */
      o=JSON.parse(localStorage.getItem('juguo_v1')||'{}');
      if(typeof o.coins==='number') coins=Math.max(0,Math.floor(o.coins));
      if(typeof o.level==='number') level=clamp(Math.floor(o.level),1,MAX_LV);
      if(typeof o.best==='number')  best=clamp(Math.floor(o.best),0,MAX_LV);
      if(typeof o.unlocked==='number') unlocked=clamp(Math.floor(o.unlocked),1,MAX_LV);
      unlocked=Math.max(unlocked, Math.min(MAX_LV, best+1));
      return;
    }
    if(typeof o.coins==='number') coins=Math.max(0,Math.floor(o.coins));
    if(typeof o.level==='number') level=clamp(Math.floor(o.level),1,MAX_LV);
    if(typeof o.best==='number')  best=clamp(Math.floor(o.best),0,MAX_LV);
    if(typeof o.unlocked==='number') unlocked=clamp(Math.floor(o.unlocked),1,MAX_LV);
    if(typeof o.streak==='number') streak=Math.max(0,Math.floor(o.streak));
    if(typeof o.lastAwardedStreak==='number') lastAwardedStreak=Math.max(0,Math.floor(o.lastAwardedStreak));
    ['shuffle','undo','scissor'].forEach(function(k){
      var t=o.tools && o.tools[k];
      tools[k].free  = (t && typeof t.free==='number')  ? Math.max(0,Math.floor(t.free))  : 0;
      tools[k].stock = (t && typeof t.stock==='number') ? Math.max(0,Math.floor(t.stock)) : 0;
    });
    unlocked=Math.max(unlocked, Math.min(MAX_LV, best+1));
  }catch(e){}
}
function saveState(){
  if(!G||!cfg) return;
  try{
    localStorage.setItem('juguo_state_v3', JSON.stringify({
      v:6, level:level, rngState:rngState, unitsX:unitsX, unitsY:unitsY,
      cfg:(function(){ var c={}; for(var k in cfg) c[k]=cfg[k]; c.verify=(G&&G.verify)||null; return c; })(),
      curtainDown:curtainDown.slice(), seq:G.seq, stuck:stuck,
      cards:G.cards.map(function(c){ return {
        id:c.id, kind:c.kind, fruit:c.fruit, layer:c.layer, x:c.x, y:c.y,
        state:c.state, sp:c.sp, pairId:c.pairId, pairEnd:c.pairEnd,
        rainbow:!!c.rainbow, revealIdx:(c.revealIdx===undefined?-1:c.revealIdx), grp:c.grp,
        iceLeft:c.iceLeft, iceTotal:c.iceTotal, sealed:c.sealed, trayAt:c.trayAt,
        /* 炸弹的开局快照（第 8.2 节「预览与实际同一快照」）：必须一起存档，
           否则读档后炸弹的爆破区会退化成几何范围，预览和实际就对不上了。 */
        zone:(c.kind==='bomb' && c.zone) ? c.zone.slice() : null }; }),
      tray:G.tray.map(function(c){ return c.id; }),
      pairs:G.pairs.map(function(p){ return { id:p.id, a:p.a, b:p.b, order:p.order.slice(), broken:p.broken }; }),
      curtains:G.curtains.map(function(k){ return {
        id:k.id, group:k.group, cardId:k.cardId, state:k.state, pending:k.pending||'' }; })
    }));
  }catch(e){}
}
function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem('juguo_state_v3')||'null');
    if(!s || s.v!==6) return null;      /* v0.9 第二轮改了炸弹快照与胜负判定，旧存档不再沿用 */
    if(!s.cards || !s.cards.length) return null;
    if(!s.cfg || SPECIAL_ENUM.indexOf(s.cfg.special)<0) return null;
    if(!SHAPES[s.cfg.shape]) return null;
    if(!s.cfg.seq || s.cfg.seq.length!==s.cfg.layers) return null;
    return s;
  }catch(e){ return null; }
}
function clearSavedState(){
  try{ localStorage.removeItem('juguo_state_v3'); }catch(e){}
}
/* 恢复失败一律提示重试，不静默修改局面（第 5.3 节） */
function applyState(s){
  try{
    level=clamp(Math.floor(s.level||1),1,MAX_LV);
    cfg=JSON.parse(JSON.stringify(s.cfg));
    if(!cfg.sp) return false;
    var ids={}, cards=[], i;
    for(i=0;i<s.cards.length;i++){
      var c=s.cards[i];
      if(!c || typeof c.id!=='number' || ids[c.id]) return false;
      if(c.kind!=='fruit' && c.kind!=='bomb') return false;
      if(c.kind==='fruit' && !(c.fruit>=0 && c.fruit<FRUIT_N)) return false;
      if(typeof c.x!=='number' || typeof c.y!=='number' || typeof c.layer!=='number') return false;
      ids[c.id]=1;
      c.el=null; c.locked=false;
      /* 彩虹覆盖层状态随存档恢复（第 9.4 节） */
      c.rainbow=(c.kind==='fruit') ? !!c.rainbow : false;
      c.revealIdx=(typeof c.revealIdx==='number') ? c.revealIdx : -1;
      c.grp=(typeof c.grp==='number') ? c.grp : c.fruit;
      /* 炸弹的开局快照随存档恢复（第 8.2 节：预览与实际同一快照） */
      if(c.kind==='bomb'){
        if(!c.zone || !c.zone.length) return false;
        c.zone=c.zone.slice();
      } else c.zone=null;
      cards.push(c);
    }
    var pairs=(s.pairs||[]).map(function(p){
      return { id:p.id, a:p.a, b:p.b, order:(p.order||[]).slice(), broken:!!p.broken };
    });
    var curtains=(s.curtains||[]).map(function(k){
      return { id:k.id, group:k.group, cardId:k.cardId, state:k.state, pending:k.pending||'', el:null };
    });
    G=newCtx(cfg, cards, pairs, curtains);
    G.seq=s.seq||0;
    G.verify=cfg.verify||null;         /* 生成期可解性结论随存档一起恢复 */
    var tray=[];
    (s.tray||[]).forEach(function(id){
      var c=G.byId[id];
      if(c && c.state==='tray') tray.push(c);
    });
    if(G.cards.some(function(c){ return c.state!=='board' && c.state!=='tray' && c.state!=='gone'; })) return false;
    G.tray=tray;
    unitsX=s.unitsX||7; unitsY=s.unitsY||7;
    rngState=s.rngState||88675123;
    curtainDown=(s.curtainDown && s.curtainDown.length===2) ? s.curtainDown.slice() : [true,false];
    stuck=!!s.stuck;
    endGuard=false; winGuard=false; finalLock=false; finalCommitted=false; finalDone=null;
    busy=false; paused=false; teachUntil=0;
    renderBoard(); computeLocked(G); repaintBoard();
    setPhase(stuck?'stuck':'play');
    renderTray(-1); renderCurtains(); layout(); scheduleLayout(); updateHUD();
    return true;
  }catch(e){ return false; }
}

   15. 关卡构建
   ============================================================ */
/* 首次遇到某类玩法的提示（v0.9：固定循环从第 1 关开始，所以提示落在前 7 关） */
var FIRST_TEACH = {
  1:'同果锁：单张牌被锁扣锁住，货栏里先有一张同类水果，才取得动这一张',
  2:'双果链：两张不同水果被链条连着，必须同一层、紧挨着；两端都露出来且货栏空两格才能整对取走',
  3:'遮帘：水果图案被布帘盖住，点它照样能取；目标被取走后遮帘换一张牌，棋盘剩 12 张以内它会永久消失',
  4:'炸弹：点一下先看爆破范围和会清掉的牌，再点一次确认引爆；清掉的是范围内所有已露出的水果',
  5:'彩虹：彩虹盖住了一张水果，被盖住的取不动；用别的水果做成一次三消，彩虹层才会揭开',
  6:'冰冻：冰牌敲不动；让旁边同层的水果做成一次三消，冰层才会化',
  7:'封蜡：牌入货栏后先封着、不参与凑三，做一次三消就解开最早入栏的那张'
};
function buildLevel(lv){
  clearLater();
  level=clamp(Math.floor(lv),1,MAX_LV);
  endGuard=false; winGuard=false; stuck=false; finalLock=false; finalCommitted=false; finalDone=null;
  busy=false; paused=false;
  var ok=false;
  try{
    cfg=planFor(level);
    cfg.__seed=((level*7919)>>>0);
    var built=buildVerified(cfg);
    cfg=built.cfg;
    unitsX=built.unitsX; unitsY=built.unitsY;
    G=newCtx(cfg, built.cards, built.pairs, built.curtains);
    G.verify=built.verify;
    rngState=((cfg.__seed ^ 0x5bd1e995)>>>0) || 88675123;
    curtainDown=[true,false];
    ok=true;
  }catch(err){
    if(window.console && console.error) console.error('关卡生成失败 lv='+level, err);
  }
  if(!ok){
    try{
      level=1;
      cfg=planFor(1);
      cfg.__seed=7919;
      var b2=buildVerified(cfg);
      cfg=b2.cfg; unitsX=b2.unitsX; unitsY=b2.unitsY;
      G=newCtx(cfg, b2.cards, b2.pairs, b2.curtains);
      rngState=((cfg.__seed ^ 0x5bd1e995)>>>0) || 88675123;
      toast('第 '+lv+' 关生成异常，已回到第 1 关');
    }catch(err2){
      setPhase('play'); updateHUD();
      toast('关卡生成异常，请刷新页面');
      return;
    }
  }
  tools.shuffle.free=Math.min(4, 2+Math.floor(level/70));
  tools.undo.free   =Math.min(6, 3+Math.floor(level/50));
  tools.scissor.free=Math.min(3, 1+Math.floor(level/90));
  G.seq=0;
  renderBoard();
  computeLocked(G);
  repaintBoard();
  setPhase('play');
  renderTray(-1);
  renderCurtains();
  layout(); scheduleLayout();
  updateHUD();
  save(); saveState();
  if(cfg.special==='curtain' && level===3){
    /* 首次遮帘教学：开始前展示全部水果 2 秒，展示阶段不接受取牌（6.5 / Q13） */
    curtainDown=[false,false];
    teachUntil=Date.now()+2000;
    renderCurtains();
    toast('先看清水果 2 秒，遮帘马上落下');
    later(function(){
      curtainDown=[true,false];
      teachUntil=0;
      renderCurtains();
      toast('遮帘分两组：下拉的盖住水果，收起的露出水果；每次三消交换一次');
    }, 2000);
  } else {
    teachUntil=0;
    if(FIRST_TEACH[level]) later(function(){ toast(FIRST_TEACH[level]); }, 520);
  }
}

/* ============================================================
   16. 弹窗 / 选关 / 帮助
   ============================================================ */
function openModal(title, noteHtml, btns){
  modalEl.innerHTML='<h3>'+title+'</h3>'+noteHtml+'<div class="mbtns"></div>';
  var box=modalEl.querySelector('.mbtns');
  (btns||[]).forEach(function(b){
    var el=document.createElement('button');
    el.className='btn '+(b.c||'main');
    el.textContent=b.t;
    if(b.fn) el.addEventListener('click', b.fn);
    else el.disabled=true;
    box.appendChild(el);
  });
  maskEl.classList.add('on');
}
function closeModal(){ maskEl.classList.remove('on'); modalEl.innerHTML=''; }
var LV_PAGE=10, lvShown=LV_PAGE;
function unlockCost(n){ var d=n-unlocked; return d<=0?0:60*d; }
function closestBy(el, cls){
  while(el && el!==document){
    if(el.classList && el.classList.contains(cls)) return el;
    el=el.parentNode;
  }
  return null;
}
function showLevelPicker(){
  lvShown=Math.min(LV_PAGE, Math.max(1, unlocked));
  openModal('选择关卡',
    '<div class="lvbox">'
    + '<div class="lvsec"><span>已解锁</span><span>已通关 '+best+' 关</span></div>'
    + '<div class="lvgrid" id="lvOpen"></div>'
    + '<button class="lvmore" id="lvMore" type="button"></button>'
    + '<div class="lvsec"><span>未解锁</span><span>可花水果币提前开</span></div>'
    + '<div class="lvgrid" id="lvLock"></div>'
    + '</div>',
    [{ t:'继续本关', c:'ghost', fn:closeModal }]);
  paintPicker();
  var more=$('#lvMore');
  if(more) more.addEventListener('click', function(){
    if(lvShown>=unlocked){ toast('已经翻到最早一关了'); return; }
    lvShown=Math.min(unlocked, lvShown+LV_PAGE);
    paintPicker();
  });
  bindPick($('#lvOpen'), onPickOpen);
  bindPick($('#lvLock'), onPickLocked);
}
function bindPick(box, fn){
  if(!box) return;
  box.addEventListener('click', function(e){
    var cell=closestBy(e.target, 'lvcell');
    if(cell){
      var n=parseInt(cell.getAttribute('data-lv'),10);
      if(n>0) fn(n);
    }
  });
}
function paintPicker(){
  var gOpen=$('#lvOpen'), gLock=$('#lvLock'), more=$('#lvMore'), n, m, h, h2;
  if(gOpen){
    h='';
    var from=Math.max(1, unlocked-lvShown+1);
    for(n=unlocked; n>=from; n--){
      h += '<button type="button" class="lvcell '+((n<=best)?'done':'cur')+'" data-lv="'+n+'">'+n
        + (n===level ? '<span class="tag">在玩</span>' : '') + '</button>';
    }
    gOpen.innerHTML=h;
  }
  if(gLock){
    h2='';
    var to=Math.min(MAX_LV, unlocked+LV_PAGE);
    for(m=unlocked+1; m<=to; m++) h2 += '<button type="button" class="lvcell shut" data-lv="'+m+'">'+m+'<span class="lk"> 锁</span></button>';
    gLock.innerHTML=h2 || '<div class="lvnothing">已经是最后一关了</div>';
  }
  if(more) more.textContent=(lvShown>=unlocked)?'已经翻到最早一关了':'查看更多已通关的关卡';
}
function onPickOpen(n){
  if(n>best){ closeModal(); buildLevel(n); save(); return; }
  openModal('重玩第 '+n+' 关',
    '<div class="mnote">第 '+n+' 关你已经通关过了。<br>重玩不会清空进度，通关照样发水果币。</div>',
    [{ t:'确定，重玩第 '+n+' 关', c:'main', fn:function(){ closeModal(); buildLevel(n); save(); } },
     { t:'返回选关', c:'ghost', fn:showLevelPicker }]);
}
function onPickLocked(n){
  var gap=Math.max(1, n-unlocked), cost=unlockCost(n), btns=[];
  if(coins>=cost){
    btns.push({ t:'花 '+cost+' 水果币解锁第 '+n+' 关', c:'coin', fn:function(){
      coins-=cost; unlocked=Math.max(unlocked,n); save(); updateHUD();
      closeModal(); buildLevel(n); toast('第 '+n+' 关已解锁');
    }});
  } else btns.push({ t:'水果币不够（需 '+cost+'，现有 '+coins+'）', c:'ghost', fn:null });
  btns.push({ t:'返回选关', c:'ghost', fn:showLevelPicker });
  openModal('第 '+n+' 关还没解锁',
    '<div class="mnote">先通关 <b>第 '+unlocked+' 关</b>，这一关才会免费开出来。<br>也可以花 <b>'+cost+'</b> 水果币提前解锁 —— 从这里往后跨 '+gap+' 关。</div>',
    btns);
}

function bindTools(){
  $('#btnShuffle').addEventListener('click', useShuffle);
  $('#btnUndo').addEventListener('click', useUndo);
  $('#btnScissor').addEventListener('click', useScissor);
  $('#btnHelp').addEventListener('click', showHelp);
  var pill=$('#pillLv');
  if(pill) pill.addEventListener('click', showLevelPicker);
  /* 炸弹确认条（第 8.2 节）：确认才引爆，取消不消耗炸弹 */
  var bok=$('#boomOk'), bno=$('#boomNo');
  if(bok) bok.addEventListener('click', function(e){ e.stopPropagation(); if(armedBomb) detonateBomb(armedBomb); });
  if(bno) bno.addEventListener('click', function(e){ e.stopPropagation(); disarmBomb(false); });
  document.addEventListener('click', function(e){
    if(!armedBomb) return;
    var t=e.target;
    if(t===bok || t===bno) return;
    if(t && t.closest && (t.closest('#boomBar') || t.closest('.sp-bomb'))) return;
    disarmBomb(false);                       /* 点别处 = 取消，炸弹没有消耗 */
  });
  maskEl.addEventListener('click', function(e){
    if(e.target===maskEl && document.body.dataset.phase==='play') closeModal();
  });
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ paused=true; }
    else {
      paused=false;
      /* 切后台回来：把可能被节流的动画补完，保证状态一致（S01 / F10） */
      if(finalLock && finalDone) finalDone();
      if(busy && busyAt && Date.now()-busyAt>3000){ busy=false; }
      layout();
    }
  });
}
function blockDoubleTap(){
  var last=0, lx=0, ly=0;
  document.addEventListener('touchend', function(e){
    var t=e.changedTouches && e.changedTouches[0];
    var x=t?t.clientX:0, y=t?t.clientY:0, now=Date.now();
    if(now-last<300 && Math.abs(x-lx)<12 && Math.abs(y-ly)<12) e.preventDefault();
    last=now; lx=x; ly=y;
  }, { passive:false });
}

  if(relayout) clearTimeout(relayout);
  relayout=setTimeout(function(){ layout(); }, 90);

function watchResize(){

  }

/* 看门狗：真机上最难查的就是「有牌但牌没尺寸」「动画回调丢了」这类静默失效 */
function watchdog(){
  if(busy && busyAt && Date.now()-busyAt>2500 && !finalLock){ busy=false; clearFlies(); renderTray(-1); }
  if(finalLock && finalDone && Date.now()-(busyAt||0)>4000){ finalDone(); }
  if(!running) return;
  G=G||null; if(!G) return;
  var live=boardCards(G);
  if(!live.length) return;
  var ok=live.some(function(c){ return c.el && c.el.getBoundingClientRect().width>1; });
  if(!ok) layout();
}

    step:function(){

        if(c.kind==='bomb') continue;

      }
      /* ⑤ 任意合法单张 */
      for(i=0;i<live.length;i++){
        var s=live[i];
        if(s.locked || isPairLinked(s)) continue;

      }

    },
    /* 与 step 相同，但跳过 avoid 列表里的牌（验收脚本用来保留某些牌做专项测试） */

      }

        var s=live[i];

    /* ---- v0.10 第 5 项：解封后立刻重查三消的确定性场景（验收专用）----
       规则：一次有效三消事件 → 解开最早入栏的一张封蜡 → 立刻重查三消。

    waxDemo:function(){
      if(!G) return { ok:false, why:'no-game' };
      if(document.body.dataset.phase!=='play') return { ok:false, why:'phase='+document.body.dataset.phase };
      if(TRAY_N<6) return { ok:false, why:'tray-too-small' };
      var live=boardCards(G), i, j;
      var plain=live.filter(function(c){ return c.kind==='fruit' && c.sp==='' && !c.rainbow; });
      var byF={};
      plain.forEach(function(c){ (byF[c.fruit]=byF[c.fruit]||[]).push(c); });
      var fruits=Object.keys(byF).map(Number)
                 .sort(function(a,b){ return byF[b].length-byF[a].length; });
      var fa=null, fb=null;
      for(i=0;i<fruits.length && fa===null;i++){
        for(j=i+1;j<fruits.length;j++){
          var x=fruits[i], y=fruits[j];
          if(byF[x].length>=2 && byF[y].length>=3){ fa=x; fb=y; break; }
          if(byF[y].length>=2 && byF[x].length>=3){ fa=y; fb=x; break; }
        }
      }
      if(fa===null) return { ok:false, why:'需两个水果分别凑够2张/3张，当前盘面凑不出' };
      var wax=live.filter(function(c){ return c.sp==='wax'; })[0] || null;
      var madeWax=false;
      var poolA=byF[fa].slice(), poolB=byF[fb].slice();
      var a1=poolA.shift(), a2=poolA.shift();
      var pickB=null;
      for(i=0;i<poolB.length;i++){ if(!poolB[i].locked){ pickB=poolB[i]; break; } }
      if(!pickB) pickB=poolB[0];
      poolB=poolB.filter(function(c){ return c!==pickB; });
      var b1=poolB.shift(), b2=poolB.shift();
      if(!wax){
        var rest=plain.filter(function(c){
          return c!==a1 && c!==a2 && c!==pickB && c!==b1 && c!==b2; });
        if(!rest.length) return { ok:false, why:'没有可改造成封蜡的牌' };
        wax=rest[rest.length-1]; madeWax=true;
      }
      /* ---- 摆局：先清空货栏，再按 A,A,封(A),B,B 的顺序入栏 ---- */
      G.tray.forEach(function(c){ c.state='gone'; });
      G.tray=[];
      var put=function(c, fruit, sealed){
        c.state='tray'; c.trayAt=(++G.seq); c.fruit=fruit;
        c.sp=''; c.sealed=!!sealed; c.locked=false;
        G.tray.push(c); return c;
      };
      put(a1, fa, false); put(a2, fa, false);
      wax.sp='wax'; put(wax, fa, true);            /* 入栏即封，不参与凑三 */
      put(b1, fb, false); put(b2, fb, false);
      /* 盘面留一张可取的 B（场景构造允许强行解锁，只为保证这一步点得动） */
      pickB.locked=false;
      computeLocked(G);
      pickB.locked=false;
      repaintBoard(); renderTray(-1); renderCurtains(); renderLinks(); updateHUD(); layout();
      return { ok:true, 水果A:fa, 水果B:fb, 蜡牌id:wax.id, 蜡牌来源:(madeWax?'改造':'现成'),
               待取的B:pickB.id, 待取的B可取:(pickB.state==='board' && !pickB.locked),
               货栏:G.tray.map(function(c){ return { id:c.id, fruit:c.fruit, sealed:!!c.sealed, sp:c.sp }; }) };
    },
    /* ---- v0.10 第 6 项：最后三张自动收尾的确定性场景（验收专用）----
       旧版用白名单排除「sp==='' && pairId<0」的普通牌，导致同果锁关、双果链关
       的自动收尾永远不会触发。这里直接摆出「盘面只剩 3 张普通同水果牌」——
       正是旧版排除的那一类 —— 用来确认新版真的会收尾、播动效、并顺利通关。
       只摆局不触发，脚本检查完诊断后调 finalKick() 主动开工，便于采样动效。 */
    finalDemo:function(fruit){
      if(!G) return { ok:false, why:'no-game' };
      if(document.body.dataset.phase!=='play') return { ok:false, why:'phase='+document.body.dataset.phase };
      var live=boardCards(G).filter(function(c){ return c.kind==='fruit'; });
      if(live.length<3) return { ok:false, why:'board-fruit<3' };
      var order=live.slice().sort(function(a,b){
        var pa=(a.sp==='' && a.pairId<0)?0:1, pb=(b.sp==='' && b.pairId<0)?0:1;
        return pa-pb || (b.layer-a.layer);
      });
      var keep=[order[0], order[1], order[2]];
      var f=(fruit===undefined||fruit===null) ? keep[0].fruit : fruit;
      boardCards(G).forEach(function(c){ if(keep.indexOf(c)<0) c.state='gone'; });   /* 炸弹也一并退场 */
      for(var i=0;i<3;i++){
        var c=keep[i];
        c.state='board'; c.x=i; c.y=0; c.layer=0;               /* 同排同层，互不遮挡 */
        c.sp=''; c.pairId=-1; c.pairEnd=0; c.locked=false;
        c.iceLeft=0; c.iceTotal=0; c.rainbow=false; c.sealed=false;
        c.fruit=f;
      }
      G.tray.forEach(function(t){ t.state='gone'; });
      G.tray=[];
      computeLocked(G);
      repaintBoard(); renderTray(-1); renderCurtains(); renderLinks(); updateHUD(); layout();
      var after=boardCards(G).filter(function(c){ return c.kind==='fruit'; });
      return { ok:true, 保留:keep.map(function(c){ return c.id; }), 水果:f,
               盘面水果数:after.length,
               全部未锁:after.every(function(c){ return !c.locked; }),
               诊断:finalThreeWhy() };
    },
    /* 摆好局之后主动触发一次自动收尾判定（正常由结算流程调用） */
    finalKick:function(){ return checkFinalAuto(); },
    /* ---- v0.10 第 1 项：遮帘动画状态 ---- */
    /* 只翻转「下拉／收起」这一个视觉状态、不改变任何牌局数据，用于验收滑动动画本身 */
    curtainFlip:function(){
      curtainDown=curtainDown.map(function(v){ return !v; });
      renderCurtains();
      return curtainDown.slice();
    },
    curtainState:function(){
      return G.curtains.map(function(k){
        var el=k.el, cloth=el?el.querySelector('.cloth'):null;
        var cs=cloth && window.getComputedStyle ? window.getComputedStyle(cloth) : null;
        return { id:k.id, group:k.group, state:k.state, cardId:k.cardId,
                 display:el?el.style.display:'',
                 card:(el?el.dataset.card:null)||null,
                 cls:el?el.className:'',
                 clothTransform:(cs && cs.transform) || '',
                 clothTransition:(cs && cs.transitionDuration) || '' };
      });
    },
    /* ---- v0.10 第 3 项：文案提示停留时长 ---- */
    toastState:function(){
      var t=$('#toast');
      return { on:!!(t && t.classList.contains('on')), text:(t?t.textContent:''),
               leftMs:toastLeftMs(), configuredMs:TOAST_MS };
    },
    /* ---- v0.10 第 4 项：封蜡融化动效 ---- */
    waxState:function(){
      return { meltCount:waxMeltCount,
               shells:document.querySelectorAll('.waxshell').length,
               drops:document.querySelectorAll('.waxdrop').length,
               traySealed:G.tray.filter(function(c){ return c.sealed; }).map(function(c){
                 return { id:c.id, fruit:c.fruit }; }) };
    },
    /* ---- v0.11 第 1 项：死局自愈 ---- */
    legalMoveCount:function(){ return simLegalMoveCount(G); },
    lockCards:function(){
      return boardCards(G).filter(function(c){ return c.sp==='lock'; }).map(function(c){
        return { id:c.id, fruit:c.fruit, layer:c.layer, x:c.x, y:c.y, locked:!!c.locked };
      });
    },
    unlockPlan:function(){ return simUnlockPlan(G); },
    unlockNow:function(){ return autoUnlockRescue(); },
    unlockLog:function(){ return { count:autoUnlockCount, log:autoUnlockLog.slice(-5) }; },
    /* 复刻「一步都走不动」的死局（就是玩家截图那一局）：
       盘面只留 5 张同果锁牌 —— 4 张同坐标叠成塔（只有塔顶露头）+ 1 张孤立在右边；
       货栏塞 2 梨 + 2 葡萄，与盘面 5 种水果完全不重叠
       → 每张锁牌都缺同类、塔底 3 张又被压住，全盘零合法操作。 */
    deadlockDemo:function(){
      if(!G) return { ok:false, why:'no-game' };
      if(document.body.dataset.phase!=='play') return { ok:false, why:'phase='+document.body.dataset.phase };
      var live=boardCards(G).filter(function(c){ return c.kind==='fruit'; });
      if(live.length<5) return { ok:false, why:'board-fruit<5' };
      var keep=live.slice(0,5);
      boardCards(G).forEach(function(c){ if(keep.indexOf(c)<0) c.state='gone'; });
      var tower=[keep[0],keep[1],keep[2],keep[3]], solo=keep[4];
      var tf=[0,3,4,5];
      tower.forEach(function(c,i){
        c.state='board'; c.x=0; c.y=0; c.layer=i;
        c.sp='lock'; c.pairId=-1; c.pairEnd=0; c.rainbow=false;
        c.iceLeft=0; c.iceTotal=0; c.sealed=false; c.fruit=tf[i];
      });
      solo.state='board'; solo.x=3; solo.y=0; solo.layer=0;
      solo.sp='lock'; solo.pairId=-1; solo.pairEnd=0; solo.rainbow=false;
      solo.iceLeft=0; solo.iceTotal=0; solo.sealed=false; solo.fruit=6;
      var free=[], i;
      for(i=0;i<G.cards.length;i++){
        var c=G.cards[i];
        if(keep.indexOf(c)>=0) continue;
        if(c.state==='tray'){ c.state='gone'; continue; }
        if(free.length<4 && c.kind==='fruit') free.push(c);
      }
      G.tray=[];
      free.forEach(function(c,i2){
        c.state='tray'; c.trayAt=++G.seq; c.fruit=(i2<2?1:2);
        c.sp=''; c.sealed=false; c.pairId=-1; c.rainbow=false; c.iceLeft=0;
        G.tray.push(c);
      });
      computeLocked(G);
      repaintBoard(); renderTray(-1); renderCurtains(); renderLinks(); updateHUD(); layout();
      return { ok:true, 盘面张数:boardCards(G).length,
               锁牌数:boardCards(G).filter(function(c){ return c.sp==='lock'; }).length,
               货栏水果:G.tray.map(function(c){ return c.fruit; }),
               合法操作:simLegalMoveCount(G), 塔顶id:tower[3].id, 孤立id:solo.id };
    },
    /* 只跑一次收尾判定（正常由结算流程自动调用）——验收时用来触发死局分支 */
    judgeNow:function(){ endGuard=false; return judgeEnd(); },
    /* ---- v0.11 第 2 项：道具水果币购买 ---- */
    toolInfo:function(){
      var one=function(k){
        return { free:tools[k].free, stock:tools[k].stock, total:toolTotal(k),
                 payable:toolPayable(k), price:TOOL_PRICE[k],
                 badge:($('#c'+k.charAt(0).toUpperCase()+k.slice(1))||{}).textContent,
                 badgeCls:($('#c'+k.charAt(0).toUpperCase()+k.slice(1))||{}).className };
      };
      return { coins:coins, price:TOOL_PRICE, name:TOOL_NAME,
               shuffle:one('shuffle'), undo:one('undo'), scissor:one('scissor'),
               btnDisabled:{ shuffle:$('#btnShuffle').disabled, undo:$('#btnUndo').disabled,
                             scissor:$('#btnScissor').disabled } };
    },
    /* 验收用：把某道具的免费次数与库存清零，模拟「都用完了」 */
    toolDrain:function(k){
      if(!tools[k]) return { ok:false, why:'bad-key' };
      tools[k].free=0; tools[k].stock=0; updateHUD();
      return { ok:true, key:k };
    },
    coinSet:function(n){ coins=Math.max(0, Math.floor(n||0)); updateHUD(); return coins; },
    /* 剪刀此刻会选哪三张（只读，用于验收时判断是否与冰牌同层相邻） */
    scissorPick:function(){
      var cs=scissorCombos();
      if(!cs.length) return null;
      return { count:cs.length, pick:cs[0].cards.map(function(x){
        return { id:x.id, kind:x.kind, sp:x.sp, layer:x.layer, x:x.x, y:x.y, state:x.state };
      }) };
    },
    /* 用真实规则在当前盘面上求一条完整通关路径（只读，不改动真实对局）。
       返回 { ok, moves:[{t,id}...] }，供验收脚本用真实点击重放。 */
    solve:function(){
      var ctx=simClone(G), moves=[], guard=0;
      while(guard++<4000){
        var m=findMatch(ctx);
        if(m){
          var trio=matchCards(ctx,m);
          trio.forEach(function(c){ c.state='gone'; });
          ctx.tray=ctx.tray.filter(function(c){ return trio.indexOf(c)<0; });
          applyEliminateEvent(ctx,trio,ctx.freeSnap);
          continue;
        }
        var live=boardCards(ctx);
        if(!live.length && !ctx.tray.length) return { ok:true, moves:moves };
        ctx.freeSnap=freeSnapOf(ctx);
        var mv=simMoves(ctx);
        if(!mv.length) return { ok:false, why:'no-move', moves:moves };
        mv.sort(function(a,b){ return b.score-a.score; });
        var cands=mv, free=TRAY_N-ctx.tray.length;
        if(free<=2){
          cands=mv.filter(function(x){
            if(x.t==='take') return simCompletes(ctx,x.c);
            if(x.t==='pair') return free>=2;
            return false;
          });
          if(!cands.length) return { ok:false, why:'tray-full', moves:moves };
        }
        var pick=cands[0], outId=-1;
        if(pick.t==='take'){
          var c1=pick.c; c1.state='tray'; c1.trayAt=(++ctx.seq);
          if(c1.sp==='wax') c1.sealed=true;
          ctx.tray.push(c1); outId=c1.id;
        } else if(pick.t==='pair'){
          var p=pairOf(ctx,pick.c), a=ctx.byId[p.a], b=ctx.byId[p.b];
          a.state='tray'; a.trayAt=(++ctx.seq);
          b.state='tray'; b.trayAt=(++ctx.seq);
          ctx.tray.push(a); ctx.tray.push(b); p.broken=true;
          outId=a.id;
        } else if(pick.t==='chip'){
          var c2=pick.c; c2.iceLeft--;
          if(c2.iceLeft<=0){ c2.sp=''; c2.iceLeft=0; }
          outId=c2.id;
        } else if(pick.t==='boom'){
          var plan=bombPlan(ctx,pick.c);
          plan.bombs.forEach(function(bm){ bm.state='gone'; });
          plan.remove.forEach(function(o){ o.state='gone'; });
          outId=pick.c.id;
        }
        moves.push({ t:pick.t, id:outId });
      }
      return { ok:false, why:'budget', moves:moves };
    },
    /* 真实对局自动打这一关：重复调用 step 直到通关/卡住。
       注意：动画由真实计时器驱动，本函数一次只走一步，返回 latest 状态。 */
    autoFinish:function(maxSteps){
      var steps=0, lim=maxSteps||600, log=[];
      var self=this;
      while(steps++<lim && running && document.body.dataset.phase==='play'){
        var r=self.step();
        if(r.busy || r.phase) break;
        if(!r.act){ log.push('no-move'); break; }
      }
      return { steps:steps, phase:document.body.dataset.phase, busy:busy,
               board:boardCards(G).length, tray:G.tray.length, log:log };
    },
    force:function(o){
      if(!o) return false;
      if(typeof o.coins==='number') coins=Math.max(0,Math.floor(o.coins));
      if(typeof o.streak==='number') streak=Math.max(0,Math.floor(o.streak));
      if(typeof o.best==='number') best=clamp(Math.floor(o.best),0,MAX_LV);
      if(typeof o.unlocked==='number') unlocked=clamp(Math.floor(o.unlocked),1,MAX_LV);
      if(o.tools){
        ['shuffle','undo','scissor'].forEach(function(k){
          if(o.tools[k]){ tools[k].free=o.tools[k].free||0; tools[k].stock=o.tools[k].stock||0; }
        });
      }
      updateHUD(); save();
      return true;
    },
    goto:function(n){ closeModal(); buildLevel(n); },
    clearState:function(){ clearSavedState(); },
    /* 测试用：外部改动水果币后重新渲染失败弹窗，让续关按钮状态重算 */
    refreshLose:function(){ endGuard=false; doLose('full'); },
    closeModal:closeModal
  };
}
function start(){
  load();
  var m=/[?&]lv=(\d+)/.exec(location.search);
  if(m) level=clamp(parseInt(m[1],10)||1, 1, MAX_LV);
  buildSlots();
  bindTools();
  blockDoubleTap();
  watchResize();
  setInterval(watchdog, 1000);
  var s=loadState();
  var restored=false;
  if(s && s.level===level) restored=applyState(s);
  if(!restored){
    if(s) toast('上次的牌局存档无法恢复，已按本关重新开始');
    buildLevel(level);
  }
  scheduleLayout();
  exposeDebug();
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
else start();

})();
</script>
</body>
</html>
