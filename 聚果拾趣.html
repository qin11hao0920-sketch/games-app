function shapeCells(key, gw, gh){
  var sh=SHAPES[key]; if(!sh) return [];
  var cx=(gw-1)/2, cy=(gh-1)/2, out=[];
  for(var y=0;y<gh;y++){
    for(var x=0;x<gw;x++){
      var u = cx>0 ? (x-cx)/cx : 0;
      var v = cy>0 ? (y-cy)/cy : 0;
      if(sh.f(u,v)) out.push({ x:x, y:y });
    }
  }
  return out;
}

/* ============================================================
   3. 关卡计划
   每关只允许一种特殊玩法（第 1.1 节第 2 条）。
   教学顺序（Q04）：基础 → 彩虹 → 同果锁 → 双果链 → 冰冻 → 遮帘 → 炸弹 → 封蜡，
   每类「教学关 → 变体关 → 缓和普通关」；30 关起循环并随进度加量。
   ============================================================ */
var SPECIAL_ENUM = ['none','rainbow','sameFruitLock','pairedChain','ice','curtain','bomb','wax'];
var SPECIAL_NAME = {
  none:'普通', rainbow:'彩虹', sameFruitLock:'同果锁', pairedChain:'双果链',
  ice:'冰冻', curtain:'遮帘', bomb:'炸弹', wax:'封蜡'
};

/* 第 4.3 节首批 20 关布局表（形状 + 层数 + 总牌量）
   v0.9：保留原先的形状方向，取消「按关递增牌量／层数」的曲线——
   20 关总牌量统一落在 60～72（表内区间）；
   第二轮按第 1.2 节第 14 条把平均叠放深度提到 4～5 层（表内区间上限取满），
   难度只由形状、遮挡关系和可解牌序产生（第 1.2 节第 6 条 / 第 4.3 节）。 */
var LAYOUT20 = [
  { shape:'square',    layers:4, total:60 },  /* 1  小型方阵 */
  { shape:'stair',     layers:4, total:60 },  /* 2  阶梯方阵 */
  { shape:'diamond',   layers:4, total:63 },  /* 3  菱形 */
  { shape:'twinLR',    layers:4, total:66 },  /* 4  左右双堆 */
  { shape:'cross',     layers:5, total:60 },  /* 5  十字形 */
  { shape:'twinTB',    layers:5, total:66 },  /* 6  上下双堆 */
  { shape:'ring',      layers:5, total:69 },  /* 7  空心回字形 */
  { shape:'quad',      layers:5, total:66 },  /* 8  四角分岛 */
  { shape:'coreLR',    layers:5, total:72 },  /* 9  中央堆+左右辅助堆 */
  { shape:'pyramid',   layers:5, total:72 },  /* 10 宽阶梯金字塔 */
  { shape:'tripleH',   layers:5, total:66 },  /* 11 横向三堆 */
  { shape:'coreQuad',  layers:5, total:72 },  /* 12 中央堆+四角小堆 */
  { shape:'twinDia',   layers:5, total:66 },  /* 13 双菱形 */
  { shape:'ishape',    layers:5, total:72 },  /* 14 工字形 */
  { shape:'fourPetal', layers:5, total:69 },  /* 15 四瓣组合 */
  { shape:'ringCore',  layers:5, total:72 },  /* 16 环形+中心岛 */
  { shape:'diagTwin',  layers:5, total:66 },  /* 17 对角双主堆 */
  { shape:'stagger',   layers:5, total:72 },  /* 18 错位阶梯带 */
  { shape:'islands',   layers:5, total:69 },  /* 19 多岛深浅组合 */
  { shape:'coreLR',    layers:5, total:72 }   /* 20 综合组合 */
];
/* 21 关起的形状池：按进度 e 逐步引入更窄/更碎的轮廓 */
var POOL_STEPS = [
  { max:0.20, pool:['ellipse','square','ring','stair'] },
  { max:0.40, pool:['ellipse','ring','stair','hourglass','pyramid','heart','square'] },
  { max:0.65, pool:['ring','stair','hourglass','pyramid','heart','diamond','cross','twinLR','twinTB'] },
  { max:1.01, pool:['stair','hourglass','pyramid','heart','diamond','cross','quad','ring','ishape','stagger','islands','fourPetal','diagTwin','coreQuad'] }
];

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rnd = Math.random;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* 把「总牌量」拆成 n 层，每层都是 3 的倍数、严格递减、且和恰好等于总牌量 */
function layerSeqTotal(total, n){
  total = Math.max(6, Math.round(total/3)*3);
  n = Math.max(1, Math.min(n|0, 7));
  for(var nn=n; nn>=1; nn--){
    var w=[], s=0, i;
    for(i=0;i<nn;i++){ w.push(nn-i); s+=w[i]; }
    var arr=[];
    for(i=0;i<nn;i++) arr.push(Math.max(3, Math.round(total*w[i]/s/3)*3));
    var sum=0; for(i=0;i<nn;i++) sum+=arr[i];
    var diff=total-sum, guard=0;
    while(diff!==0 && guard++<400){
      if(diff>0){ arr[0]+=3; diff-=3; }
      else {
        var moved=false;
        for(i=nn-1;i>=0;i--){ if(arr[i]>3){ arr[i]-=3; diff+=3; moved=true; break; } }
        if(!moved) break;
      }
    }
    var ok=true;
    for(i=1;i<nn;i++){ if(arr[i]>=arr[i-1]){ ok=false; break; } }
    if(ok) return arr;
  }
  return [total];
}

/* 找到能装下 maxLayer 张底层牌的网格：容量上限 60%，外形尽量贴近竖屏 */
function gridForLayerMax(key, maxLayer){
  var best=null, fallback=null, gw, gh, a, asp, score, need=maxLayer/0.60;
  for(gw=3; gw<=MAXGW; gw++){
    for(gh=gw; gh<=MAXGH; gh++){
      a=shapeCells(key,gw,gh).length;
      if(a<maxLayer) continue;
      if(!fallback || a<fallback.area) fallback={ gw:gw, gh:gh, area:a, score:1e9 };
      if(a < maxLayer/0.60) continue;              // 密度高于 60% → 太挤
      asp=gh/gw;
      score=Math.abs(a-need) + Math.abs(asp-ASPECT)*8;
      if(!best || score<best.score) best={ gw:gw, gh:gh, area:a, score:score };
    }
  }
  return best || fallback || { gw:5, gh:5, area:25, score:1e9 };
}

/* 从格位里挑 n 个「尽量互相远离」的位置（最大最小间距法） */
function pickSpread(cells, n){
  if(n<=0) return [];
  if(n>=cells.length) return cells.slice();
  var pool=[], picked=[], i, j, c, p, d, bd, best, tmp;
  for(i=0;i<cells.length;i++) pool.push({ x:cells[i].x, y:cells[i].y, used:false });
  for(i=pool.length-1;i>0;i--){ j=Math.floor(rnd()*(i+1)); tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
  pool[0].used=true;
  picked.push(pool[0]);
  while(picked.length<n){
    best=null; bd=-1;
    for(i=0;i<pool.length;i++){
      c=pool[i];
      if(c.used) continue;
      d=1e9;
      for(j=0;j<picked.length;j++){
        p=picked[j];
        d=Math.min(d, Math.max(Math.abs(p.x-c.x), Math.abs(p.y-c.y)));
      }
      d += rnd()*0.6;
      if(d>bd){ bd=d; best=c; }
    }
    if(!best) break;
    best.used=true;
    picked.push(best);
  }
  return picked;
}

/* 本关唯一特殊玩法（第 1.1 节第 2 条：每关最多一种）
   v0.9 固定循环（第 1.2 节第 2 条 / 第 12.1 节）：从第 1 关开始
   同果锁 → 双果链 → 遮帘 → 炸弹 → 彩虹 → 冰冻 → 封蜡 → 同果锁……
   取消前置普通教学关，也不存在没有任何特殊玩法的关卡。
   「锁链」只是同果锁的旧名称，不新增第八种玩法。 */
var SPECIAL_CYCLE = ['sameFruitLock','pairedChain','curtain','bomb','rainbow','ice','wax'];
function specialTypeFor(lv){
  lv = Math.max(1, Math.floor(lv));
  return SPECIAL_CYCLE[(lv-1) % SPECIAL_CYCLE.length];
}

/* 冰冻只有邻消解冻（v0.9 第 10.2 节：删除点击敲冰子模式）。
   iceMode 恒为 neighbor，保留字段是为了存档与规则层沿用同一结构。 */
function iceModeFor(){ return 'neighbor'; }
/* 第几个冰冻关（1,2,3…）——每关统一解冻次数，同关不混用（第 1.2 节第 4 条） */
function iceLevelIndex(lv){
  var n=0;
  for(var k=1;k<=lv;k++){ if(specialTypeFor(k)==='ice') n++; }
  return n;
}
function iceHitsFor(lv){
  var idx=iceLevelIndex(lv);
  return (idx % 2 === 1) ? 1 : 2;      /* 1 次 / 2 次 交替；同一关所有冰冻牌一致 */
}
/* 冰冻关的起始投放密度：需要 2 次邻消的关从 20% 下限起步（冰牌少一些才稳得住可解性），
   1 次的关用 25%。两者都仍在 20%～30% 区间内（第 1.2 节第 3 条）。 */
function iceDensityFor(lv, sp){
  return ((sp && sp.iceHits) > 1) ? DENSITY_LO : DENSITY_MID;
}

/* 各类玩法的投放数量（v0.9 第 1.2 节第 3 条 / 第 12.2 节）
   density：本关总卡片数的比例，取值限定在 20%～30%；
     · 同果锁按「锁定卡片张数」计数
     · 双果链按「牌对」计数（一对 = 2 个端点），至少 2 对
     · 冰冻按「冰冻牌张数」计数
     · 彩虹按「覆盖层张数」计数（第 9 节：覆盖在普通水果上，不进货栏）
   炸弹／遮帘／封蜡不放孤立单只，按总牌量给多个。 */
var DENSITY_LO = 0.20, DENSITY_HI = 0.30, DENSITY_MID = 0.25;
/* 炸弹数量（第 8.5 / 12.2 节）：至少 2 个，但不能覆盖大部分棋盘。
   炸弹占据的是「原本属于一张水果」的格位（见 p3 的 chooseBombs），所以炸弹数必须是 3 的倍数，
   否则普通水果总数就不再是三的倍数、盘面根本消不完。固定 3 个：
   满足「至少 2 个、不得只放 1 个孤立炸弹」，同时 3 张只占 60～72 张里的一小块。 */
function bombCountFor(fruitCards){
  return 3;
}
function specialPlanFor(lv, type, fruitCards, layerMax, density){
  var d = (typeof density==='number') ? density : DENSITY_MID;
  if(d < DENSITY_LO) d = DENSITY_LO;
  if(d > DENSITY_HI) d = DENSITY_HI;
  var p = { type:type, n:0, iceMode:'neighbor', iceHits:1, groups:2, perGroup:2, radius:BOMB_RADIUS };
  switch(type){
    /* 20% 下限必须真的达到：按 round 取整时 72 张 × 0.20 = 14.4 会掉到 19.4%，
       所以这三类一律用 ceil，保证「不足下限时增加对象」。 */
    case 'sameFruitLock': p.n = Math.max(2, Math.ceil(fruitCards*d));     break;
    case 'pairedChain':   p.n = Math.max(2, Math.ceil(fruitCards*d/2));   break;   /* 牌对 */
    case 'ice':           p.n = Math.max(2, Math.ceil(fruitCards*d));     break;
    case 'curtain':       p.groups = 2; p.perGroup = 2;                    break;   /* 两组各 2 块 */
    case 'bomb':          p.n = bombCountFor(fruitCards);                  break;   /* ≥2，额外卡 */
    case 'rainbow':       p.n = Math.max(2, Math.ceil(fruitCards*d/3));    break;   /* ≥2，覆盖层 */
    case 'wax':           p.n = 3;                                        break;   /* ≥2 */
  }
  if(type==='ice'){ p.iceMode = iceModeFor(lv); p.iceHits = iceHitsFor(lv); }
  if(p.n!==undefined) p.n = Math.min(p.n, Math.max(0, fruitCards));
  return p;
}

/* ---- 炸弹关的专用布局「炸弹垫」（v0.9 第二轮）----
   炸弹要炸得干净，前提是它周围方形半径 1（含斜角）内、开局就已经暴露的普通水果
   张数恰好能凑成整三张（第 8.5 节：不能留下凑不成三的残牌）。
   但普通布局的上层牌收缩得太快：开局无遮挡的牌只有十几张，而且彼此孤立
   （实测半径 1 内的无遮挡邻居最多 2 个），根本凑不出 ≥3 的爆破区。
   所以炸弹关固定用「4 层 + 最上层 12 张」：
     · 最上层 12 张排成 3 个互不相邻的 2×2 小块（每块 4 张连成一片）；
     · 每个炸弹占一块的一角，同块另外 3 张就是它的爆破区 —— 全是开局无遮挡、
       同层相邻、恰好整三张的普通水果；
     · 3 块的爆破区两两不重叠，3 个炸弹也互不在对方的爆破区里（不会误连锁）。
   层数 4、总牌量 66～72 仍落在第 1.2 节第 3 条的区间内；最上层 12 张占比不高，
   棋盘看起来仍是「上小下大」的正常堆叠。 */
var BOMB_PAD_TOP = 12;                       /* 最上层（炸弹垫）张数 */
var BOMB_PAD_SHAPES = ['square','ellipse','heart','pyramid','stair'];
function bombLayoutFor(total){
  var t = Math.round(total/3)*3;
  if(t>72) t=72;
  if(t<66) t=66;                             /* 12 张最上层 + 三层严格递减的下限是 66 */
  return { total:t, layers:4, seq:[t-45, 18, 15, BOMB_PAD_TOP] };
}
function planFor(lv, density){
  lv = clamp(Math.floor(lv), 1, MAX_LV);
  /* 在这里播种，planFor(137) 成为关卡的纯函数，可批量复现体检 */
  rnd = mulberry32((lv*2654435761) >>> 0);
  var layout, shape, layers, total;
  if(lv<=LAYOUT20.length){
    layout = LAYOUT20[lv-1];
    shape = layout.shape; layers = layout.layers; total = layout.total;
  } else {
    /* 21 关起：形状换、总牌量与层数仍留在同一档（60～72 / 4～5 层） */
    var pool = POOL_STEPS[POOL_STEPS.length-1].pool;
    shape = pool[Math.floor(rnd()*pool.length)] || 'square';
    layers = 4 + (rnd()<0.5 ? 0 : 1);
    total = [60,63,66,69,72][Math.floor(rnd()*5) % 5];
  }
  /* 炸弹关一律走「炸弹垫」布局：换成一整块的形状 + 4 层 + 最上层 12 张 */
  var isBomb=(specialTypeFor(lv)==='bomb');
  if(isBomb){
    var bl=bombLayoutFor(total);
    total=bl.total; layers=bl.layers;
    shape=BOMB_PAD_SHAPES[Math.floor(rnd()*BOMB_PAD_SHAPES.length)] || 'square';
  }
  var seq = isBomb ? bombLayoutFor(total).seq : layerSeqTotal(total, layers);
  var g = gridForLayerMax(shape, seq[0]);
  var area = shapeCells(shape, g.gw, g.gh).length;
  /* 普通水果种类数不随关号递增（第 1.2 节第 6 条：20 关种类数保持相近）；
     第二轮按第 1.2 节第 14 条提高到 7～9 种（取中段 8 种）以抬高基础难度。 */
  var types = clamp(TARGET_TYPES, 4, FRUIT_N);
  var type = specialTypeFor(lv);
  var plan = {
    ver: 4, lv: lv, shape: shape, shapeName:(SHAPES[shape]||{}).n || '方正',
    gw: g.gw, gh: g.gh, area: area, layers: layers, total: total,
    seq: seq, types: types, special: type,
    autoFinish: true, finalSpinTurns: 1
  };
  plan.sp = specialPlanFor(lv, type, total, seq[0], density);
  return plan;
}


/* ============================================================
   4. 规则层
   同一套函数同时用于「真实对局」和「生成期可解性验证」，
   保证验证结论与实际玩法一致（第 5.1 节第 5 条 / 第 19.2 节第 7 条）。
   ctx = { cards, byId, tray, pairs, curtains, cfg, seq }
   ============================================================ */
function newCtx(cfg, cards, pairs, curtains){
  var byId={};
  for(var i=0;i<cards.length;i++) byId[cards[i].id]=cards[i];
  return { cards:cards, byId:byId, tray:[], pairs:pairs||[], curtains:curtains||[], cfg:cfg, seq:0, freeSnap:null,
           /* v0.10 第 4/5 项：本次结算里真实解封的封蜡牌，供渲染层补播融化动效。
              只有真实对局的 ctx 带这个数组；模拟用的副本（simClone）不带，
              所以模拟过程不会污染真实对局的解封记录。 */
           __meltLog:[] };
}
function boardCards(ctx){ return ctx.cards.filter(function(c){ return c.state==='board'; }); }
function pairOf(ctx,c){ return (c && c.pairId>=0) ? ctx.pairs[c.pairId] : null; }
function isChainLocked(ctx,c){
  var p=pairOf(ctx,c);
  return !!(p && !p.broken);
}
/* 物理遮挡：只看卡片主体，高层正面积重叠即压住（第 3.2 节） */
function computeLocked(ctx){
  var live=boardCards(ctx), i, j, a, b;
  for(i=0;i<live.length;i++){
    a=live[i]; a.locked=false;
  }
  for(i=0;i<live.length;i++){
    a=live[i];
    for(j=0;j<live.length;j++){
      b=live[j];
      if(b.layer>a.layer && Math.abs(b.x-a.x)<CARD && Math.abs(b.y-a.y)<CARD){ a.locked=true; break; }
    }
  }
}
function pressureOf(ctx,c){
  var n=0;
  ctx.cards.forEach(function(b){
    if(b.state==='board' && b.layer<c.layer &&
       Math.abs(b.x-c.x)<CARD && Math.abs(b.y-c.y)<CARD) n++;
  });
  return n;
}
function freeSnapOf(ctx){
  computeLocked(ctx);
  var o={};
  ctx.cards.forEach(function(c){ if(c.state==='board' && !c.locked) o[c.id]=true; });
  return o;
}
/* 货栏里「真正算数」的同类张数：未解封的封蜡不算，彩虹/炸弹不是同类 */
function activeTrayCount(ctx,fruit){
  var n=0;
  ctx.tray.forEach(function(c){ if(!c.sealed && c.kind==='fruit' && c.fruit===fruit) n++; });
  return n;
}
/* 单张取牌的合法性 */
function canTakeSingle(ctx,c){
  if(!c || c.state!=='board') return {ok:false, why:'gone'};
  if(c.kind==='bomb')        return {ok:false, why:'bomb'};
  if(c.locked)               return {ok:false, why:'covered'};
  /* 彩虹覆盖层（第 9.2 节）：被彩虹盖住的原水果不能直接取走，
     要先由其他水果完成一次完整三消把覆盖层揭掉。 */
  if(c.rainbow)              return {ok:false, why:'rainbow'};
  if(isChainLocked(ctx,c))   return {ok:false, why:'chain'};
  if(c.sp==='ice' && c.iceLeft>0) return {ok:false, why:'frozen'};
  if(c.sp==='lock' && activeTrayCount(ctx,c.fruit)<1) return {ok:false, why:'needSame'};
  if(ctx.tray.length>=TRAY_N) return {ok:false, why:'full'};
  return {ok:true};
}
/* 双果链取牌：两端都无遮挡、货栏至少空两格（Q06 / 第 7.2 节） */
function canTakePair(ctx,c){
  var p=pairOf(ctx,c);
  if(!p || p.broken) return {ok:false, why:'notchain'};
  var a=ctx.byId[p.a], b=ctx.byId[p.b];
  if(!a||!b||a.state!=='board'||b.state!=='board') return {ok:false, why:'gone'};
  if(a.locked || b.locked) return {ok:false, why:'covered'};
  if(TRAY_N-ctx.tray.length < 2) return {ok:false, why:'need2'};
  return {ok:true};
}
/* 冰冻的解冻方式（v0.9 第 10.2 节）：只保留邻消解冻，点击敲冰已删除。
   canChip 恒返回不可行，只用于给玩家一句准确的提示，界面上不再有可敲的冰。 */
function canChip(ctx,c){
  if(!c || c.state!=='board') return {ok:false, why:'gone'};
  if(c.sp!=='ice' || c.iceLeft<=0) return {ok:false, why:'noice'};
  return {ok:false, why:'neighborOnly'};
}
/* 炸弹的方形范围（第 8.3 节）：半径 1 个卡片单位，含斜角，边界计入。
   用棋盘逻辑坐标计算，不用屏幕像素。 */
function bombInRange(a,b){
  return Math.abs(a.x-b.x) <= BOMB_RADIUS + 1e-9 && Math.abs(a.y-b.y) <= BOMB_RADIUS + 1e-9;
}
/* 至少有一个有效目标，否则不消耗炸弹（第 8.2 节）。调用前需已 computeLocked。 */
function bombRawZone(ctx,bm){
  if(bm && bm.zone && bm.zone.length) return bm.zone;
  /* 兼容没有快照的旧数据：退回「当下无遮挡 + 方形半径 1」的几何范围 */
  var ids=[];
  if(bm && bm.state==='board'){
    computeLocked(ctx);
    ctx.cards.forEach(function(o){
      if(o!==bm && o.state==='board' && !o.locked && bombInRange(bm,o)) ids.push(o.id);
    });
  }
  return ids;
}
/* 快照里「此刻还在棋盘上、且仍是普通水果」的那几张 */
function bombLiveZone(ctx,bm){
  var out=[];
  bombRawZone(ctx,bm).forEach(function(id){
    var o=ctx.byId[id];
    if(o && o.state==='board' && o.kind==='fruit') out.push(o);
  });
  return out;
}
function bombHasTarget(ctx,bm){
  return bombLiveZone(ctx,bm).length>0;
}
function canBoom(ctx,c){
  if(!c || c.state!=='board' || c.kind!=='bomb') return {ok:false, why:'nobomb'};
  if(c.locked) return {ok:false, why:'covered'};
  computeLocked(ctx);
  if(!bombHasTarget(ctx,c)) return {ok:false, why:'notarget'};
  return {ok:true};
}
/* 第 8.2 节：炸弹一旦没有有效目标，就是「不消耗、直接退场」，而不是永远赖在盘上。
   这不只是文案问题 —— 炸弹占着一格、压着正下方那张牌，而它既炸不了（notarget）
   又不能被取走（kind='bomb'）。如果它一直不退场，正下方那张水果就永久锁死，
   这一关永远通不了。所以「靶区被当普通三消收走」之后，必须让这颗炸弹立刻退场。 */
function retireTargetlessBombs(ctx){
  var bombs=[], n=0;
  ctx.cards.forEach(function(c){ if(c.state==='board' && c.kind==='bomb') bombs.push(c); });
  if(!bombs.length) return 0;
  computeLocked(ctx);
  bombs.forEach(function(c){
    if(!bombHasTarget(ctx,c)){ c.state='gone'; n++; }
  });
  return n;
}

/* ---- 彩虹（第 9 节 / Q18～Q20）：覆盖层，不再作为货栏万能水果 ---- */
/* 一次完整三消事件最多揭掉一个彩虹覆盖层；优先揭「当前看得见」的那张，
   多个都看得见时按预设揭示顺序（revealIdx）取最靠前的一个。 */
function revealOneRainbow(ctx, snap){
  if(!ctx.cfg || ctx.cfg.special!=='rainbow') return null;
  var pick=null, fallback=null;
  ctx.cards.forEach(function(c){
    if(c.state!=='board' || !c.rainbow) return;
    if(!fallback || c.revealIdx < fallback.revealIdx) fallback=c;
    if(snap && !snap[c.id]) return;                 /* 被压住的先不揭 */
    if(!pick || c.revealIdx < pick.revealIdx) pick=c;
  });
  var t=pick || fallback;
  if(t) t.rainbow=false;
  return t || null;
}

/* ---- 货栏三消匹配：三张同款普通水果 ---- */
function findMatch(ctx){
  var tray=ctx.tray, byF={}, i, c, f;
  for(i=0;i<tray.length;i++){
    c=tray[i];
    if(c.sealed || c.kind!=='fruit') continue;      /* 未解封的封蜡不参与凑三 */
    (byF[c.fruit]=byF[c.fruit]||[]).push(i);
  }
  var best=null, key=1e9;
  for(f in byF){ var a=byF[f]; if(a.length>=3 && a[0]<key){ key=a[0]; best=[a[0],a[1],a[2]]; } }
  if(best) return { idx:best, rain:0 };
  return null;
}
function matchCards(ctx,m){
  return m.idx.slice().sort(function(a,b){ return a-b; }).map(function(i){ return ctx.tray[i]; });
}

/* ---- 炸弹（Q14～Q17，v0.9 第二轮修订）：开局快照 + 连锁 + 清除快照内全部已暴露水果 ----
   快照在生成期就定死并写进炸弹卡片（bm.zone = 牌 id 列表）：炸弹周围方形半径 1（含斜角）
   内、开局时就已经暴露的普通水果。由此得到三条确定性质：
     · 不穿透新下层 —— 开局之后才露出来的下层牌不在快照里，永远不会被波及；
     · 预览与实际同一快照 —— 按下炸弹时高亮的、和确认后真正清掉的，是同一份 zone；
     · 生成期可验证 —— 快照张数被发成整组同款（assignFruits），一次引爆清掉的每种水果
       都是完整三张，盘面不会留下凑不成三的残牌（第 8.5 节）。 */
function bombPlan(ctx, first){
  var i, j;
  /* ① 连锁：快照里出现别的炸弹 → 继续引爆；每个炸弹每盘面最多算一次 */
  var chain=[first], seen={};
  seen[first.id]=true;
  for(i=0;i<chain.length;i++){
    var z=bombRawZone(ctx, chain[i]);
    for(j=0;j<z.length;j++){
      var o=ctx.byId[z[j]];
      if(o && o.state==='board' && o.kind==='bomb' && !seen[o.id]){ seen[o.id]=true; chain.push(o); }
    }
  }
  /* ② 实际清除：整次连锁的快照并集里，此刻仍在棋盘上的普通水果，去重后每张只清一次 */
  var remove=[], hit={};
  chain.forEach(function(bm){
    bombRawZone(ctx, bm).forEach(function(id){
      var o=ctx.byId[id];
      if(!o || hit[o.id]) return;
      if(o.state!=='board' || o.kind!=='fruit') return;
      hit[o.id]=1; remove.push(o);
    });
  });
  /* ③ 预览范围 = 会被清掉的水果 + 被连锁引爆的其它炸弹 */
  var range=remove.slice();
  chain.forEach(function(bm){ if(bm!==first) range.push(bm); });
  /* ④ 每种水果实际清除数量 + 每个炸弹自身还有几个可用目标 */
  var byF={};
  remove.forEach(function(o){ byF[o.fruit]=(byF[o.fruit]||0)+1; });
  var summary=Object.keys(byF).map(function(f){ return { fruit:+f, remove:byF[f] }; });
  summary.sort(function(a,b){ return a.fruit-b.fruit; });
  var each=chain.map(function(bm){ return { id:bm.id, targets:bombLiveZone(ctx,bm).length }; });
  return { bombs:chain, range:range, remove:remove, summary:summary, each:each, radius:BOMB_RADIUS };
}
/* 只读预览：不改变局面，供按下炸弹时显示「会影响什么、实际清掉什么」 */
function bombPreviewOf(ctx, c){
  if(!c || c.kind!=='bomb') return null;
  var p=bombPlan(ctx,c);
  return { bombs:p.bombs.length, range:p.range.length, remove:p.remove.length, summary:p.summary, each:p.each };
}

/* ---- 一次「有效三张消除事件」（K02 / 第 21.4 节）---- */
function applyEliminateEvent(ctx, trio, snap){
  var best=null;
  ctx.tray.forEach(function(c){ if(c.sealed && (!best || c.trayAt<best.trayAt)) best=c; });
  if(best){
    best.sealed=false;                              /* 封蜡：解开最早入栏的一张 */
    /* 记下这次解封。解封引发的连锁三消会在同一次结算里接着发生，
       等渲染时这张可能已经被收走了，渲染层看不到它 —— 所以要在这里留痕，
       让结算末尾统一补播融化动效（v0.10 第 4/5 项）。 */
    if(ctx.__meltLog) ctx.__meltLog.push(best);
  }
  /* 彩虹（第 9.3 节）：由其他普通水果完成一次真实三消 → 揭掉一个覆盖层 */
  revealOneRainbow(ctx, snap);
  if(ctx.cfg.special==='ice' && ctx.cfg.sp.iceMode==='neighbor'){
    ctx.cards.forEach(function(ice){
      if(ice.state!=='board' || ice.sp!=='ice' || ice.iceLeft<=0) return;
      if(snap && !snap[ice.id]) return;                /* 事件开始时仍被压住 → 不减层 */
      var hit=false;
      trio.forEach(function(t){
        if(t.layer===ice.layer && Math.max(Math.abs(t.x-ice.x),Math.abs(t.y-ice.y))<=UNIT) hit=true;
      });
      if(hit){
        ice.iceLeft--;
        /* 完全解冻 → 立即回到普通水果（第 10.2 节：解冻后作为普通水果取走）。
           清掉 sp 让视觉、剪刀候选与状态三层同时生效，且与模拟层保持同一套规则。 */
        if(ice.iceLeft<=0){ ice.iceLeft=0; ice.sp=''; }
      }
    });
  }
}
function simResolveMatches(ctx){
  retireTargetlessBombs(ctx);                 /* 无目标的炸弹先退场，保证与真实对局同一套规则 */
  var guard=0, events=0;
  while(guard++<60){
    var m=findMatch(ctx);
    if(!m) break;
    var trio=matchCards(ctx,m);
    var snap=ctx.freeSnap;
    trio.forEach(function(c){ c.state='gone'; });
    ctx.tray=ctx.tray.filter(function(c){ return trio.indexOf(c)<0; });
    applyEliminateEvent(ctx, trio, snap);
    events++;
  }
  return events;
}

/* ---- 最后三张自动收尾的可行性（v0.10 第 6 项）----
   在盘面的副本上，用**同一套取牌与结算规则**把这三张依次取进货栏，
   只有「三张都真的取进去了 + 结算完 = 本关真的通关」才算最后三张成立。
   ① 三张的取牌顺序按 6 种排列逐个试：同果锁这类「货栏里要先有一张同类才能取走」
      的规则会让某些顺序取不动，棋盘自然顺序取不动时就换一个可行顺序，而不是直接放弃；
   ② 封蜡（入栏即封、不参与凑三）、冰冻、彩虹、双果链、物理遮挡、货栏不够位置，
      全部由同一套规则自然判掉，不再依赖「sp===''」这种白名单式排除 ——
      旧写法把同果锁、双果链端点一律排除，结果第 1、2 关的自动收尾永远不触发。 */
function simFinalThree(ctx, ids){
  var perms=[[0,1,2],[1,0,2],[0,2,1],[2,1,0],[1,2,0],[2,0,1]];
  var firstFail=null;
  for(var p=0;p<perms.length;p++){
    var s=simClone(ctx), ord=perms[p], ok=true, why='', tray0=s.tray.length;
    computeLocked(s);
    for(var i=0;i<3;i++){
      var cc=s.byId[ids[ord[i]]];
      if(!cc || cc.state!=='board'){ ok=false; why='gone'; break; }
      var r=canTakeSingle(s,cc);
      if(!r.ok){ ok=false; why=r.why; break; }
      cc.state='tray'; cc.trayAt=(++s.seq);
      if(cc.sp==='wax') cc.sealed=true;              /* 入栏即重新封蜡（21.4.1） */
      s.tray.push(cc);
      computeLocked(s);
      simResolveMatches(s);                          /* 每次入栏后照常结算 */
    }
    if(ok && simAllClear(s)) return { ok:true, order:ord.slice(), trayAtStart:tray0 };
    if(!firstFail) firstFail={ ok:false, why:why||'notclear', trayAtStart:tray0 };
  }
  return firstFail || { ok:false, why:'notclear' };
}

/* ============================================================
   5. 可解性验证（用真实规则模拟一条通关路径）
   ============================================================ */
function simClone(src){
  var cs=src.cards.map(function(c){ return {
    id:c.id, kind:c.kind, fruit:c.fruit, layer:c.layer, x:c.x, y:c.y,
    state:c.state, sp:c.sp, pairId:c.pairId, pairEnd:c.pairEnd,
    rainbow:!!c.rainbow, revealIdx:(c.revealIdx===undefined?-1:c.revealIdx), grp:c.grp,
    iceLeft:c.iceLeft, iceTotal:c.iceTotal, sealed:c.sealed, trayAt:c.trayAt, locked:false,
    /* 炸弹的开局快照必须一起带走。原来漏了这个字段，克隆出来的炸弹退化成
       「按当下几何找目标」，于是模拟里的炸弹比真实对局更能炸 —— 生成期验证通过、
       实际玩起来却可能炸不动。这是验证保真度问题，不是可优化项。 */
    zone:(c.zone?c.zone.slice():null)
  };});
  var byId={}; cs.forEach(function(c){ byId[c.id]=c; });
  return {
    cards:cs, byId:byId,
    tray:src.tray.map(function(c){ return byId[c.id]; }),
    pairs:src.pairs.map(function(p){ return { id:p.id, a:p.a, b:p.b, order:p.order.slice(), broken:p.broken }; }),
    curtains:[], cfg:src.cfg, seq:src.seq||0, freeSnap:null
  };
}
/* ---- v0.11：「此刻真的能点动」的动作清点（唯一实现） ----
   页面上的 hasLegalMove() 也调它，避免规则判定出现两份会各自漂移的副本。
   口径：炸弹没有目标不算、冰冻没化不能点、彩虹覆盖着不能点、双果链两端算 1 个动作。 */
function simLegalMoveCount(ctx){
  if(!ctx) return 0;
  var live=boardCards(ctx), n=0, i;
  computeLocked(ctx);
  for(i=0;i<live.length;i++){
    var c=live[i];
    if(c.locked) continue;
    if(c.kind==='bomb'){ if(bombHasTarget(ctx,c)) n++; continue; }
    if(isChainLocked(ctx,c)){ if(canTakePair(ctx,c).ok) n++; continue; }
    if(c.sp==='ice' && c.iceLeft>0) continue;
    if(c.rainbow) continue;
    if(canTakeSingle(ctx,c).ok) n++;
  }
  return n;
}
/* ---- v0.11 第 1 项：死局自愈 —— 松开最少几张同果锁能让局面重新能动 ----
   前提：玩家一步都走不动（simLegalMoveCount === 0）。此时同果锁的「货栏里要先有同类」
   已经不可能满足——盘面与货栏都没有可取的同类，锁就只剩挡路，所以松开它不算放水。
   策略（最小改动优先）：
     ① 任何一张锁牌单独松开就能让局面动 → 只松这一张，返回；
     ② 否则每次松开「让合法操作最多」的那张，最多 AUTO_UNLOCK_MAX 张；
     ③ 仍然救不活 → 返回 ok:false，并且**完全不改动入参**，调用方保持原有卡局/失败流程。
   全过程在 simClone 副本上试算，只有确实救得活才把结论交给调用方落地。 */
function simUnlockPlan(ctx, maxUnlock){
  maxUnlock = maxUnlock || AUTO_UNLOCK_MAX;
  var before = simLegalMoveCount(ctx);
  if(before>0) return { ok:false, why:'has-move', ids:[], before:before, after:before };
  var locks=ctx.cards.filter(function(c){ return c.state==='board' && c.sp==='lock'; });
  if(!locks.length) return { ok:false, why:'no-lock', ids:[], before:0, after:0 };
  var trial=simClone(ctx), ids=[], guard=0;
  while(guard++ < maxUnlock){
    var list=trial.cards.filter(function(c){ return c.state==='board' && c.sp==='lock'; });
    if(!list.length) break;
    var pick=null, pickN=0, saved=false, i;
    for(i=0;i<list.length;i++){
      var c=list[i], sv=c.sp;
      c.sp='';                                   /* 试：松开这一张 */
      var n=simLegalMoveCount(trial);
      c.sp=sv;                                   /* 还原，稍后统一落地 */
      if(n>0){ pick=c; pickN=n; saved=true; break; }
      if(!pick || n>pickN){ pick=c; pickN=n; }
    }
    if(!pick) break;
    pick.sp='';                                  /* 在副本上真正松开 */
    ids.push(pick.id);
    if(saved) return { ok:true, ids:ids, before:before, after:pickN };
  }
  var after=simLegalMoveCount(trial);
  if(after>0) return { ok:true, ids:ids, before:before, after:after };
  return { ok:false, why:'cannot-fix', ids:[], before:before, after:before };
}
function simRemaining(ctx,fruit){
  var n=0;
  ctx.cards.forEach(function(c){ if(c.state!=='gone' && c.kind==='fruit' && c.fruit===fruit) n++; });
  return n;
}
/* 还剩几个彩虹覆盖层（第 9 节：没揭掉的覆盖层会把底层水果锁住） */
function simRainbowLeft(ctx){
  var n=0;
  ctx.cards.forEach(function(c){ if(c.state==='board' && c.rainbow) n++; });
  return n;
}
/* 通关判定：棋盘上不再有待取的普通水果、货栏也空了。
   炸弹是工具不是水果，第 8.2 节规定「无目标不消耗」，所以盘上留着没炸的炸弹
   也算通关（否则玩家把靶区的水果先取走，炸弹就永远消不掉、这一关无法结束）。 */
function simAllClear(ctx){
  var i, c;
  for(i=0;i<ctx.cards.length;i++){
    c=ctx.cards[i];
    if(c.state==='board' && c.kind==='fruit') return false;
  }
  return !ctx.tray.length;
}
function simCompletes(ctx,c){
  /* 模拟「这一张入栏后」是否立刻形成合法三张（封蜡入栏会重新封上） */
  var add={ id:c.id, kind:c.kind, fruit:c.fruit, sealed:(c.sp==='wax'), sp:c.sp, trayAt:1e6, state:'tray', layer:c.layer, x:c.x, y:c.y };
  var t=ctx.tray.slice();
  t.push(add);
  var probe={ tray:t, cards:ctx.cards, byId:ctx.byId, pairs:ctx.pairs, cfg:ctx.cfg, freeSnap:ctx.freeSnap };
  return !!findMatch(probe);
}
/* 一次三消事件能解冻几张冰牌（第 10.2 / Q23 节：同层含斜角 1 单位邻域，只算当前没被压住的冰牌）。
   冰冻只能靠邻消解冻，所以求解时必须主动往「三消发生在冰牌旁边」的方向走，
   否则会出现「冰牌到最后还没解冻、却已经没有相邻水果」的假死。 */
function simIceHits(ctx, trio){
  var n=0;
  ctx.cards.forEach(function(ice){
    if(ice.state!=='board' || ice.sp!=='ice' || ice.iceLeft<=0) return;
    if(ice.locked) return;
    for(var i=0;i<trio.length;i++){
      var t=trio[i];
      if(t.layer===ice.layer && Math.max(Math.abs(t.x-ice.x), Math.abs(t.y-ice.y))<=UNIT){ n++; return; }
    }
  });
  return n;
}
function simMoves(ctx){
  var mv=[], i;
  computeLocked(ctx);
  var live=boardCards(ctx);
  var sealedN=0;
  ctx.tray.forEach(function(x){ if(x.sealed) sealedN++; });
  /* 每种水果「此刻真的能取」的张数：用来判断开一个新花色会不会变成死重。
     货栏只有 7 格，开一个「可取张数不足 3」的花色几乎必然把栏堵死。 */
  var takeable={};
  for(i=0;i<live.length;i++){
    var t0=live[i];
    if(t0.locked || t0.kind!=='fruit') continue;
    if(t0.rainbow) continue;
    if(t0.sp==='ice' && t0.iceLeft>0) continue;
    if(canTakeSingle(ctx,t0).ok) takeable[t0.fruit]=(takeable[t0.fruit]||0)+1;
  }
  for(i=0;i<live.length;i++){
    var c=live[i];
    var p=pairOf(ctx,c);
    if(p && !p.broken){
      if(c.id===Math.min(p.a,p.b)){
        var rp=canTakePair(ctx,c);
        if(rp.ok) mv.push({ t:'pair', c:c, score:900 });
      }
      continue;
    }
    /* 炸弹必须有有效邻近目标才值得作为一步（第 8.2 节：没有目标不消耗） */
    if(c.kind==='bomb'){
      if(!c.locked && bombHasTarget(ctx,c)) mv.push({ t:'boom', c:c, score:520 });
      continue;
    }
    if(c.locked) continue;
    if(c.sp==='ice' && c.iceLeft>0) continue;      /* 冰冻只能靠相邻三消解冻（v0.9） */
    var r=canTakeSingle(ctx,c);
    if(!r.ok) continue;
    var n=activeTrayCount(ctx,c.fruit);
    var s = 0;
    if(c.sp==='wax'){
      /* 封蜡入栏会立刻占一格且不参与凑三，越早放越好，但栏里已封多张时要先等消除事件 */
      s = 900 - ctx.tray.length*200 - sealedN*1400;
    } else {
      var rem=simRemaining(ctx,c.fruit);
      var tk=takeable[c.fruit]||0;
      var trayN=ctx.tray.length;
      if(n===2) s += 5200;                         /* 这一张就能凑成三消 */
      else if(n===1){
        s += 1600;
        if(tk>=2) s += 900;                        /* 栏里已有 1 张，且盘上还够凑第三张 */
        else s -= 1600;                            /* 第三张此刻取不到 → 很可能变成死重 */
      } else if(rem<3){
        /* 这一类总数已经不到三张：先取 1 张会把它彻底拆散，判定为死路。
           彩虹关里被覆盖的底层水果在揭掉后会回到可操作状态，所以看「未被覆盖的剩余数」。 */
        var freeRem=0;
        ctx.cards.forEach(function(o){
          if(o.state!=='gone' && o.kind==='fruit' && o.fruit===c.fruit && !o.rainbow) freeRem++;
        });
        s += (rem===2 && freeRem>=2) ? 300 : -100000;
      } else {
        /* n===0：新开一个花色。货栏只有 7 格，栏里存货越多越不该再开新花色；
           同一花色此刻能取的张数越多，越有可能马上凑成三消。 */
        s -= 620*Math.max(0, trayN-1);
        s += Math.min(tk,3)*220;
      }
      /* 冰冻关：解冻只能靠邻消，必须主动往冰牌附近做三消（第 10.2 / Q24 节） */
      if(ctx.cfg && ctx.cfg.special==='ice'){
        if(n===2){
          var mates=[];
          ctx.tray.forEach(function(x){
            if(mates.length<2 && x.kind==='fruit' && x.fruit===c.fruit && !x.sealed) mates.push(x);
          });
          mates.push(c);
          s += simIceHits(ctx, mates)*2600;
        } else {
          s += simIceHits(ctx, [c])*400;
        }
      }
    }
    s += c.layer*6;                                   /* 优先开上层 */
    s += pressureOf(ctx,c)*4;                         /* 优先解除遮挡 */
    mv.push({ t:'take', c:c, score:s });
  }
  return mv;
}
function simGreedy(start, budget, traceOn){
  var ctx=simClone(start), nodes=0, guard=0, trace=[], ids=[];
  while(nodes<budget && guard++<4000){
    nodes++;
    retireTargetlessBombs(ctx);
    var m=findMatch(ctx);
    if(m){
      var trio=matchCards(ctx,m);
      if(traceOn) trace.push('消除 '+(trio[0].kind==='rainbow'?'彩虹':FRUITS[trio[0].fruit].n)+'×3');
      trio.forEach(function(c){ c.state='gone'; });
      ctx.tray=ctx.tray.filter(function(c){ return trio.indexOf(c)<0; });
      applyEliminateEvent(ctx,trio,ctx.freeSnap);
      continue;
    }
    var live=boardCards(ctx);
    if(simAllClear(ctx)) return { ok:true, nodes:nodes, trace:trace, ids:ids };
    ctx.freeSnap = freeSnapOf(ctx);
    var mv=simMoves(ctx);
    if(!mv.length) return { ok:false, nodes:nodes, why:'no-move', left:live.length, tray:ctx.tray.length, trace:trace, ids:ids };
    mv.sort(function(a,b){ return b.score-a.score; });
    var cands=mv, pick;
    var free=TRAY_N-ctx.tray.length;
    if(free<=2){
      cands=mv.filter(function(x){
        if(x.t==='take') return simCompletes(ctx,x.c);
        if(x.t==='pair') return free>=2;
        return false;
      });
      if(!cands.length) return { ok:false, nodes:nodes, why:'tray-full', left:live.length, tray:ctx.tray.length, trace:trace, ids:ids };
    }
    pick=cands[0];
    ids.push({ t:pick.t, id:pick.c.id });
    if(traceOn) trace.push(pick.t+':'+(pick.c && pick.c.kind==='fruit' ? FRUITS[pick.c.fruit].n : pick.c && pick.c.kind)
                          +' 栏='+ctx.tray.length+' 封='+ctx.tray.filter(function(x){ return x.sealed; }).length
                          +' 盘='+live.length+' 分='+pick.score);
    if(pick.t==='take'){
      var c1=pick.c;
      c1.state='tray'; c1.trayAt=(++ctx.seq);
      if(c1.sp==='wax') c1.sealed=true;
      ctx.tray.push(c1);
    } else if(pick.t==='pair'){
      var p=pairOf(ctx,pick.c), a=ctx.byId[p.a], b=ctx.byId[p.b];
      a.state='tray'; a.trayAt=(++ctx.seq);
      b.state='tray'; b.trayAt=(++ctx.seq);
      ctx.tray.push(a); ctx.tray.push(b);
      p.broken=true;
    } else if(pick.t==='boom'){
      var plan=bombPlan(ctx, pick.c);
      plan.bombs.forEach(function(bm){ bm.state='gone'; });
      plan.remove.forEach(function(o){ o.state='gone'; });
    }
  }
  return { ok:false, nodes:nodes, why:'budget', ids:ids };
}
/* 一次性把「当前哪些款水果真的能取、各能取几张」算出来。
   关键性质：取走一张牌只会让更多牌变得无遮挡（永不反悔），
   所以「某款此刻可取 ≥3 张」就一定能把这一手连着收完、凑成三消。 */
function simTakeable(ctx){
  computeLocked(ctx);
  var live=boardCards(ctx), cnt={}, first={}, i, c;
  for(i=0;i<live.length;i++){
    c=live[i];
    if(c.locked || c.kind!=='fruit' || c.rainbow) continue;
    if(c.sp==='ice' && c.iceLeft>0) continue;
    if(isChainLocked(ctx,c)) continue;
    if(!canTakeSingle(ctx,c).ok) continue;
    cnt[c.fruit]=(cnt[c.fruit]||0)+1;
    if(!first[c.fruit]) first[c.fruit]=c;
  }
  return { cnt:cnt, first:first };
}
/* 「凑满一手再动下一手」的确定性策略 —— 最贴近人工打法的一条，也是最快的一条。
   优先级：① 补上第三张 → ② 栏里已有 1 张、盘上还够 2 张 → ③ 开一手「此刻可取 ≥3 张」的新花色
          → ④ 双果链成对取 → ⑤ 没有别的办法时引爆炸弹 → ⑥ 兜底取分最高的一张。
   这条策略天然不会把 7 格货栏堆成 4～5 种互不相配的牌（实测贪心就是这么走死的）。 */
function simStrict(start, budget, traceOn){
  var ctx=simClone(start), guard=0, trace=[], ids=[], nodes=0, i, c;
  while(guard++<8000){
    simResolveMatches(ctx);
    if(simAllClear(ctx)) return { ok:true, nodes:nodes, mode:'strict', trace:trace, ids:ids };
    computeLocked(ctx);
    ctx.freeSnap=freeSnapOf(ctx);
    var live=boardCards(ctx);
    var mv=simMoves(ctx);
    if(!mv.length) return { ok:false, nodes:nodes,
      why:(ctx.tray.length>=TRAY_N?'tray-full':'no-move')+(live.length?'':'-bomb'), trace:trace, ids:ids };
    var T=simTakeable(ctx);
    var pick=null;
    for(i=0;i<mv.length && !pick;i++){                      /* ① 补第三张 */
      if(mv[i].t!=='take') continue;
      c=mv[i].c;
      if(activeTrayCount(ctx,c.fruit)===2 && simCompletes(ctx,c)) pick=mv[i];
    }
    for(i=0;i<mv.length && !pick;i++){                      /* ② 栏里 1 张、盘上还够 2 张 */
      if(mv[i].t!=='take') continue;
      c=mv[i].c;
      if(activeTrayCount(ctx,c.fruit)===1 && (T.cnt[c.fruit]||0)>=2) pick=mv[i];
    }
    if(!pick){                                              /* ③ 开一手可取 ≥3 张的新花色 */
      var bi=-1, bt=2;
      for(i=0;i<mv.length;i++){
        if(mv[i].t!=='take') continue;
        c=mv[i].c;
        if(activeTrayCount(ctx,c.fruit)!==0) continue;
        if((T.cnt[c.fruit]||0)>bt){ bt=T.cnt[c.fruit]; bi=i; }
      }
      if(bi>=0) pick=mv[bi];
    }
    if(!pick && TRAY_N-ctx.tray.length>=2){                 /* ④ 双果链成对取 */
      for(i=0;i<mv.length && !pick;i++){ if(mv[i].t==='pair') pick=mv[i]; }
    }
    if(!pick){                                              /* ⑤ 引爆炸弹（靶区本来就是整三张） */
      for(i=0;i<mv.length && !pick;i++){ if(mv[i].t==='boom') pick=mv[i]; }
    }
    if(!pick){                                              /* ⑥ 兜底 */
      mv.sort(function(a,b){ return b.score-a.score; });
      pick=mv[0];
    }
    nodes++;
    ids.push({ t:pick.t, id:pick.c.id });
    if(traceOn) trace.push(pick.t+':'+(pick.c && pick.c.kind==='fruit' ? FRUITS[pick.c.fruit].n : (pick.c&&pick.c.kind))
                          +' 栏='+ctx.tray.length+' 盘='+live.length);
    if(pick.t==='take'){
      var c2=pick.c;
      c2.state='tray'; c2.trayAt=(++ctx.seq);
      if(c2.sp==='wax') c2.sealed=true;
      ctx.tray.push(c2);
    } else if(pick.t==='pair'){
      var pp=pairOf(ctx,pick.c), a2=ctx.byId[pp.a], b2=ctx.byId[pp.b];
      if(!a2||!b2) return { ok:false, nodes:nodes, why:'pair-gone', trace:trace };
      a2.state='tray'; a2.trayAt=(++ctx.seq);
      b2.state='tray'; b2.trayAt=(++ctx.seq);
      ctx.tray.push(a2); ctx.tray.push(b2);
      pp.broken=true;
    } else if(pick.t==='boom'){
      var pl=bombPlan(ctx, pick.c);
      pl.bombs.forEach(function(bm){ bm.state='gone'; });
      pl.remove.forEach(function(o){ o.state='gone'; });
    }
  }
  return { ok:false, nodes:nodes, why:'budget' };
}
function simBeam(start, budget, traceOn){
  var WIDTH=28, nodes=0;
  /* 同类状态合并键。v0.9 第二轮修正：原来的键只用了「货栏张数 + 盘面张数 + 未解冻冰数」，
     结果「货栏里放的是哪几款水果」完全不同的两条路径会被当成同一条丢掉 ——
     盘面张数一样但货栏内容不同，后续能不能凑成三消是两回事，
     这会直接把有希望的路径剪掉，是冰关／炸弹关被误判成无解的元凶之一。
     现在把货栏的水果构成也写进键（封蜡用 X 表示，与普通同类区分开）。 */
  function stateKey(st){
    var ice=0, sig=[];
    st.ctx.cards.forEach(function(c){
      if(c.state==='board' && c.sp==='ice' && c.iceLeft>0) ice++;
    });
    st.ctx.tray.forEach(function(c){
      sig.push(c.sealed ? 'X' : (c.kind==='fruit' ? c.fruit : 'B'));
    });
    sig.sort();
    return sig.join(',')+'|'+st.live+'|'+ice;
  }
  function settleAll(st){
    var g=0;
    while(g++<80){
      retireTargetlessBombs(st.ctx);
      var m=findMatch(st.ctx);
      if(!m) break;
      var trio=matchCards(st.ctx,m);
      if(traceOn) st.trace.push('消除 '+(trio[0].kind==='rainbow'?'彩虹':FRUITS[trio[0].fruit].n)+'×3');
      trio.forEach(function(c){ c.state='gone'; });
      st.ctx.tray=st.ctx.tray.filter(function(c){ return trio.indexOf(c)<0; });
      applyEliminateEvent(st.ctx, trio, st.ctx.freeSnap);
    }
  }
  var beam=[{ ctx:simClone(start), trace:[], ids:[], live:boardCards(start).length }];
  for(var step=0; step<200 && beam.length; step++){
    var next=[];
    for(var b=0; b<beam.length; b++){
      var st=beam[b];
      settleAll(st);
      var liveN=boardCards(st.ctx).length;
      if(simAllClear(st.ctx)) return { ok:true, nodes:nodes, mode:'beam', trace:st.trace, ids:st.ids };
      if(nodes>=budget) continue;
      st.ctx.freeSnap=freeSnapOf(st.ctx);
      var mv=simMoves(st.ctx);
      if(!mv.length) continue;
      /* 分支要「花色多样」：只按分数取前几名时，前几名常常是同一款水果的三张，
         等于把三条搜索线浪费在同一个决定上。这里先按 (动作, 花色) 去重取每类最佳。 */
      mv.sort(function(x,y){ return y.score-x.score; });
      var seen={}, div=[];
      for(var z=0; z<mv.length; z++){
        var key=mv[z].t+'|'+(mv[z].c && mv[z].c.kind==='fruit' ? mv[z].c.fruit : (mv[z].c?mv[z].c.kind:'-'));
        if(seen[key]) continue;
        seen[key]=1; div.push(mv[z]);
      }
      mv=div;
      var top=Math.min(mv.length, 6);
      for(var k=0;k<top;k++){
        var pick=mv[k];
        var nc=simClone(st.ctx);
        nodes++;
        var cc=nc.byId[pick.c.id];
        if(!cc) continue;
        var nt={ ctx:nc, trace:st.trace.slice(), ids:st.ids.concat([{ t:pick.t, id:pick.c.id }]), live:liveN };
        if(traceOn) nt.trace.push(pick.t+':'+(cc.kind==='fruit'?FRUITS[cc.fruit].n:cc.kind)
          +' 栏='+nc.tray.length+' 盘='+liveN+' 分='+pick.score);
        if(pick.t==='take'){
          cc.state='tray'; cc.trayAt=(++nc.seq);
          if(cc.sp==='wax') cc.sealed=true;
          nc.tray.push(cc);
          nt.live=liveN-1;
        } else if(pick.t==='pair'){
          var pp=nc.pairs[cc.pairId];
          var aa=nc.byId[pp.a], bb=nc.byId[pp.b];
          aa.state='tray'; aa.trayAt=(++nc.seq);
          bb.state='tray'; bb.trayAt=(++nc.seq);
          nc.tray.push(aa); nc.tray.push(bb);
          pp.broken=true;
          nt.live=liveN-2;
        } else if(pick.t==='boom'){
          var plan=bombPlan(nc, cc);
          plan.bombs.forEach(function(bm){ bm.state='gone'; });
          plan.remove.forEach(function(o){ o.state='gone'; });
          nt.live=boardCards(nc).length;
        }
        next.push(nt);
      }
    }
    if(!next.length) break;
    next.forEach(function(t){ t.live=boardCards(t.ctx).length; });
    next.sort(function(a,b){
      if(a.ctx.tray.length!==b.ctx.tray.length) return a.ctx.tray.length-b.ctx.tray.length;  /* 货栏越空越有希望 */
      return a.live-b.live;                                                                  /* 盘面消得越多越好 */
    });
    var uniq=[], seen={};
    for(var q=0;q<next.length;q++){
      var key=stateKey(next[q]);
      if(seen[key]) continue;
      seen[key]=1; uniq.push(next[q]);
      if(uniq.length>=WIDTH) break;
    }
    beam=uniq;
  }
  return { ok:false, nodes:nodes, why:'beam-dead-end', ids:[] };
}
/* 对外统一入口：先走「凑满一手」的确定性策略（最快、最稳），
   不行再走单条贪心，最后用多路搜索兜底。三条路都只用同一套真实规则函数。 */
function simulate(start, budget, traceOn){
  var s=simStrict(start, budget, traceOn);
  if(s.ok) return s;
  var g=simGreedy(start, budget, traceOn);
  if(g.ok){ g.mode='greedy'; return g; }
  var b=simBeam(start, budget, traceOn);
  if(b.ok) return b;
  b.why=b.why+'(凑手:'+s.why+'/贪心:'+g.why+')';
  return b;
}

/* ============================================================
   6. 关卡生成（布局 → 炸弹落点 → 水果 → 唯一特殊玩法 → 真规则验证）

   第二轮（v0.9）关键改动：
     · 底牌位置改为「形状内随机取 + 邻域加密」，让同一层出现相邻格位——
       双果链要同层近距（第 7.1 节），上层遮挡也需要下面有牌（第 1.2 节第 14 条）。
     · 先定炸弹落点、再发水果：炸弹爆破区内必须是整组同款，
       这样一次爆炸清掉的正好是完整三张，不会留下凑不成三的残牌（第 8.5 节）。
     · 发水果按「三张一组、互相远离、跨层级」成组，把同款分散开，
       再跑一轮「减少开局即可三消」的修正（第 1.2 节第 14 条）。
   ============================================================ */

/* 从形状格位里取 n 个位置：先随机取（保留形状轮廓），再做几轮
   「把孤立格位换成有邻居的格位」提高同层密集度。 */
function pickCluster(cells, n){
  if(n<=0) return [];
  if(n>=cells.length) return cells.slice();
  var pool=cells.slice(); shuffle(pool);
  var picked=pool.slice(0,n).map(function(p){ return { x:p.x, y:p.y }; });
  var outPool=pool.slice(n).map(function(p){ return { x:p.x, y:p.y }; });
  var inSet={};
  picked.forEach(function(p){ inSet[p.x+','+p.y]=1; });
  function nb(x,y){
    var c=0;
    for(var dx=-1;dx<=1;dx++){
      for(var dy=-1;dy<=1;dy++){
        if(!dx && !dy) continue;
        if(inSet[(x+dx)+','+(y+dy)]) c++;
      }
    }
    return c;
  }
  for(var round=0; round<3; round++){
    for(var i=0;i<picked.length;i++){
      var p=picked[i];
      if(nb(p.x,p.y)>0) continue;
      var best=-1, bestK=-1;
      for(var j=0;j<outPool.length;j++){
        var k=nb(outPool[j].x,outPool[j].y);
        if(k<=0) continue;
        k += rnd()*0.5;
        if(k>bestK){ bestK=k; best=j; }
      }
      if(best<0) break;
      var q=outPool[best];
      delete inSet[p.x+','+p.y];
      inSet[q.x+','+q.y]=1;
      picked[i]=q; outPool[best]=p;
    }
  }
  return picked;
}

/* 把一批牌分成「三张一组」：每组的 3 张尽量互相远离、跨层级，
   同款水果因此落在不同区域和不同层（第 1.2 节第 14 条）。 */
function pickSpreadTriples(cards){
  var pool=cards.slice(), out=[];
  while(pool.length>=3){
    var a=pool.shift(), i;
    var bi=-1, bs=-1;
    for(i=0;i<pool.length;i++){
      var s=Math.hypot(pool[i].x-a.x, pool[i].y-a.y) + (pool[i].layer!==a.layer?0.6:0);
      if(s>bs){ bs=s; bi=i; }
    }
    var b=pool.splice(bi,1)[0];
    var ci=-1, cs=-1;
    for(i=0;i<pool.length;i++){
      var s2=Math.min(Math.hypot(pool[i].x-a.x, pool[i].y-a.y),
                      Math.hypot(pool[i].x-b.x, pool[i].y-b.y))
             + (pool[i].layer!==a.layer?0.6:0);
      if(s2>cs){ cs=s2; ci=i; }
    }
    var c2=pool.splice(ci,1)[0];
    out.push([a,b,c2]);
  }
  return out;
}

/* 发水果：total 张牌分成 total/3 组，每组三张同款；每款水果按顺序轮分，
   因此每款水果的张数都是 3 的倍数（第 5.2 节）。
   comps = 炸弹连锁组的爆破区，这些区必须各自成为整组同款（第 8.5 节防残牌）。 */
function assignFruits(cards, types, comps){
  /* 炸弹是额外卡片、不计入普通水果配额（第 5.2 节），所以这里只对水果排队分组 */
  var fruits=cards.filter(function(c){ return c.kind==='fruit'; });
  var n=fruits.length;
  if(n%3!==0) return false;
  var groupN=n/3, i;
  var pool=[];
  for(i=0;i<groupN;i++) pool.push(i % types);
  shuffle(pool);

  var forced=[];
  if(comps){
    comps.forEach(function(zone){
      var zz=zone.slice();
      shuffle(zz);
      for(var k=0;k+3<=zz.length;k+=3){
        var t=zz.slice(k,k+3);
        t.forEach(function(c){ c._forced=1; });
        forced.push(t);
      }
    });
  }
  var freeCards=fruits.filter(function(c){ return !c._forced; });
  if(forced.length*3 + freeCards.length !== n) return false;
  var spread=pickSpreadTriples(freeCards);
  var groups=forced.concat(spread);
  if(groups.length!==groupN) return false;
  for(i=0;i<groups.length;i++){
    var f=pool[i];
    groups[i].forEach(function(c){ c.fruit=f; c.grp=i; });
  }
  cards.forEach(function(c){ delete c._forced; });
  return groups;
}

/* 第 1.2 节第 14 条：减少「开局就能直接凑三消」的明显组合。
   只对调两张牌的图案（全局数量不变，不新增也不抹掉任何牌），把开局无遮挡的同款拆开；
   炸弹爆破区内的牌不动，否则会破坏爆破安全。 */
function reduceInstantTriples(cards, bombInfo, lockedOf){
  var prot={};
  if(bombInfo && bombInfo.comps){
    bombInfo.comps.forEach(function(z){ z.forEach(function(c){ prot[c.id]=1; }); });
  }
  var done={}, guard=0;
  while(guard++<600){
    var byF={};
    cards.forEach(function(c){
      if(c.kind!=='fruit' || lockedOf(c.id) || prot[c.id]) return;
      (byF[c.fruit]=byF[c.fruit]||[]).push(c);
    });
    /* 每次处理「开局可见数最多」的那一款（不再只看第一款，避免来回震荡） */
    var hot=null, hotN=2;
    Object.keys(byF).forEach(function(f){ if(byF[f].length>hotN){ hotN=byF[f].length; hot=byF[f]; } });
    if(!hot) break;
    var u=null, i;
    for(i=0;i<hot.length;i++){ if(!done[hot[i].id]){ u=hot[i]; break; } }
    if(!u) break;
    /* 只换给「开局可见数还没到 2」的款式：换过去不会立刻又造出新的可三消组合，
       而且每张牌只参与一次，循环必然收敛。 */
    var best=null, bestK=1e9;
    cards.forEach(function(c){
      if(c.kind!=='fruit') return;
      if(!lockedOf(c.id)) return;                  /* 必须是被压住的那张 */
      if(prot[c.id] || done[c.id]) return;
      if(c.fruit===u.fruit) return;
      var v=(byF[c.fruit]||[]).length;
      if(v>=2) return;
      var k=v*100 + c.layer;
      if(k<bestK){ bestK=k; best=c; }
    });
    if(!best) break;
    var t=u.fruit; u.fruit=best.fruit; best.fruit=t;
    done[u.id]=1; done[best.id]=1;
  }
}
/* 只读体检：开局「可直接三消」的组合数（同一款水果在开局无遮挡处能凑出几组三张） */
function instantTriplesOf(cards, lockedOf){
  var visN={};
  cards.forEach(function(c){
    if(c.kind!=='fruit' || lockedOf(c.id)) return;
    visN[c.fruit]=(visN[c.fruit]||0)+1;
  });
  var n=0;
  Object.keys(visN).forEach(function(f){ n+=Math.floor(visN[f]/3); });
  return n;
}

/* ---- 炸弹落点与爆破区（第 8.4 / 8.5 节）----
   落点怎么选：
   · 本关的形状是一整块紧凑牌堆，牌与牌之间的空隙不足一张牌宽，所以棋盘上并不存在
     「不压任何牌的空白格位」。因此炸弹占用的是「原本属于一张水果卡片的格位」——
     首选当前没有被任何上层牌压住的那张，这样炸弹自己永远无遮挡、可点击；
   · 每关用 3 个炸弹（3 张水果换成炸弹）：普通水果总数仍然保持 3 的倍数（第 5.2 节），
     总牌量不变，3 张只占 60～72 张里的一小部分，远不到「覆盖大部分棋盘」。
   爆破区怎么保证可解：
   · 炸弹的爆破区 = 半径 1（含斜角）内「开局就已经暴露」的水果。张数必须是 3 的倍数，
     发牌时这些位置整组发成同款 → 一次引爆清掉的每种水果都是整三张，
     剩下的盘面依旧保持「每种水果 3 的倍数」，仍然能被整组三消清空
     （第 8.5 节：生成器必须验证爆破后仍存在合法通关路径）。
   · 多个炸弹的爆破区两两不重叠，免得后炸的那个少清几张、破坏整三张。 */
function lockSnapshotOf(cards, cfg){
  var ctx={ cards:cards, byId:{}, tray:[], pairs:[], cfg:cfg };
  computeLocked(ctx);
  var m={};
  cards.forEach(function(c){ m[c.id]=!!c.locked; });
  return m;
}
function bombCompOf(cards, cfg, anchor, lockOf){
  var z=[];
  cards.forEach(function(c){
    if(c===anchor || c.kind!=='fruit' || c.state!=='board') return;
    if(lockOf[c.id]) return;                       /* 被压住的牌不在「开始快照」里 */
    if(Math.max(Math.abs(c.x-anchor.x), Math.abs(c.y-anchor.y)) > BOMB_RADIUS+1e-9) return;
    z.push(c);
  });
  return z;
}
function chooseBombs(cards, cfg, wantN){
  var lock0=lockSnapshotOf(cards, cfg);
  var pool=[];
  var stat={ uncovFruit:0, z0:0, zUnder3:0, zNotMult3:0, zOK:0, zHist:{} };
  cards.forEach(function(c){
    if(c.kind!=='fruit' || lock0[c.id]) return;    /* 落点必须开局就没有被压住 */
    stat.uncovFruit++;
    var z=bombCompOf(cards, cfg, c, lock0);
    stat.zHist[z.length]=(stat.zHist[z.length]||0)+1;
    if(z.length===0) stat.z0++;
    if(z.length<3){ stat.zUnder3++; return; }
    if(z.length%3!==0){ stat.zNotMult3++; return; }
    stat.zOK++;
    pool.push({ card:c, comp:z, n:z.length });
  });
  /* 清得少的优先（爆破区小、视觉最清楚），同数量时上层优先、编号稳定 */
  pool.sort(function(a,b){
    return (a.n-b.n) || (b.card.layer-a.card.layer) || (a.card.id-b.card.id);
  });
  function tryPick(startIdx){
    var pick=[], i;
    for(i=startIdx; i<pool.length && pick.length<wantN; i++) pick.push(pool[i]);
    if(pick.length<wantN) return null;
    /* 真正换成炸弹后再重算一次：换掉上层牌会让下面的牌露出来，爆破区可能变大 */
    pick.forEach(function(p){ p.card.kind='bomb'; p.card.fruit=-1; });
    var lock1=lockSnapshotOf(cards, cfg);
    var comps=pick.map(function(p){ return bombCompOf(cards, cfg, p.card, lock1); });
    var bad=false;
    comps.forEach(function(z){ if(z.length<3 || z.length%3!==0) bad=true; });
    /* 炸弹之间可以连锁（第 8.4 节），爆破区互相重叠是允许的；
       真正能不能通关由 buildVerified 的整局模拟 + verifyBombs 的逐个引爆验证兜住。 */
    if(bad){
      pick.forEach(function(p){ p.card.kind='fruit'; });
      stat.retry=(stat.retry||0)+1;
      stat.retryLens=(stat.retryLens||[]).concat(comps.map(function(z){ return z.length; })).slice(0,60);
      return null;
    }
    return { cards:pick.map(function(p){ return p.card; }), comps:comps };
  }
  var diag={ wantN:wantN, candN:pool.length, stat:stat,
             lens:pool.map(function(p){ return p.n; }),
             seq:cfg.seq?cfg.seq.slice():null, shape:cfg.shape,
             gw:cfg.gw, gh:cfg.gh, radius:BOMB_RADIUS,
             card:CARD, offs:OFFS[0], offsAll:OFFS.map(function(o){ return o.slice(); }),
             uncov:[], layerN:{}, zList:[] };
  cards.forEach(function(c){
    diag.layerN[c.layer]=(diag.layerN[c.layer]||0)+1;
    if(c.kind!=='fruit' || lock0[c.id]) return;
    var z=bombCompOf(cards, cfg, c, lock0);
    diag.uncov.push([c.id, c.layer, +c.x.toFixed(2), +c.y.toFixed(2), z.length]);
  });
  for(var t=0; t<pool.length && t<140; t++){
    var got=tryPick(t);
    if(got){ diag.picked=t; diag.okN=got.cards.length; window.__bombDiag=diag;
             return { bombs:got.cards, comps:got.comps, found:got.cards.length, candN:pool.length }; }
  }
  diag.picked=-1; window.__bombDiag=diag;
  return { bombs:[], comps:[], found:0, candN:pool.length };
}

/* ---- 炸弹垫：3 个互不相邻的 2×2 小块（每个炸弹一块）----
   每块 4 张同层相邻，任取一角当炸弹，另外 3 张就是爆破区（半径 1 含斜角，恰好整三张）。
   块与块之间隔开一格以上，3 个爆破区两两不重叠、彼此也不含对方的炸弹。
   摆法有 4 种朝向（原样 / 水平镜像 / 垂直镜像 / 中心对称），从牌簇质心往外试，
   取第一个能整块落进形状格位的朝向；优先落在牌簇自己的格位里（贴住下面的牌）。 */
var BOMB_PAD_BLOCKS = [
  [[0,0],[1,0],[0,1],[1,1]],
  [[3,0],[4,0],[3,1],[4,1]],
  [[2,2],[3,2],[2,3],[3,3]]
];
function findBombPads(base, allCells){
  if(!base || base.length<4 || !allCells || !allCells.length) return null;
  var i, j;
  var cx=0, cy=0;
  base.forEach(function(p){ cx+=p.x; cy+=p.y; });
  cx=Math.round(cx/base.length); cy=Math.round(cy/base.length);
  var cand=[];
  allCells.forEach(function(p){ cand.push([p.x-cx, p.y-cy]); });
  cand.sort(function(a,b){
    return (Math.abs(a[0])+Math.abs(a[1])) - (Math.abs(b[0])+Math.abs(b[1]));
  });
  var mirrors=[[1,1],[-1,1],[1,-1],[-1,-1]];
  /* 两轮：先只允许落在牌簇自己的格位里（视觉最整齐），不行就放开到整个形状 */
  var sets=[{}, {}];
  base.forEach(function(p){ sets[0][p.x+','+p.y]=1; });
  allCells.forEach(function(p){ sets[1][p.x+','+p.y]=1; });
  for(var pass=0; pass<2; pass++){
    var set=sets[pass];
    for(var t=0;t<cand.length;t++){
      for(var m=0;m<mirrors.length;m++){
        var sx=mirrors[m][0], sy=mirrors[m][1];
        var ox=cx+cand[t][0], oy=cy+cand[t][1];
        var blocks=[], ok=true;
        for(i=0;i<BOMB_PAD_BLOCKS.length && ok;i++){
          var cells=[];
          for(j=0;j<4;j++){
            var px=ox+BOMB_PAD_BLOCKS[i][j][0]*sx, py=oy+BOMB_PAD_BLOCKS[i][j][1]*sy;
            if(!set[px+','+py]){ ok=false; break; }
            cells.push({ x:px, y:py });
          }
          if(ok) blocks.push(cells);
        }
        if(ok) return blocks;
      }
    }
  }
  return null;
}

function genCards(cfg, seed){
  rnd = mulberry32(seed>>>0);
  var cs = shapeCells(cfg.shape, cfg.gw, cfg.gh);
  if(!cs.length) throw new Error('形状格位为空: '+cfg.shape);
  var need = cfg.seq[0];
  if(cs.length < need) throw new Error('格位不足: '+cs.length+' < '+need);

  var base = pickCluster(cs, need);
  /* 炸弹关：先在最上层铺好「炸弹垫」—— 3 个互不相邻的 2×2 小块（见 p2 的 bombLayoutFor） */
  var padBlocks = (cfg.special==='bomb') ? findBombPads(base, cs) : null;
  if(cfg.special==='bomb' && !padBlocks) throw new Error('炸弹垫放不下: '+cfg.shape);
  var padFlat = [];
  if(padBlocks) padBlocks.forEach(function(b){ padFlat=padFlat.concat(b); });
  /* 包围盒要把炸弹垫也算进去，否则最上层的牌会跑到棋盘外面 */
  var bbox = padFlat.length ? base.concat(padFlat) : base;
  var cx=(cfg.gw-1)/2, cy=(cfg.gh-1)/2;
  base.sort(function(a,b){
    return (Math.abs(a.x-cx)+Math.abs(a.y-cy)) - (Math.abs(b.x-cx)+Math.abs(b.y-cy));
  });
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  bbox.forEach(function(p){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  });
  var unitsX=(maxX-minX)+CARD+0.7, unitsY=(maxY-minY)+CARD+0.7;

  /* ① 先只排位置和层级，不发水果：炸弹落点只依赖几何关系，
     先定炸弹再发水果，才能把爆破区内的牌发成整组同款。 */
  var cards=[], L, i;
  var padTop = cfg.seq.length-1;
  var padCards = [];                       /* [{block, idx, card}] 按块序排列 */
  for(L=0; L<cfg.seq.length; L++){
    var count=cfg.seq[L], off=OFFS[L % OFFS.length];
    var list = (L===padTop && padBlocks) ? padBlocks : null;
    if(list){
      for(var bi=0;bi<list.length;bi++){
        for(var ci=0;ci<list[bi].length;ci++){
          var pp=list[bi][ci];
          var card={ id:cards.length, kind:'fruit', fruit:-1, layer:L,
                     x:(pp.x-minX)+off[0], y:(pp.y-minY)+off[1],
                     state:'board', sp:'', pairId:-1, pairEnd:0,
                     rainbow:false, revealIdx:-1, grp:-1,
                     iceLeft:0, iceTotal:0, sealed:false, trayAt:0, locked:false, el:null,
                     zone:null };
          cards.push(card);
          padCards.push({ block:bi, idx:ci, card:card });
        }
      }
      continue;
    }
    var cells=base.slice(0,count);
    for(i=0;i<count;i++){
      var pos=cells[i] || base[0];
      cards.push({ id:cards.length, kind:'fruit', fruit:-1, layer:L,
                   x:(pos.x-minX)+off[0], y:(pos.y-minY)+off[1],
                   state:'board', sp:'', pairId:-1, pairEnd:0,
                   rainbow:false, revealIdx:-1, grp:-1,
                   iceLeft:0, iceTotal:0, sealed:false, trayAt:0, locked:false, el:null,
                   zone:null });
    }
  }
  var sp=cfg.special, bombInfo=null;
  if(sp==='bomb'){
    /* 炸弹垫优先：每块的一角放炸弹，同块另外 3 张就是它的爆破区
       （同层相邻、开局无遮挡、恰好整三张 —— 一眼就能看出炸弹会清掉哪 3 张）。 */
    if(padBlocks && padCards.length===cfg.seq[padTop]){
      var byBlock=[];
      padCards.forEach(function(e){ (byBlock[e.block]=byBlock[e.block]||[])[e.idx]=e.card; });
      var bombs=[], comps=[], bad=false;
      byBlock.forEach(function(bl){
        if(bad || !bl || bl.length!==4) { bad=true; return; }
        bl[0].kind='bomb'; bl[0].fruit=-1; bl[0].zone=null;
        bombs.push(bl[0]); comps.push([bl[1],bl[2],bl[3]]);
      });
      if(!bad && bombs.length===cfg.sp.n) bombInfo={ bombs:bombs, comps:comps, found:bombs.length, candN:bombs.length, pad:true };
    }
    if(!bombInfo) bombInfo=chooseBombs(cards, cfg, cfg.sp.n);
    if(bombInfo.found < cfg.sp.n){
      throw new Error('炸弹落点不足: '+bombInfo.found+'/'+cfg.sp.n+'（可选落点 '+bombInfo.candN+'）');
    }
    /* 把「开局快照」写进炸弹卡片：预览高亮与实际引爆共用同一份（第 8.2 节）。
       炸弹把 3 张水果的格位换成了炸弹卡片：总牌量不变、普通水果总数仍是 3 的倍数，
       而且炸弹落在开局就没有被压住的位置上，确认引爆前一定可点。 */
    bombInfo.bombs.forEach(function(bm,bi){
      bm.zone=(bombInfo.comps[bi]||[]).map(function(c){ return c.id; });
    });
  }

  /* ② 发水果：炸弹爆破区先成整组，其余按「互相远离、跨层级」成组 */
  var triples = assignFruits(cards, cfg.types, bombInfo ? bombInfo.comps : null);
  if(!triples) throw new Error('水果分配失败');

  /* ③ 减少「开局就能直接三消」的明显组合（炸弹爆破区除外，那本来就是整组） */
  var lockSnap={};
  computeLocked({ cards:cards, byId:{}, tray:[], pairs:[], cfg:cfg });
  cards.forEach(function(c){ lockSnap[c.id]=!!c.locked; });
  reduceInstantTriples(cards, bombInfo, function(id){ return !!lockSnap[id]; });
  computeLocked({ cards:cards, byId:{}, tray:[], pairs:[], cfg:cfg });
  cards.forEach(function(c){ if(c.kind==='fruit') c.grp=c.fruit; });

  var pairs=[], curtains=[];
  var fruitCards=cards.filter(function(c){ return c.kind==='fruit'; });
  var coveredNow=function(cc){
    return cards.some(function(o){
      return o!==cc && o.layer>cc.layer &&
             Math.abs(o.x-cc.x)<CARD && Math.abs(o.y-cc.y)<CARD;
    });
  };

  if(sp==='rainbow'){
    /* 彩虹覆盖层（第 9.1 / 9.4 节 / 第 1.2 节第 9 条）：
       盖在一张普通水果上，隐藏原水果、不进货栏、不作为万能水果；被盖的水果不能直接取走。
       同一款水果最多盖 1 张（避免整款被锁死），优先盖「开局看得见」的位置，
       每张记录 revealIdx 作为揭示顺序（第 9.4 节：保存底层水果与揭示顺序）。 */
    var byR={};
    fruitCards.forEach(function(c){ (byR[c.fruit]=byR[c.fruit]||[]).push(c); });
    var fs3=Object.keys(byR);
    shuffle(fs3);
    fs3.sort(function(a,b){ return byR[b].length-byR[a].length; });
    var want3=Math.min(cfg.sp.n, fs3.length, Math.max(1, triples.length-1));
    var ridx=0;
    for(i=0;i<fs3.length && ridx<want3;i++){
      var arr3=byR[fs3[i]];
      if(arr3.length<3) continue;
      arr3.sort(function(x,y){
        return (coveredNow(x)?1:0)-(coveredNow(y)?1:0) || (y.layer-x.layer);
      });
      arr3[0].rainbow=true; arr3[0].revealIdx=ridx++;
    }
    if(ridx<2) throw new Error('彩虹覆盖层不足: '+ridx);
  } else if(sp==='wax'){
    /* 封蜡（21.4.2）：封住的牌入栏后不参与凑三，所以要保证「同一款水果至少还有 2 张没被封」，
       玩家才能先取 2 张凑成三消，把最早入栏的那张解开。 */
    var byW={};
    fruitCards.forEach(function(c){ (byW[c.fruit]=byW[c.fruit]||[]).push(c); });
    var fw=Object.keys(byW).filter(function(f){ return byW[f].length>=3; });
    shuffle(fw);
    fw.sort(function(a,b){ return byW[b].length-byW[a].length; });
    var needW=cfg.sp.n, iw=0;
    while(needW>0 && iw<fw.length){
      var arrW=byW[fw[iw++]];
      var ordW=arrW.slice(); shuffle(ordW);
      ordW.sort(function(x,y){ return (coveredNow(x)?0:1)-(coveredNow(y)?0:1); });   /* 先封看得见的 */
      ordW[0].sp='wax'; needW--;
    }
  } else if(sp==='sameFruitLock'){
    /* 同果锁（7.5.2）：同一款水果不能全部上锁，必须留至少 1 张普通同类，
       玩家才能先取一张进货栏、满足「货栏里已有同类」的取牌条件。 */
    var byL={};
    fruitCards.forEach(function(c){ (byL[c.fruit]=byL[c.fruit]||[]).push(c); });
    var fl=Object.keys(byL);
    shuffle(fl);
    fl.sort(function(a,b){ return byL[b].length-byL[a].length; });
    var needL=cfg.sp.n, guardL=0;
    while(needL>0 && guardL++<300){
      var progressed=false;
      for(var kl=0; kl<fl.length && needL>0; kl++){
        var arrL=byL[fl[kl]];
        var lockedN=0;
        arrL.forEach(function(c){ if(c.sp==='lock') lockedN++; });
        if(lockedN >= arrL.length-1) continue;                  /* 同款必须留 1 张未锁 */
        var freeL=arrL.filter(function(c){ return c.sp!=='lock'; });
        var ordL=freeL.slice(); shuffle(ordL);
        ordL[0].sp='lock'; needL--; progressed=true;
      }
      if(!progressed) break;
    }
  } else if(sp==='pairedChain'){
    /* 双果链（第 7.1 节 / 第 1.2 节第 10 条）：
       两张不同水果、必须同一层级、中心距离 ≤ 1.5 个卡片单位（含斜角，即相邻或斜对角）；
       不允许跨层连接、远距离连线、同种水果配对，也不允许一张牌同时属于两条链。 */
    var cand2=[];
    for(var ia=0; ia<fruitCards.length; ia++){
      for(var ib=ia+1; ib<fruitCards.length; ib++){
        var A=fruitCards[ia], B=fruitCards[ib];
        if(A.fruit===B.fruit) continue;                          /* 必须不同种类 */
        if(A.layer!==B.layer) continue;                          /* 必须同层 */
        var dd=Math.hypot(A.x-B.x, A.y-B.y);
        if(dd>CHAIN_MAX_DIST+1e-9) continue;                      /* 中心距离 ≤ 1.5 单位 */
        cand2.push({ a:A, b:B, d:dd, cov:(coveredNow(A)?1:0)+(coveredNow(B)?1:0) });
      }
    }
    /* 先挑「两端都看得见、距离最近」的候选，避免生成出被压住或拉得太长的链。 */
    cand2.sort(function(x,y){ return (x.cov-y.cov) || (x.d-y.d) || (x.a.id-y.a.id); });
    var used2={}, pid=0;
    var wantP=Math.min(cfg.sp.n, Math.floor(fruitCards.length/4));
    for(var ic=0; ic<cand2.length && pairs.length<wantP; ic++){
      var e=cand2[ic];
      if(used2[e.a.id] || used2[e.b.id]) continue;                /* 每张水果最多属于一条链 */
      used2[e.a.id]=used2[e.b.id]=true;
      e.a.pairId=pid; e.a.pairEnd=0;
      e.b.pairId=pid; e.b.pairEnd=1;
      pairs.push({ id:pid, a:e.a.id, b:e.b.id, order:[e.a.id,e.b.id], broken:false });
      pid++;
    }
    /* 链条不能形成循环依赖，也不允许共用端点；这里每对端点唯一，天然无环。 */
    if(pairs.length<2) throw new Error('双果链对数不足: '+pairs.length);
  } else if(sp==='ice'){
    /* 冰冻（第 10 节）：邻消解冻，所以冰牌的「同层 1 格邻域」里要有尽量多不同款的水果
       （邻消来源多，解冻顺序才好找）；同分时优先「开局没有被上层压住」的牌，
       让玩家一开局就看得见冰层。
       v0.9 第二轮修正：冰牌既不能直接取、也不能敲（第 10.2 节只剩邻消解冻），
       如果开局的可见牌被冰铺满，玩家第一步就没有任何合法操作 —— 生成期直接死局。
       所以无遮挡的牌里必须留够 ICE_FREE_MIN 张非冰水果，超出的冰牌改放到
       「开局被上层压住」的牌上（玩家先把上面清掉，照样能看见冰、照样能邻消解冻）。 */
    var ICE_FREE_MIN=4;
    var scored=[];
    fruitCards.forEach(function(c){
      var groups={};
      cards.forEach(function(o){
        if(o===c || o.kind!=='fruit' || o.sp!=='') return;
        if(o.layer!==c.layer) return;
        if(Math.max(Math.abs(o.x-c.x), Math.abs(o.y-c.y))>UNIT) return;
        if(o.fruit===c.fruit) return;              /* 同款的邻消来源算同一个来源 */
        groups[o.fruit]=1;
      });
      scored.push({ c:c, n:Object.keys(groups).length, cov:coveredNow(c)?1:0 });
    });
    scored.sort(function(a,b){
      if(a.cov!==b.cov) return a.cov-b.cov;      /* ① 先要看得见 */
      if(b.n!==a.n) return b.n-a.n;              /* ② 再要邻消来源多 */
      return b.c.layer-a.c.layer;                /* ③ 同层冰更好找邻消来源 */
    });
    var cnt=0, picked;
    var uncovAll=0;
    scored.forEach(function(o){ if(!o.cov) uncovAll++; });
    var capUncov=Math.max(0, uncovAll-ICE_FREE_MIN);      /* 无遮挡牌里最多这么多张能变冰 */
    picked=[];
    var usedId={};
    for(i=0;i<scored.length && picked.length<cfg.sp.n;i++){
      if(scored[i].cov) continue;
      if(picked.length>=capUncov) continue;
      usedId[scored[i].c.id]=1; picked.push(scored[i].c);
    }
    for(i=0;i<scored.length && picked.length<cfg.sp.n;i++){
      if(scored[i].cov===0) continue;                     /* 无遮挡的已经选够了 */
      if(usedId[scored[i].c.id]) continue;
      usedId[scored[i].c.id]=1; picked.push(scored[i].c);
    }
    for(i=0;i<scored.length && picked.length<cfg.sp.n;i++){
      if(usedId[scored[i].c.id]) continue;                /* 实在不够才回头占用无遮挡的 */
      usedId[scored[i].c.id]=1; picked.push(scored[i].c);
    }
    function assignIce(c){ c.sp='ice'; c.iceTotal=cfg.sp.iceHits; c.iceLeft=cfg.sp.iceHits; }
    function clearIce(c){ c.sp=''; c.iceTotal=0; c.iceLeft=0; }
    function nonIceNeighbors(c){
      var n=0;
      cards.forEach(function(o){
        if(o===c || o.kind!=='fruit') return;
        if(o.layer!==c.layer) return;
        if(o.sp==='ice' && o.iceLeft>0) return;
        if(Math.max(Math.abs(o.x-c.x), Math.abs(o.y-c.y))>UNIT) return;
        n++;
      });
      return n;
    }
    picked.forEach(assignIce);
    /* 修一遍：如果某张冰牌的同层邻域被其他冰牌占满了，它就永远等不到邻消，
       所以把它退回普通牌，再从候选里补一张「邻域里还有非冰牌」的。
       （第 10.2 / Q24 节：只保留邻消解冻，生成阶段必须保证解冻顺序真的存在。） */
    var g2=0;
    while(g2++<120){
      var bad=null;
      for(i=0;i<picked.length;i++){ if(nonIceNeighbors(picked[i])<=0){ bad=picked[i]; break; } }
      if(!bad) break;
      clearIce(bad);
      picked.splice(picked.indexOf(bad),1);
      var added=false;
      for(i=0;i<scored.length;i++){
        var cand3=scored[i].c;
        if(cand3.sp==='ice') continue;
        assignIce(cand3);
        if(nonIceNeighbors(cand3)>0){ picked.push(cand3); added=true; break; }
        clearIce(cand3);
      }
      if(!added) break;
    }
    cnt=picked.length;
    if(cnt<2) throw new Error('冰冻牌不足: '+cnt);
  } else if(sp==='curtain'){
    var cid=0;
    for(var gi=0; gi<cfg.sp.groups; gi++){
      var cand=cards.filter(function(c){ return c.kind==='fruit'; });
      shuffle(cand);
      cand.sort(function(a,b){ return (a.locked?1:0)-(b.locked?1:0); });
      var bound={};
      curtains.forEach(function(k){ bound[k.cardId]=1; });
      var cnt2=0;
      for(i=0;i<cand.length && cnt2<cfg.sp.perGroup;i++){
        var cc=cand[i];
        if(bound[cc.id]) continue;
        curtains.push({ id:cid++, group:gi, cardId:cc.id, state:'bound', pending:'' });
        bound[cc.id]=1; cnt2++;
      }
    }
  }
  computeLocked({ cards:cards, byId:{}, tray:[], pairs:pairs, cfg:cfg });
  /* 开局必须至少有一个合法操作：一上来就没得点等于死局（第 5.1 节第 5 条：
     生成期就要用真实规则验证）。这里用的是与真实对局同一套 simMoves。 */
  var startCtx=newCtx(cfg, cards, pairs, curtains);
  computeLocked(startCtx);
  startCtx.freeSnap=freeSnapOf(startCtx);
  if(!simMoves(startCtx).length) throw new Error('开局无合法操作');
  return { cards:cards, pairs:pairs, curtains:curtains, unitsX:unitsX, unitsY:unitsY };
}

/* 生成 + 验证：验证不通过就换种子重试；再不行就把特殊对象收到「20% 下限」，
   绝不把特殊对象清零、也绝不放宽任何取牌规则（第 5.1 节第 5 条 / 第 5.3 节）。
   v0.9 起两轮都留在 20%～30% 区间内，不再出现 round2 直接 n=0 的降级。 */
function buildVerified(cfg){
  var attempts=[];
  var seeds=[(cfg.__seed||0)+11, (cfg.__seed||0)+29, (cfg.__seed||0)+53, (cfg.__seed||0)+97,
             (cfg.__seed||0)+131, (cfg.__seed||0)+173, (cfg.__seed||0)+211, (cfg.__seed||0)+257];
  var base=JSON.parse(JSON.stringify(cfg.sp));
  var rounds=[
    { tag:'目标密度', d: iceDensityFor(cfg.lv, base) },
    { tag:'密度下限', d:DENSITY_LO  }
  ];
  /* 冰冻关：先按本关设计的 1 次／2 次试；仍不行再退到「本关统一 1 次」。
     第 10.2 节允许 1 次或 2 次，只要求同一关统一且完整可解。 */
  if(base.type==='ice' && (base.iceHits||1)>1){
    rounds.push({ tag:'冰层1次', d:DENSITY_LO, iceHits:1 });
  }
  /* 21 关起的形状本来就是从池里随机取的，没有指定方向；
     当前形状怎么都过不了时，换一个形状重试（首批 20 关的形状方向不动）。 */
  if(cfg.lv>20){
    rounds.push({ tag:'换形状·方正', d:DENSITY_MID, shape:'square', iceHits:1 });
    rounds.push({ tag:'换形状·金字塔', d:DENSITY_LO, shape:'pyramid', iceHits:1 });
  }
  for(var round=0; round<rounds.length; round++){
    for(var s=0; s<seeds.length; s++){
      var localCfg=JSON.parse(JSON.stringify(cfg));
      localCfg.sp=JSON.parse(JSON.stringify(base));
      if(round>0){
        /* 收到 20% 下限：对象变少但仍存在，且仍是本关唯一特殊玩法 */
        var alt=planFor(cfg.lv, rounds[round].d);
        localCfg.sp=JSON.parse(JSON.stringify(alt.sp));
        if(rounds[round].shape){
          /* 炸弹关换形状时也必须保持「炸弹垫」布局，否则最上层张数对不上、炸弹垫铺不出来 */
          var sq=(alt.special==='bomb') ? bombLayoutFor(alt.total).seq : layerSeqTotal(alt.total, alt.layers);
          var gg=gridForLayerMax(rounds[round].shape, sq[0]);
          localCfg.shape=rounds[round].shape;
          localCfg.shapeName=(SHAPES[rounds[round].shape]||{}).n || rounds[round].shape;
          localCfg.gw=gg.gw; localCfg.gh=gg.gh; localCfg.seq=sq;
          localCfg.layers=sq.length;
          if(alt.special==='bomb') localCfg.total=sq[0]+18+15+BOMB_PAD_TOP;
        }
      }
      if(rounds[round].iceHits) localCfg.sp.iceHits=rounds[round].iceHits;
      var built;
      try{ built=genCards(localCfg, seeds[s]+round*733); }catch(err){ attempts.push('gen:'+err.message); continue; }
      var ctx=newCtx(localCfg, built.cards, built.pairs, built.curtains);
      var r=simulate(ctx, 90000);
      if(!r.ok){
        attempts.push(rounds[round].tag+' seed'+seeds[s]+':失败('+r.why+')');
        continue;
      }
      /* 炸弹关额外交付验证（第 8.5 节）：逐个炸弹从开局状态引爆一次，
         引爆后必须仍然存在真实可解路径 —— 不能只查开局总数。 */
      var bombBad='';
      try{ bombBad=verifyBombs(localCfg, built); }catch(err){ bombBad='校验异常:'+err.message; }
      if(bombBad){
        attempts.push(rounds[round].tag+' seed'+seeds[s]+':爆破后不可解('+bombBad+')');
        continue;
      }
      attempts.push(rounds[round].tag+' seed'+seeds[s]+':通过'+(r.mode==='beam'?'·多路':''));
      built.cfg=localCfg;
      built.verify={ ok:true, round:round, density:rounds[round].d, mode:r.mode||'greedy',
                     attempts:attempts, nodes:r.nodes, metrics:levelMetrics(localCfg, built) };
      return built;
    }
  }
  throw new Error('可解性验证失败: '+attempts.join(' | '));
}
/* 炸弹关：逐个炸弹从开局状态引爆一次，验证爆炸后仍存在真实可解路径（第 8.5 节）。
   注意：每次都必须在「盘面的副本」上引爆，否则会把真正要交付的关卡数据改坏。 */
function builtClone(built){
  return {
    cards: built.cards.map(function(c){
      var o={};
      for(var k in c) o[k]=c[k];
      o.el=null;
      return o;
    }),
    pairs: (built.pairs||[]).map(function(p){
      return { id:p.id, a:p.a, b:p.b, order:p.order.slice(), broken:p.broken };
    }),
    curtains: (built.curtains||[]).map(function(k){
      return { id:k.id, group:k.group, cardId:k.cardId, state:k.state, pending:k.pending };
    })
  };
}
function verifyBombs(cfg, built){
  if(cfg.special!=='bomb') return '';
  var bombs=built.cards.filter(function(c){ return c.kind==='bomb'; });
  if(bombs.length<BOMB_MIN) return '炸弹数量不足('+bombs.length+')';
  for(var i=0;i<bombs.length;i++){
    var copy=builtClone(built);
    var ctx=newCtx(cfg, copy.cards, copy.pairs, copy.curtains);
    var bc=ctx.byId[bombs[i].id];
    var r=canBoom(ctx, bc);
    if(!r.ok) return '炸弹'+bc.id+'无有效邻近目标('+r.why+')';
    var plan=bombPlan(ctx, bc);
    plan.bombs.forEach(function(b){ b.state='gone'; });
    plan.remove.forEach(function(o){ o.state='gone'; });
    computeLocked(ctx);
    ctx.tray=[];
    ctx.freeSnap=freeSnapOf(ctx);
    var after=simulate(ctx, 60000);
    if(!after.ok) return '炸弹'+bc.id+'引爆后:'+after.why;
  }
  return '';
}
/* 关卡体检指标：难度相关（第 1.2 节第 14 条）与特殊对象密度（第 1.2 节第 3 条） */
function levelMetrics(cfg, built){
  var cards=built.cards, i;
  var ctx=newCtx(cfg, cards, built.pairs, built.curtains);
  computeLocked(ctx);
  var fruit=cards.filter(function(c){ return c.kind==='fruit'; });
  var live=fruit.filter(function(c){ return c.state==='board'; });
  var unlocked=live.filter(function(c){ return !c.locked; });
  var sumLayer=0, types={}, lockMap={}, instant=0, instantNoBomb=0;
  fruit.forEach(function(c){ sumLayer+=c.layer+1; types[c.fruit]=1; });
  cards.forEach(function(c){ lockMap[c.id]=!!c.locked; });
  instant=instantTriplesOf(cards, function(id){ return !!lockMap[id]; });
  /* 炸弹靶区（zone）本来就是「设计给炸弹炸掉的整三张」，不算成开局送的三消组合，
     否则每个炸弹都会让难度指标凭空多出 1 组成三。 */
  var zoneIds={};
  cards.forEach(function(c){
    if(c.kind==='bomb' && c.zone) c.zone.forEach(function(id){ zoneIds[id]=1; });
  });
  instantNoBomb=instantTriplesOf(cards, function(id){ return !!lockMap[id] || !!zoneIds[id]; });
  var sp=cfg.special, spN=0;
  if(sp==='curtain')        spN=built.curtains.length;
  else if(sp==='bomb')      spN=cards.filter(function(c){ return c.kind==='bomb'; }).length;
  else if(sp==='rainbow')   spN=fruit.filter(function(c){ return c.rainbow; }).length;
  else if(sp==='pairedChain') spN=built.pairs.length*2;
  else                      spN=cards.filter(function(c){ return c.sp && c.sp!==''; }).length;
  return {
    fruitCards:fruit.length,
    types:Object.keys(types).length,
    layers:cfg.layers,
    avgLayer:+(sumLayer/Math.max(1,fruit.length)).toFixed(2),
    unlocked:unlocked.length,
    unlockedRatio:+(unlocked.length/Math.max(1,fruit.length)).toFixed(3),
    instantTriples:instant,
    instantTriplesNoBomb:instantNoBomb,
    bombZoneCards:Object.keys(zoneIds).length,
    spN:spN,
    spDensity:+(spN/Math.max(1,fruit.length)).toFixed(3),
    bombs:(sp==='bomb') ? cards.filter(function(c){ return c.kind==='bomb'; }).length : 0,
    pairs:built.pairs.length,
    rainbows:(sp==='rainbow') ? fruit.filter(function(c){ return c.rainbow; }).length : 0
  };
}
function degradeSpawn(sp){
  if(sp.n!==undefined) sp.n=Math.floor(sp.n/2);
  if(sp.perGroup!==undefined) sp.perGroup=Math.max(0, sp.perGroup-1);
}


/* ============================================================
   7. 运行时状态
   ============================================================ */
var $ = function (s) { return document.querySelector(s); };
var board=$('#board'), boardWrap=$('#boardWrap'), trayEl=$('#tray'), maskEl=$('#mask'), modalEl=$('#modal');

var level=1, coins=0, streak=0, best=0, unlocked=1, lastAwardedStreak=0;
var G=null;                       // 实时对局上下文（与验证用同一套规则函数）
var cfg=null, cfgBase=null;       // cfgBase = 本关初始配置（重试用同一种子）
var slotEls=[];
var unitsX=7, unitsY=7, cell=40, offX=0, offY=0;   /* offX/offY = 固定画布里的居中偏移（px） */
var tools={ shuffle:{free:0,stock:0}, undo:{free:0,stock:0}, scissor:{free:0,stock:0} };
var running=false, busy=false, busyAt=0, opSerial=0;
var paused=false, stuck=false, finalLock=false, finalCommitted=false, winGuard=false, endGuard=false;
var waxMeltCount=0;              /* 封蜡融化动效触发次数（验收用） */
var autoUnlockCount=0;           /* v0.11 第 1 项：死局自愈松开的同果锁张数（验收用） */
var autoUnlockLog=[];            /* v0.11 第 1 项：每次自愈的证据 [{lv, ids, before, after}] */
var teachUntil=0, curtainDown=[true,false];
var rngState=88675123;
var busyWatch=0;
var pendingTimers=[];
var flyEls=[], inFlight={};      // 正在飞的副本 + 正在飞的牌（飞完才落格）

function rndNext(){
  var x=rngState>>>0;
  x ^= x<<13; x>>>=0;
  x ^= x>>>17;
  x ^= x<<5;  x>>>=0;
  rngState=x;
  return x/4294967296;
}
function later(fn, ms){ var t=setTimeout(function(){ fn(); }, ms); pendingTimers.push(t); return t; }
function clearLater(){ pendingTimers.forEach(function(t){ clearTimeout(t); }); pendingTimers=[]; }

function setPhase(p){
  running = (p==='play' || p==='stuck');
  document.body.dataset.phase=p;
}

/* ============================================================
   8. 渲染
   ============================================================ */
function isPairLinked(c){
  if(!G || !c || c.pairId<0) return false;
  var p=G.pairs[c.pairId];
  return !!(p && !p.broken);
}
function cardHTML(c){
  var base;
  if(c.kind==='bomb') base=BOMB_SVG;
  /* 彩虹覆盖层（第 9.1 节）：整层盖住底下水果，不显示底层图案 */
  else if(c.rainbow) base=RAINBOW_MASK;
  else base=(FRUITS[c.fruit] ? FRUITS[c.fruit].s : '');
  var ov='';
  if(c.sp==='ice' && c.iceLeft>0) ov += '<div class="ov ice">'+ICE_OV+'</div>';
  if(c.sp==='wax') ov += '<div class="ov wax">'+WAX_OV+'</div>';
  if(c.sp==='lock') ov += '<div class="ov lock">'+LOCK_OV+'</div>';
  return base+ov;
}
function paintCard(c){
  if(!c.el) return;
  var cls='card';
  if(c.kind==='bomb') cls+=' sp-bomb';
  if(c.rainbow) cls+=' sp-rainbow';
  if(c.sp==='ice' && c.iceLeft>0) cls+=' sp-ice';
  c.el.className=cls + (c.locked?' locked':'') + (c.state!=='board'?' gone':'');
  c.el.setAttribute('data-type', c.rainbow ? -1 : c.fruit);
  c.el.setAttribute('data-layer', c.layer);
  c.el.innerHTML='<div class="face">'+cardHTML(c)+'</div>'
    + (c.sp==='ice' && c.iceLeft>0 ? '<span class="iceleft">'+c.iceLeft+'</span>' : '');
}
function renderBoard(){
  board.innerHTML='';
  /* 双果链连线画在牌下面（z-index 6），端扣画在牌上面 */
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('id','links');
  board.appendChild(svg);
  G.cards.forEach(function(c){
    var el=document.createElement('div');
    el.className='card';
    el.addEventListener('click', function(){ onCardClick(c); });
    if(c.kind==='bomb') bindBomb(el,c);
    board.appendChild(el);
    c.el=el;
    paintCard(c);
  });
  G.curtains.forEach(function(k){
    var el=document.createElement('div');
    el.className='curtainfx';
    board.appendChild(el);
    k.el=el; k._built=false; k._elDown=undefined;
  });
  placeCurtains();
}
function applyLocks(){
  G.cards.forEach(function(c){
    if(!c.el) return;
    c.el.classList.toggle('locked', !!c.locked);
    /* 棋盘可见性必须与状态严格一致：状态不在棋盘的牌一律不显示，
       避免出现「牌已进货栏、棋盘上还留着一张」的重复观感。 */
    c.el.classList.toggle('gone', c.state!=='board');
  });
}
/* 遮帘渲染（v0.10 第 1 项）：布帘结构只建一次，之后只切 down/up 两个 class，
   由 CSS transition 把「放下／收起」连续演出来。
   旧写法每次渲染都重刷 innerHTML，等于每帧把布帘重建一遍，过渡根本无从发生 —— 这就是
   「上下动画太僵硬」的根因。换目标时用 noanim 跳过本次过渡（避免布帘从旧牌滑到新牌的错觉），
   并保留一次 moved 淡入，避免「闪现」。 */
function renderCurtains(){
  if(!G) return;
  G.curtains.forEach(function(k){
    if(!k.el) return;
    var c=(k.state==='bound' && k.cardId>=0) ? G.byId[k.cardId] : null;
    if(!c || c.state!=='board'){
      k.el.style.display='none';
      k._elDown=undefined;                     /* 下次绑定时不播放滑动 */
      return;
    }
    var down=!!curtainDown[k.group];
    if(k.el.style.display==='none') k.el.style.display='';
    if(!k._built){ k.el.innerHTML=CURTAIN_STRUCT; k._built=true; }
    var bound=k.el.dataset.card;
    if(bound!==String(k.cardId)){
      k.el.dataset.card=String(k.cardId);
      k.el.classList.add('noanim');
      k.el.classList.toggle('up', !down);
      k.el.classList.toggle('down', down);
      void k.el.offsetWidth;
      k.el.classList.remove('noanim');
      k._elDown=down;
      if(bound!==undefined){
        k.el.classList.remove('moved'); void k.el.offsetWidth; k.el.classList.add('moved');
      }
    } else if(k._elDown!==down){
      k._elDown=down;
      k.el.classList.toggle('up', !down);
      k.el.classList.toggle('down', down);
    }
    k.el.dataset.layer=c.layer;
  });
  placeCurtains();
}
/* 棋盘冰层变化后必须重绘：applyLocks 只切 class，不会更新冰层数字与冰霜覆盖，
   否则会出现「规则已经减层、棋盘上看起来没融化」的观感（v0.9 观感修复）。 */
function repaintBoard(){
  if(!G) return;
  G.cards.forEach(function(c){
    if(!c.el) return;
    var wasIce=(c.iceTotal>0);                 /* 解冻后 sp 已清空，用 iceTotal 认这张曾是冰牌 */
    var prev=c._paintedIce;
    var wasRainbow=c._paintedRainbow;
    paintCard(c);
    /* 彩虹覆盖层刚被揭掉：闪一下「露出原水果」的揭示动效（第 9.3 节） */
    if(wasRainbow===true && !c.rainbow){
      c.el.classList.remove('revealfx'); void c.el.offsetWidth; c.el.classList.add('revealfx');
      (function(el){ later(function(){ if(el) el.classList.remove('revealfx'); }, 760); })(c.el);
    }
    c._paintedRainbow=!!c.rainbow;
    if(wasIce && prev!==undefined && prev>0){
      if(c.iceLeft<=0){

/* 遮帘位置必须跟着当前绑定走。原先只在 layout() 里定位，

function placeCurtains(){
  if(!G || !G.curtains.length) return;
  if(!(cell>0)) return;
  var size=Math.max(2, Math.round(CARD*cell));
  G.curtains.forEach(function(k){
    if(!k.el || k.state!=='bound') return;
    var c=G.byId[k.cardId];
    if(!c || c.state!=='board') return;
    k.el.style.width=size+'px';
    k.el.style.height=size+'px';
    k.el.style.transform='translate3d('+Math.round(c.x*cell)+'px,'+Math.round(c.y*cell)+'px,0)';

function renderLinks(){
  var svg=board.querySelector('#links');
  if(!svg) return;
  var bw=board.clientWidth||1, bh=board.clientHeight||1;
  svg.setAttribute('width', bw); svg.setAttribute('height', bh);

      + '<feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#5B4636" flood-opacity=".45"/></filter></defs>';
  G.pairs.forEach(function(p){
    if(p.broken) return;
    var a=G.byId[p.a], b=G.byId[p.b];
    if(!a||!b||a.state!=='board'||b.state!=='board') return;
    var ax=offX + a.x*cell+size/2, ay=offY + a.y*cell+size/2;
    var bx=offX + b.x*cell+size/2, by=offY + b.y*cell+size/2;
    var dx=bx-ax, dy=by-ay, d=Math.hypot(dx,dy)||1;
    h+='<line x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'" stroke="#8A7F6C" stroke-width="'+Math.max(3,size*0.10)+'" stroke-linecap="round" opacity=".9"/>';
    h+='<g filter="url(#lnsh)">';
    [ [ax,ay], [bx,by] ].forEach(function(pt){
      h+='<circle cx="'+(pt[0]+dx/d*size*0.34)+'" cy="'+(pt[1]+dy/d*size*0.34)+'" r="'+Math.max(4,size*0.13)+'" fill="#6B6154" stroke="#F4EADA" stroke-width="2"/>';
    });
    h+='</g>';
  });

}
/* 封蜡融化动效（v0.10 第 4 项）

   因为解封后这张牌可能紧接着就被下一次三消收走（第 21.4.1 节第 5 条要求立刻重查三消），
   如果融化画在卡片自己身上，就会被同一次结算直接抹掉、玩家什么都看不到。
   另外甩几滴蜡珠、飘一行「蜡壳融化」，让「解封」这件事看得见。 */
function waxMeltFx(slotEl, c){
  /* slotEl 允许为 null：解封后这张又在同一次结算里被三消收走时，货栏里已经找不到它了。
     这时把动效播在货栏中间 —— 位置仍然对（就是它刚消失的地方），也保证这条路径不漏播。 */

    (function(i){

      dp.style.top=Math.round(r.top + r.height*0.5)+'px';

/* 结算末尾统一补播封蜡融化动效。
   为什么不能「渲染时随手播」：解封和它引发的连锁三消发生在同一次 resolveMatchesLive()
   里，等渲染时那三张早已被收走，renderTray 的循环里根本看不到这张牌 ——
   「解封后立刻完成三消」这条路径（第 5 项）就会整条漏掉动效。
   所以改由规则层在 applyEliminateEvent 里留痕（ctx.__meltLog），这里统一播。
   动效本身是固定定位元素，不挂在槽位 DOM 上，所以先播后消也不会被抹掉。 */
function flushWaxMelt(){
  if(!G || !G.__meltLog || !G.__meltLog.length) return;
  var log=G.__meltLog.slice();
  G.__meltLog.length=0;
  log.forEach(function(c){
    var idx=G.tray.indexOf(c);
    waxMeltFx((idx>=0 && slotEls[idx]) ? slotEls[idx] : null, c);
  });
}
function renderTray(popIdx){

    var sl=slotEls[i], c=G.tray[i];
    /* 还在飞的牌：格子先空着。否则同一张牌会「棋盘/副本」和「货栏格」同时出现，
       连点时看起来就像卡牌没被取走、货栏里却已经有了（v0.9 观感修复）。 */
    if(c && inFlight[c.id]) c=null;
    if(c){
      var d=sl.firstChild;
      if(!d || !d.classList || !d.classList.contains('titem')){
        sl.innerHTML='';
        d=document.createElement('div');
        d.className='titem';
        sl.appendChild(d);
      }
      if(d.classList.contains('finalspin')){ continue; }   /* 收尾旋转中不改动该格 */
      d.className='titem'+(c.kind==='rainbow'?' sp-rainbow':'')+(c.sealed?' sealed':'');
      d.setAttribute('data-type', c.fruit);
      d.innerHTML=cardHTML(c)+(c.sealed?'<span class="badge wax">蜡</span>':'');
      if(i===popIdx){ d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop'); }
    } else {
      sl.innerHTML='';
    }

  var left=TRAY_N-G.tray.length;
  var w=$('#trayWarn');
