<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F7E3">
<title>聚果拾趣</title>
<style>
/* ============================================================
   聚果拾趣 v0.11 实现版
   规则层沿用：分层水果 + 七类特殊玩法（同果锁/双果链/遮帘/炸弹/彩虹/冰冻/封蜡）
     · 第 1 关起按 同果锁→双果链→遮帘→炸弹→彩虹→冰冻→封蜡 循环，每关只一种
     · 7 格货栏；最后一组三张自动收尾 + 第一张上浮旋转庆祝
   v0.11 两项：
     1 死局自愈：真的一步都走不动时，自动松开最少的同果锁牌让局面重新能动；
       没出现死局就一切照旧（不改生成密度、不改玩法强度）
         · 解法用规则层副本试算，救不活就完全不动，走原来的卡局/失败流程
     2 道具可用水果币购买：免费次数 + 连胜奖励库存用完后，可花水果币买 1 次
         · 返回 60 / 风车 80 / 剪刀 120；花币前弹确认，没用出去不扣币
   v0.10 六项：
     1 遮帘改成布帘连续上下滑动（不再瞬间换 innerHTML 硬切）
     2 固定棋盘画布 FRAME_X×FRAME_Y + 固定卡片尺寸，各关完全一致、内容居中
     3 所有文案提示停留 10 秒
     4 封蜡解封时的蜡壳融化动效（蜡壳 + 蜡珠 + 浮字）
     5 解封后立刻重查三消：蜡牌融化后若已凑三，自动完成该次三消
     6 最后三张自动收尾改用真实规则模拟判定（同果锁/双果链关也能触发）
   UI 层：水果森林主题背景，树枝／树叶贴边，棋盘中央保持干净
   移动端优先：100dvh / safe-area / 隐藏滚动条 / 禁双击缩放
   ============================================================ */
:root{
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);

  /* 水果森林 · 米白 + 草绿 + 暖木 */
  --paper:#FFF7E8;
  --paper2:#EDF3DC;
  --ink:#5B4636;
  --ink-soft:#8B7C5E;
  --green:#73965A;
  --green-l:#93B877;
  --green-d:#4E7241;
  --gold:#D89B3C;
  --line:#E2D3B4;
  --tile1:#FFFCF5;
  --tile2:#F5EBD6;
  --tilebd:#E2D2AE;
  --wood1:#EBDCB8;
  --wood2:#D6B482;
  --woodbd:#C4A877;
  --leaf:#7FA85F;
  --leaf-l:#9AC17C;
  --leaf-d:#628C4A;
  --bark:#B08346;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; overscroll-behavior:none;
  background:
    radial-gradient(120% 58% at 50% -12%, #FFFEF8 0%, rgba(255,255,255,0) 62%),
    radial-gradient(90% 46% at 8% 106%, rgba(127,168,95,.30), rgba(255,255,255,0) 70%),
    radial-gradient(90% 46% at 92% 106%, rgba(127,168,95,.26), rgba(255,255,255,0) 70%),
    linear-gradient(180deg, #F3F9E6 0%, var(--paper) 30%, #F8F2E0 64%, #EAF2D8 100%);
  background-attachment:fixed;
}

/* ===== 森林背景装饰（全部贴边，绝不压棋盘与货栏） ===== */
#bgdec{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.deco{ position:absolute; display:block; }
.deco.tl{ left:0;  top:0;    width:168px; height:126px; opacity:.94; }
.deco.tr{ right:0; top:0;    width:168px; height:126px; transform:scaleX(-1); opacity:.94; }
.deco.bl{ left:0;  bottom:0; width:178px; height:126px; opacity:.94; }
.deco.br{ right:0; bottom:0; width:178px; height:126px; transform:scaleX(-1); opacity:.94; }
.deco.side{ top:22%; width:44px; height:56%; opacity:.5; }
.deco.side.l{ left:0; }
.deco.side.r{ right:0; transform:scaleX(-1); }
#sunGlow{
  position:fixed; left:50%; top:-14%; width:min(520px,120vw); height:44vh;
  transform:translateX(-50%); z-index:0; pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,241,196,.55), rgba(255,241,196,0) 76%);
}

#app{
  position:relative; z-index:2;
  height:100vh; height:100dvh;
  max-width:560px; margin:0 auto;
  /* 第 4.2 节：信息区↔棋盘↔货栏↔道具栏 之间的间距固定 8px */
  display:flex; flex-direction:column; gap:8px;
  padding:
    calc(9px + var(--safe-t))
    calc(11px + env(safe-area-inset-right, 0px))
    calc(9px + var(--safe-b))
    calc(11px + env(safe-area-inset-left, 0px));
}

/* ===== 顶部 ===== */
header{ display:flex; align-items:center; justify-content:space-between; gap:7px; position:relative; z-index:2; }
/* 顶栏柔性白纱：背景枝叶贴边时也不影响标题可读性（绝对定位，不参与 flex 布局） */
header::before{
  content:""; position:absolute; left:-8px; right:-8px; top:-9px; bottom:-7px;
  border-radius:16px; pointer-events:none; z-index:-1;
  background:
    radial-gradient(120% 108% at 10% 50%, rgba(255,255,255,.86), rgba(255,255,255,.42) 54%, rgba(255,255,255,0) 80%),
    linear-gradient(180deg, rgba(255,255,255,.60), rgba(255,255,255,0));
}
.brand{ display:flex; align-items:center; gap:7px; }
.brand .logo{
  width:30px; height:30px; flex:0 0 auto; border-radius:10px;
  background:linear-gradient(180deg,#F6FBF0,#E4F0D4);
  border:1.5px solid #C7DCAC;
  box-shadow:0 1px 0 rgba(122,92,50,.14), inset 0 1px 0 #fff;
  display:flex; align-items:center; justify-content:center;
}
.brand .logo svg{ width:21px; height:21px; display:block; }
.brand h1{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  font-size:19px; font-weight:700; letter-spacing:2.5px; color:var(--green-d);
  text-shadow:0 1px 0 #fff; white-space:nowrap;
}
.brand .sub{ display:block; margin-top:1px; font-size:9.5px; letter-spacing:.6px; color:var(--ink-soft); white-space:nowrap; }
/* 顶栏右侧胶囊必须始终单行 —— 一旦换行，header 会被撑高，而 header 高度直接
   决定棋盘可用区，于是同一视口下不同关卡的 cell／卡片大小就会不一样
   （3 字玩法名「同果锁／双果链」在 320 窄屏上最容易把它挤到第二行）。
   窄屏的收窄规则见文件末尾的 @media。 */
.pills{ display:flex; flex-wrap:nowrap; gap:4px; justify-content:flex-end; min-width:0; }
.pill{
  display:inline-flex; align-items:center; gap:3px;
  background:rgba(255,255,255,.86); border:1px solid rgba(196,168,119,.55);
  padding:3px 8px; border-radius:999px;
  font-size:10.5px; color:var(--ink-soft); white-space:nowrap;
  box-shadow:0 1px 2px rgba(122,92,50,.10);
}
.pill b{ color:var(--ink); font-size:12.5px; font-weight:700; }
.pill.gold{ color:var(--gold); }
.pill.gold b{ color:#B57A22; }
.pill.shape{ color:var(--green-d); font-weight:700; }
.pill.sp{ color:#8A5A2B; font-weight:700; background:rgba(255,246,228,.94); border-color:rgba(216,155,60,.6); }
.pill.tap{ cursor:pointer; font-family:inherit; transition:transform .1s ease, background .15s ease; }
.pill.tap:active{ transform:scale(.95); }
.pill.tap:hover{ background:rgba(255,255,255,.99); }

/* ===== 棋盘 ===== */
#boardWrap{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
#table{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  border-radius:24px;
  background:
    radial-gradient(120% 80% at 50% 6%, rgba(255,255,255,.62), rgba(255,255,255,0) 66%),
    linear-gradient(180deg, rgba(247,242,226,.80), rgba(233,240,219,.52));
  border:1.5px solid rgba(180,160,116,.45);
  box-shadow:
    inset 0 2px 16px rgba(120,92,50,.10),
    0 4px 12px rgba(120,92,50,.08),
    0 1px 0 rgba(255,255,255,.85);
  pointer-events:none;
}
#board{ position:relative; }
#board::before{
  content:""; position:absolute; left:4%; right:4%; top:4%; bottom:4%;
  border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.62), rgba(255,255,255,0) 78%);
  pointer-events:none;
}
.card{ position:absolute; left:0; top:0; will-change:transform; cursor:pointer; }
.card::after{
  content:""; position:absolute; inset:0; border-radius:26%;
  background:rgba(58,46,28,0); transition:background .18s ease;
  pointer-events:none;
}
.card.locked::after{ background:rgba(58,46,28,.44); }
.card.gone{ display:none; }
.card.boom-range::after{ background:rgba(224,120,60,.22); border-radius:26%; }
.card.boom-target::after{ background:rgba(214,74,50,.34); }
.card.tap-anim .face{ transform:scale(.9); }

/* 牌面（卡片 / 飞行副本 / 货栏水果 共用） */
.face{
  position:absolute; inset:0; border-radius:26%;
  background:linear-gradient(180deg,var(--tile1) 16%, var(--tile2));
  border:1.5px solid var(--tilebd);
  box-shadow:0 2px 0 rgba(122,92,50,.20), 0 3px 7px rgba(122,92,50,.11), inset 0 1px 0 #fff;
  display:flex; align-items:center; justify-content:center;
  transition:transform .14s ease, box-shadow .18s ease, filter .18s ease;
  overflow:hidden;
}
.face > svg.fr{ width:78%; height:78%; display:block; }
.card:not(.locked):active .face{ transform:scale(.93); }
.card:not(.locked):hover .face{ box-shadow:0 3px 0 rgba(122,92,50,.22), 0 5px 12px rgba(122,92,50,.16), inset 0 1px 0 #fff; }

/* 飞向货栏的副本 */
.fly{ position:fixed; z-index:900; pointer-events:none; transition:transform .24s cubic-bezier(.35,.05,.25,1); }

/* ===== 七类特殊玩法的覆盖层 ===== */
.ov{ position:absolute; inset:0; border-radius:26%; pointer-events:none; overflow:hidden; }
.ov > svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }

/* ===== 遮帘（v0.10 第 1 项：布帘上下滑动，不再瞬间硬切） =====
   结构：.curtainfx（裁剪容器）> .rod（固定木杆）+ .cloth（会平移的布）
   下拉 = 布平移到 0 → 整张牌被盖住；收起 = 平移到 -84% → 只留顶部一段卷边。
   「放下」用加速（像布料自重落下），「收起」用带一点回弹的缓出（像被人拉起后松开）。 */
.curtainfx{
  position:absolute; pointer-events:none; border-radius:26%; overflow:hidden;
  background:linear-gradient(180deg, rgba(255,250,238,.34), rgba(240,228,204,.20));
}
.curtainfx .rod{
  position:absolute; left:-5%; right:-5%; top:-1.5%; height:7.5%; z-index:3;
  border-radius:999px;
  background:linear-gradient(180deg,#AE8449 0%,#8B6535 62%,#6F5028 100%);
  box-shadow:0 1px 2px rgba(60,44,24,.45), inset 0 1px 0 rgba(255,246,226,.45);
}
.curtainfx .cloth{
  position:absolute; left:0; right:0; top:0; height:118%;
  will-change:transform;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.070) 0 7%, rgba(255,255,255,.105) 7% 14%),
    linear-gradient(180deg,#D0AE7B 0%,#B28C55 44%,#A17D49 76%,#8E6C3D 100%);
  box-shadow:inset 0 -7px 9px rgba(90,66,34,.26), inset 0 2px 0 rgba(255,255,255,.34);
}
.curtainfx .cloth .roll{
  position:absolute; left:0; right:0; bottom:0; height:12%;
  background:linear-gradient(180deg, rgba(120,88,48,.06), rgba(120,88,48,.58));
  border-top:1px solid rgba(255,246,226,.34);
  box-shadow:0 -3px 7px rgba(60,44,24,.22);
}
.curtainfx .cloth .tie{
  position:absolute; left:9%; right:9%; height:6.5%;
  border-radius:999px; background:rgba(255,246,226,.40);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}
.curtainfx .cloth .tie.a{ top:31%; }
.curtainfx .cloth .tie.b{ top:63%; }
.curtainfx.down .cloth{
  transform:translateY(0);
  transition:transform .34s cubic-bezier(.46,.02,.74,.42);
}
.curtainfx.up .cloth{
  transform:translateY(-84%);
  transition:transform .46s cubic-bezier(.26,1.16,.38,1);
}
/* 换关整盘重建的首帧不打动画，避免「一进场布帘自己滑一遍」 */
.curtainfx.noanim .cloth{ transition:none !important; }
/* 遮帘换目标时淡入一次，避免「闪现」观感 */
.curtainfx.moved{ animation:curtainIn .34s ease-out; }
@keyframes curtainIn{ 0%{ opacity:0; } 100%{ opacity:1; } }

/* 同果锁：单张牌右上角锁扣 + 一圈局部缠绕（不连到别的牌） */
.ov.lock{ background:radial-gradient(120% 120% at 82% 82%, rgba(120,110,92,.24), rgba(120,110,92,0) 62%); }

/* 封蜡：可见水果 + 边缘凝蜡 + 角上一枚蜡印 */
.ov.wax{
  background:
    radial-gradient(46% 46% at 50% 50%, rgba(255,252,244,0) 52%, rgba(243,233,208,.86) 78%, rgba(226,210,172,.94) 100%);
  box-shadow:inset 0 0 0 2.5px rgba(206,188,152,.85);
}

/* 冰冻 */
.ov.ice{
  background:linear-gradient(180deg, rgba(186,224,244,.42), rgba(126,184,226,.40));
  box-shadow:inset 0 0 9px rgba(255,255,255,.9), inset 0 -6px 11px rgba(255,255,255,.5);
}
.sp-ice .face > svg{ filter:saturate(.55) brightness(1.06); }
.iceleft{
  position:absolute; left:-4px; bottom:-4px; z-index:6;
  min-width:17px; height:17px; padding:0 4px; border-radius:9px;
  background:#3E7EA8; color:#fff; font-size:10.5px; font-weight:700; line-height:17px; text-align:center;
  box-shadow:0 1px 3px rgba(24,48,66,.5);
}
/* 冰冻四种状态分别反馈（第 20 节：减少冰层、完全解冻、取牌要能分辨）：
   ① 冻着 = 冰壳加厚描边 + 不可点光标；② 减层 = 冰壳闪裂 + 次数角标弹跳；
   ③ 完全解冻 = 冰壳碎裂淡出 + 绿圈一闪（表示「现在可以取了」）；④ 点不动 = 蓝圈一闪。 */
.card.sp-ice{ cursor:not-allowed; }
.card.sp-ice .face{ box-shadow:inset 0 0 0 2px rgba(146,198,232,.92), 0 2px 0 rgba(86,70,52,.22); }
.card.icehit .ov.ice{ animation:iceCrack .62s ease-out; }
.card.icehit .iceleft{ animation:icePop .62s ease-out; }
@keyframes iceCrack{ 0%{opacity:1;} 30%{opacity:.26;} 62%{opacity:.92;} 100%{opacity:1;} }
@keyframes icePop{ 0%{transform:scale(1);} 38%{transform:scale(1.65);} 100%{transform:scale(1);} }
.ov.ice.meltfx{ animation:iceMelt .78s ease-out forwards; }
@keyframes iceMelt{
  0%{ opacity:1; transform:scale(1); }
  45%{ opacity:.85; transform:scale(1.07); }
  100%{ opacity:0; transform:scale(1.18); }
}
.card.icefree .face{ outline:3px solid rgba(126,200,120,0); outline-offset:-2px; animation:iceFree .86s ease-out; }
@keyframes iceFree{
  0%{ outline-color:rgba(126,200,120,.95); }
  100%{ outline-color:rgba(126,200,120,0); }
}
.card.iceshake .face{ outline:3px solid rgba(62,126,168,0); outline-offset:-3px; animation:iceDeny .46s ease-out; }
@keyframes iceDeny{
  0%,100%{ outline-color:rgba(62,126,168,0); }
  45%{ outline-color:rgba(62,126,168,.95); }
}
/* v0.11 第 1 项：死局自愈 —— 同果锁自动松开时闪一下。
   注意：卡片位置是用 transform 定位的，所以这里只动 outline / filter，不碰 transform。 */
.card.unlockfx .face{ outline:3px solid rgba(226,168,58,0); outline-offset:-2px; animation:unlockPop .95s ease-out; }
@keyframes unlockPop{
  0%{ outline-color:rgba(226,168,58,.96); filter:brightness(1.38) saturate(1.15); }
  58%{ outline-color:rgba(226,168,58,.62); filter:brightness(1.14) saturate(1.06); }
  100%{ outline-color:rgba(226,168,58,0); filter:brightness(1) saturate(1); }
}
/* 遮帘的换目标淡入与上下滑动动画定义在上面的「遮帘」段落里 */

/* 炸弹 */
.sp-bomb .face{ background:linear-gradient(180deg,#5A5A66,#33333C); border-color:#26262E;
  box-shadow:0 2px 0 rgba(28,28,34,.5), 0 3px 8px rgba(28,28,34,.3), inset 0 1px 0 rgba(255,255,255,.18); }
.sp-bomb .face > svg.fr{ width:74%; height:74%; }

/* 彩虹覆盖层（第 9 节）：盖住底下水果；被覆盖时取不动 */
.sp-rainbow .face{ background:linear-gradient(180deg,#FFFDF8,#EDF2FF); border-color:#CBD6F2; }
.card.sp-rainbow{ cursor:not-allowed; }
.card.sp-rainbow .face > svg.fr{ width:86%; height:86%; }
.card.revealfx .face{ animation:rainReveal .72s ease-out; }
@keyframes rainReveal{
  0%  { transform:scale(1);    box-shadow:0 0 0 0 rgba(120,170,230,0); }
  35% { transform:scale(1.08); box-shadow:0 0 0 6px rgba(120,170,230,.45); }
  100%{ transform:scale(1);    box-shadow:0 0 0 0 rgba(120,170,230,0); }
}
.card.rainshake .face{ outline:3px solid rgba(120,170,230,0); outline-offset:-3px; animation:rainDeny .46s ease-out; }
@keyframes rainDeny{
  0%,100%{ outline-color:rgba(120,170,230,0); }
  45%{ outline-color:rgba(120,170,230,.95); }
}

/* 炸弹确认条（第 8.2 节：先预览范围与实际清除目标，再次确认才引爆，取消不消耗） */
#boomBar{
  position:fixed; left:50%; bottom:16%; transform:translate(-50%,10px);
  z-index:1050; display:none; align-items:center; gap:7px;
  padding:7px 9px 7px 12px; border-radius:14px;
  background:rgba(42,34,22,.93); color:#FFF8E8;
  box-shadow:0 8px 20px rgba(42,34,22,.34);
  font-size:12px; max-width:92vw;
}
#boomBar.on{ display:flex; }
#boomMsg{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw; }
#boomBar button{
  font-family:inherit; font-size:12px; font-weight:700;
  padding:6px 11px; border-radius:9px; border:none; cursor:pointer;
}
#boomOk{ background:linear-gradient(180deg,#F08A5A,#D8542F); color:#fff; }
#boomNo{ background:rgba(255,255,255,.18); color:#FFF8E8; }
#boomBar button:active{ transform:scale(.96); }

/* 双果链：两端卡片朝伙伴一侧的挂钩 */
.hook{ position:absolute; z-index:7; width:30%; height:30%; }
.hook.l{ left:-6%; } .hook.r{ right:-6%; }
.hook.t{ top:-6%; } .hook.b{ bottom:-6%; }
.hook svg{ width:100%; height:100%; display:block; }
#links{ position:absolute; left:0; top:0; z-index:6; pointer-events:none; overflow:visible; }

/* 货栏里未解封的封蜡牌 */
.titem.sealed{ box-shadow:0 0 0 2.5px rgba(198,176,122,.9) inset, 0 1px 0 rgba(122,92,50,.18); }
.titem .badge{
  position:absolute; top:-5px; right:-5px; z-index:3;
  min-width:16px; height:16px; padding:0 4px;
  border-radius:9px; color:#fff; font-size:10px; font-weight:700; line-height:16px; text-align:center;
  box-shadow:0 1px 3px rgba(40,32,20,.45);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
.titem .badge.wax{ background:#A08A5C; font-size:11px; line-height:16px; }
.titem .badge.ice{ background:#3E7EA8; font-size:11px; line-height:16px; }

/* ===== 封蜡融化（v0.10 第 4 项）=====
   蜡牌被一次三消解封时：卡槽里的牌原地弹一下，同时在槽位上方叠一层正在融化的蜡壳
   （.waxshell 用固定定位，所以即使这张牌紧接着被三消收走，融化也照样看得见），
   再甩出几滴蜡珠。 */
.titem.waxmelt{ animation:waxMeltPop .72s cubic-bezier(.3,1.12,.42,1) both; }
@keyframes waxMeltPop{
  0%  { transform:scale(1); }
  26% { transform:scale(1.15); }
  58% { transform:scale(.965); }
  100%{ transform:scale(1); }
}
.titem.unsealed-flash{ box-shadow:0 0 0 3px rgba(216,155,60,.9), 0 0 12px rgba(216,155,60,.55); }
.waxshell{
  position:fixed; z-index:960; pointer-events:none; border-radius:26%; overflow:hidden;
  animation:waxShellMelt .8s ease-out forwards;
}
@keyframes waxShellMelt{
  0%  { opacity:1;   transform:scale(1)    translateY(0);     filter:blur(0); }
  36% { opacity:.94; transform:scale(1.07) translateY(1.5px); filter:blur(.4px); }
  100%{ opacity:0;   transform:scale(1.28) translateY(9px);   filter:blur(1.4px); }
}
.waxdrop{
  position:fixed; z-index:961; pointer-events:none;
  border-radius:52% 48% 46% 54% / 62% 60% 40% 38%;
  background:linear-gradient(180deg,#F7EFDA 0%,#E2D3AC 58%,#CBB88A 100%);
  box-shadow:0 1px 2px rgba(90,66,34,.30), inset 0 1px 0 rgba(255,255,255,.7);
  animation:waxDropFall .86s cubic-bezier(.4,.1,.7,.6) forwards;
}
@keyframes waxDropFall{
  0%  { opacity:0;  transform:translateY(-3px) scale(.55); }
  22% { opacity:.95; }
  100%{ opacity:0;  transform:translateY(24px) scale(1.05); }
}

/* ===== 货栏 ===== */
#trayBar{ position:relative; display:flex; flex-direction:column; gap:4px; }
.trayhead{
  display:flex; align-items:center; justify-content:space-between;
  padding:0 3px; font-size:10px; letter-spacing:.6px; color:var(--ink-soft);
}
.trayhead .warn{ color:#C4643C; font-weight:700; }
#tray{
  display:grid; grid-template-columns:repeat(7,1fr); gap:5px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 2px, rgba(255,255,255,0) 2px 9px),
    linear-gradient(180deg,var(--wood1),var(--wood2));
  border:1.5px solid var(--woodbd); border-radius:16px;
  padding:5px;
  box-shadow:inset 0 2px 5px rgba(120,92,50,.24), 0 2px 0 rgba(160,132,90,.20), 0 1px 0 rgba(255,255,255,.7);
}
.slot{
  position:relative; width:100%; height:0; padding-bottom:100%;
  border-radius:26%;
  background:rgba(255,253,244,.5);
  box-shadow:inset 0 1px 2px rgba(120,92,50,.18);
}
.slot > .titem{
  position:absolute; inset:0; border-radius:26%;
  background:linear-gradient(180deg,var(--tile1) 16%, var(--tile2));
  border:1.5px solid var(--tilebd);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 0 rgba(122,92,50,.18), inset 0 1px 0 #fff;
}
.slot > .titem > svg.fr{ width:78%; height:78%; display:block; }
.slot > .titem.sp-rainbow{ background:linear-gradient(180deg,#FFFDF8,#F4F6FF); border-color:#D8DCF0; }
.titem.pop{ animation:pop .22s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes pop{ from{ transform:scale(.55); opacity:.2 } to{ transform:scale(1); opacity:1 } }
.slot.hot{ background:rgba(216,155,60,.30); }

/* ===== 最终三消：本组第一张 上浮跳出 → 平滑 360° → 自然落回 ===== */
.slot{ z-index:1; }
.titem.finalspin{
  z-index:60; position:relative;
  animation:finalSpin 760ms cubic-bezier(.33,.02,.36,1) both;
  transform-origin:50% 62%;
}
@keyframes finalSpin{
  0%   { transform:translateY(0)     rotate(0deg)   scale(1)    }
  16%  { transform:translateY(-26px) rotate(26deg)  scale(1.05) }
  50%  { transform:translateY(-38px) rotate(182deg) scale(1.07) }
  82%  { transform:translateY(-20px) rotate(330deg) scale(1.03) }
  100% { transform:translateY(0)     rotate(360deg) scale(1)    }
}
#trayBar.celebrating .slot{ overflow:visible; }
#trayBar.celebrating{ z-index:5; }

/* ===== 道具 ===== */
#tools{ display:flex; gap:6px; position:relative; z-index:2; }
/* 道具栏柔性白纱：底部贴边枝叶不干扰按钮文字 */
#tools::before{
  content:""; position:absolute; left:-8px; right:-8px; top:-6px; bottom:-8px;
  border-radius:16px; pointer-events:none; z-index:-1;
  background:
    radial-gradient(80% 130% at 50% 116%, rgba(255,255,255,.78), rgba(255,255,255,.34) 58%, rgba(255,255,255,0) 82%),
    linear-gradient(0deg, rgba(255,255,255,.60), rgba(255,255,255,0));
}
.tool{
  position:relative; flex:1;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:7px 2px 6px;
  border-radius:14px;
  border:1.5px solid var(--line);
  background:linear-gradient(180deg,#FFFDF6,#F1E6CE);
  color:var(--ink); font-family:inherit;
  box-shadow:0 2px 0 rgba(122,92,50,.16);
  cursor:pointer;
  transition:transform .1s ease, box-shadow .1s ease;
}
.tool:active{ transform:translateY(2px); box-shadow:0 0 0 rgba(122,92,50,.16); }
.tool .ti{ font-size:16px; line-height:1; }
.tool .tn{ font-size:10.5px; letter-spacing:.4px; }
.tool .tc{
  position:absolute; top:-6px; right:-3px;
  min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--gold); color:#fff;
  font-size:10.5px; font-weight:700; line-height:17px; text-align:center;
  box-shadow:0 1px 3px rgba(122,92,50,.35);
}
.tool .tc.stock{ background:#73965A; }
/* v0.11 第 2 项：免费/库存已用完，徽章改显示水果币价格 */
.tool .tc.buy{ background:#C8891F; }
.tool .tc.nobuy{ background:#9A9384; }
.tool.canbuy{ border-color:#D8B978; }
.tool[disabled]{ opacity:.45; filter:grayscale(.55); box-shadow:0 1px 0 rgba(122,92,50,.10); }
.tool[disabled]:active{ transform:none; }

/* ===== 弹窗 / 提示 ===== */
#mask{
  position:fixed; inset:0; z-index:1000;
  background:rgba(46,38,24,.42);
  display:none; align-items:center; justify-content:center; padding:20px;
}
#mask.on{ display:flex; }
.modal{
  width:100%; max-width:344px; max-height:86vh; overflow:auto;
  background:linear-gradient(180deg,#FFFDF6,#F6ECD6);
  border:1.5px solid var(--woodbd); border-radius:18px;
  padding:19px 17px 16px;
  box-shadow:0 12px 30px rgba(46,38,24,.32);
  text-align:center;
  animation:rise .24s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes rise{ from{ transform:translateY(14px) scale(.97); opacity:0 } to{ transform:none; opacity:1 } }
.modal h3{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  font-size:19px; letter-spacing:1.6px; color:var(--green-d); font-weight:700;
}
.modal .mnote{ margin-top:7px; font-size:12.5px; line-height:1.75; color:var(--ink-soft); }
.modal .mnote b{ color:var(--ink); }
.modal .mnum{ margin-top:11px; display:flex; justify-content:center; gap:15px; flex-wrap:wrap; }
.modal .mnum div{ font-size:11px; color:var(--ink-soft); }
.modal .mnum b{ display:block; margin-top:2px; font-size:18px; color:var(--gold); }
.modal .mbtns{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.btn{
  padding:11px 15px; border-radius:12px; border:none;
  font-family:inherit; font-size:13.5px; font-weight:700; letter-spacing:.6px;
  cursor:pointer; transition:transform .1s ease;
}
.btn:active{ transform:scale(.97); }
.btn.main{ background:linear-gradient(180deg,var(--green-l),var(--green)); color:#fff; box-shadow:0 3px 0 var(--green-d); }
.btn.ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); font-weight:400; font-size:12.5px; }
.btn.coin{ background:linear-gradient(180deg,#E7B45E,var(--gold)); color:#fff; box-shadow:0 3px 0 #A9762A; }
.btn:disabled{ opacity:.55; cursor:default; }
.rules{ text-align:left; margin-top:9px; font-size:12px; line-height:1.8; color:var(--ink-soft); }
.rules li{ margin-left:15px; margin-bottom:4px; }
.rules b{ color:var(--ink); }
.rules .sp{ color:#8A5A2B; }

/* ===== 选关弹窗 ===== */
.lvbox{ margin-top:11px; text-align:left; }
.lvsec{ font-size:10.5px; letter-spacing:.8px; color:var(--ink-soft); margin:11px 0 5px; display:flex; justify-content:space-between; gap:6px; }
.lvsec:first-child{ margin-top:0; }
.lvgrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
.lvcell{
  position:relative; padding:9px 0;
  border-radius:10px; border:1.5px solid var(--line);
  background:linear-gradient(180deg,#FFFDF6,#F2E7CF);
  font-family:inherit; font-size:12.5px; color:var(--ink);
  box-shadow:0 1px 0 rgba(122,92,50,.14);
  cursor:pointer; transition:transform .1s ease;
}
.lvcell:active{ transform:scale(.95); }
.lvcell.done{ border-color:#B6CFB4; background:linear-gradient(180deg,#F2FAF0,#DFEFDA); color:#3E6B49; }
.lvcell.cur{ border-color:var(--gold); background:linear-gradient(180deg,#FFF7E4,#F8E7C2); color:#A9762A; font-weight:700; }
.lvcell.shut{ opacity:.6; color:#A2937A; background:linear-gradient(180deg,#F6F1E4,#EBE2CF); }
.lvcell .lk{ font-size:9.5px; opacity:.8; }
.lvcell .tag{
  position:absolute; top:-5px; right:-4px;
  min-width:15px; height:15px; padding:0 3px;
  border-radius:8px; background:var(--gold); color:#fff;
  font-size:9px; line-height:15px; text-align:center; font-weight:700;
}
.lvmore{
  margin-top:7px; width:100%; padding:9px;
  border-radius:10px; border:1.5px dashed var(--line);
  background:transparent; font-family:inherit; font-size:11.5px;
  color:var(--ink-soft); cursor:pointer;
}
.lvmore:active{ transform:scale(.98); }
.lvnothing{ font-size:11.5px; color:var(--ink-soft); padding:6px 0; }

#toast{
  position:fixed; left:50%; bottom:19%; transform:translate(-50%,8px);
  z-index:1100; pointer-events:none;
  padding:9px 15px; border-radius:999px;
  background:rgba(46,38,24,.86); color:#FFF8E8;
  font-size:12.5px; letter-spacing:.4px;
  max-width:88vw; text-align:center;
  opacity:0; transition:opacity .2s ease, transform .2s ease;
}
#toast.on{ opacity:1; transform:translate(-50%,0); }

.float{
  position:fixed; z-index:950; pointer-events:none;
  font-size:14.5px; font-weight:700; color:var(--gold);
  text-shadow:0 1px 3px rgba(122,92,50,.5), 0 0 2px #fff;
  animation:floatup .85s ease-out both; white-space:nowrap;
}
@keyframes floatup{
  from{ transform:translate(-50%,0) scale(.8); opacity:0 }
  25%{ opacity:1 }
  to{ transform:translate(-50%,-52px) scale(1.1); opacity:0 }
}

/* 窄屏：背景装饰再收一点，避免压到正文；并让顶栏保持单行。
   顶栏高度 = 棋盘可用区的一部分，只要它随玩法名长短变化，
   「同一视口下所有关卡卡片一样大」就会破功。窄屏放不下 4 个胶囊，
   所以隐藏副标题与连胜胶囊（纯装饰信息），把剩下的挤进一行。 */
@media (max-width:359px){
  .deco.tl,.deco.tr{ width:150px; height:118px; }
  .deco.bl,.deco.br{ width:158px; height:118px; }
  .brand .sub{ display:none; }
  .pill.streak{ display:none; }
  .pill{ font-size:9.5px; padding:2px 6px; gap:2px; }
  .pill b{ font-size:11.5px; }
}
@media (prefers-reduced-motion:reduce){
  .face, .card::after, .fly, .titem, .titem.pop, .modal, .float,
  .curtainfx .cloth, .waxshell, .waxdrop, .titem.waxmelt,
  .card.unlockfx .face{ transition:none !important; animation:none !important; }
  .titem.finalspin{ animation-duration:1ms !important; }
}

/* ============================================================
